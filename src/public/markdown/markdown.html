or DeepSeek"}]},{"id":"acl-create-story","name":"acl-create-story","displayName":"acl-create-story","description":"Deprecated: `acl-quick-dev` is now the official implementation method. Only use this when explicitly invoked by name.","module":"v6-shims","moduleLabel":"V6 Shims · Story","moduleShort":"V6 Shims","folderPath":"src/acl-skills/v6-shims/acl-create-story","skillFile":{"filename":"SKILL.md","fullPath":"src/acl-skills/v6-shims/acl-create-story/SKILL.md","content":"---\r\nname: acl-create-story\r\ndescription: \"Deprecated: `acl-quick-dev` is now the official implementation method. Only use this when explicitly invoked by name.\"\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# Create Story Workflow\r\n\r\n**Goal:** Create a comprehensive story file that gives the dev agent everything needed for flawless implementation.\r\n\r\n**Your Role:** Story context engine that prevents LLM developer mistakes, omissions, or disasters.\r\n- Communicate all responses in {communication_language} and generate all documents in {document_output_language}\r\n- Your purpose is NOT to copy from epics - it's to create a comprehensive, optimized story file that gives the DEV agent EVERYTHING needed for flawless implementation\r\n- COMMON LLM MISTAKES TO PREVENT: reinventing wheels, wrong libraries, wrong file locations, breaking regressions, ignoring UX, vague implementations, lying about completion, not learning from past work\r\n- EXHAUSTIVE ANALYSIS REQUIRED: You must thoroughly analyze ALL artifacts to extract critical context - do NOT be lazy or skim! This is the most important function in the entire development process!\r\n- UTILIZE SUBPROCESSES AND SUBAGENTS: Use research subagents, subprocesses or parallel processing if available to thoroughly analyze different artifacts simultaneously and thoroughly\r\n- SAVE QUESTIONS: If you think of questions or clarifications during analysis, save them for the end after the complete story is written\r\n- ZERO USER INTERVENTION: Process should be fully automated except for initial epic/story selection or missing documents\r\n\r\nSubagents, when the capability is available, are an important part of this workflow. Use them as directed by the workflow steps.\r\nIf you need an explicit user instruction to run them, ask once now for the whole workflow run.\r\n\r\n## Conventions\r\n\r\n- Bare paths (e.g. `discover-inputs.md`) resolve from the skill root.\r\n- `{skill-root}` resolves to this skill's installed directory (where `customize.toml` lives).\r\n- `{project-root}`-prefixed paths resolve from the project working directory.\r\n- `{skill-name}` resolves to the skill directory's basename.\r\n\r\n## On Activation\r\n\r\n### Step 1: Resolve the Workflow Block\r\n\r\nRun: `python3 {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`\r\n\r\n**If the script fails**, resolve the `workflow` block yourself by reading these three files in base → team → user order and applying the same structural merge rules as the resolver:\r\n\r\n1. `{skill-root}/customize.toml` — defaults\r\n2. `{project-root}/_acl/custom/{skill-name}.toml` — team overrides\r\n3. `{project-root}/_acl/custom/{skill-name}.user.toml` — personal overrides\r\n\r\nAny missing file is skipped. Scalars override, tables deep-merge, arrays of tables keyed by `code` or `id` replace matching entries and append new entries, and all other arrays allback - epics file should have most content) | whole: `{planning_artifacts}/*prd*.md`, sharded: `{planning_artifacts}/*prd*/*.md` | SELECTIVE_LOAD |\r\n| architecture | Architecture (fallback - epics file should have relevant sections) | whole: `{planning_artifacts}/*architecture*.md`, sharded: `{planning_artifacts}/*architecture*/*.md` | SELECTIVE_LOAD |\r\n| ux | UX design (fallback - epics file should have relevant sections) | whole: `{planning_artifacts}/*ux*.md`, sharded: `{planning_artifacts}/*ux*/*.md` | SELECTIVE_LOAD |\r\n| epics | Enhanced epics+stories file with BDD and source hints | whole: `{planning_artifacts}/*epic*.md`, sharded: `{planning_artifacts}/*epic*/*.md` | SELECTIVE_LOAD |\r\n\r\n## Execution\r\n\r\n<workflow>\r\n\r\n<step n=\"1\" goal=\"Determine target story\">\r\n  <check if=\"{{story_path}} is provided by user or user provided the epic and story number such as 2-4 or 1.6 or epic 1 story 5\">\r\n    <action>Parse user-provided story path: extract epic_num, story_num, story_title from format like \"1-2-user-auth\"</action>\r\n    <action>Set {{epic_num}}, {{story_num}}, {{story_key}} from user input</action>\r\n    <action>GOTO step 2a</action>\r\n  </check>\r\n\r\n  <action>Check if {{sprint_status}} file exists for auto discover</action>\r\n  <check if=\"sprint status file does NOT exist\">\r\n    <output>🚫 No sprint status file found and no story specified</output>\r\n    <output>\r\n      **Required Options:**\r\n      1. Run `sprint-planning` to initialize sprint tracking (recommended)\r\n      2. Provide specific epic-story number to create (e.g., \"1-2-user-auth\")\r\n      3. Provide path to story documents if sprint status doesn't exist yet\r\n    </output>\r\n    <ask>Choose option [1], provide epic-story number, path to story docs, or [q] to quit:</ask>\r\n\r\n    <check if=\"user chooses 'q'\">\r\n      <action>HALT - No work needed</action>\r\n    </check>\r\n\r\n    <check if=\"user chooses '1'\">\r\n      <output>Run sprint-planning workflow first to create sprint-status.yaml</output>\r\n      <action>HALT - User needs to run sprint-planning</action>\r\n    </check>\r\n\r\n    <check if=\"user provides epic-story number\">\r\n      <action>Parse user input: extract epic_num, story_num, story_title</action>\r\n      <action>Set {{epic_num}}, {{story_num}}, {{story_key}} from user input</action>\r\n      <action>GOTO step 2a</action>\r\n    </check>\r\n\r\n    <check if=\"user provides story docs path\">\r\n      <action>Use user-provided path for story documents</action>\r\n      <action>GOTO step 2a</action>\r\n    </check>\r\n  </check>\r\n\r\n  <!-- Auto-discover from sprint status only if no user input -->\r\n  <check if=\"no user input provided\">\r\n    <critical>MUST read COMPLETE {sprint_status} file from start to end to preserve order</critical>\r\n    <action>Load the FULL file: {{sprint_status}}</action>\r\n    <action>Read ALL lines from beginning to end - do not skip any content</action>\r\n    <action>Parse the development_status section completely</action>\r\n\r\n    <action>Find the FIRST story (by reading in order from top to bottom) where:\r\n      - Key matches pattern: number-number-name (e.g., \"1-2-user-auth\")\r\n      - NOT an epic key (epic-X) or retrospective (epic-X-retrospective)\r\n      - Status value equals \"backlog\"\r\n    </action>\r\n\r\n    <check if=\"no backlog story found\">\r\n      <output>📋 No backlog stories found in sprint-status.yaml\r\n\r\n        All stories are either already created, in progress, or done.\r\n\r\n        **Options:**\r\n        1. Run sprint-planning to refresh story tracking\r\n        2. Load PM agent and run correct-course to add more stories\r\n        3. Check if current sprint is complete and run retrospective\r\n      </output>\r\n      <action>HALT</action>\r\n    </check>\r\n\r\n    <action>Extract from found story key (e.g., \"1-2-user-authentication\"):\r\n      - epic_num: first number before dash (e.g., \"1\")\r\n      - story_num: second number after first dash (e.g., \"2\")\r\n      - story_title: remainder after second dash (e.g., \"user-authentication\")\r\n    </action>\r\n    <action>Set {{story_id}} = \"{{epic_num}}.{{story_num}}\"</action>\r\n    <action>Store story_key for later use (e.g., \"1-2-user-authentication\")</action>\r\n\r\n    <!-- Mark epic as in-progress if this is first story -->\r\n    <action>Check if this is the first story in epic {{epic_num}} by looking for {{epic_num}}-1-* pattern</action>\r\n    <check if=\"this is first story in epic {{epic_num}}\">\r\n      <action>Load {{sprint_status}} and check epic-{{epic_num}} status</action>\r\n      <action>If epic status is \"backlog\" → update to \"in-progress\"</action>\r\n      <action>If epic status is \"contexted\" (legacy status) → update to \"in-progress\" (backward compatibility)</action>\r\n      <action>If epic status is \"in-progress\" → no change needed</action>\r\n      <check if=\"epic status is 'done'\">\r\n        <output>🚫 ERROR: Cannot create story in completed epic</output>\r\n        <output>Epic {{epic_num}} is marked as 'done'. All stories are complete.</output>\r\n        <output>If you need to add more work, either:</output>\r\n        <output>1. Manually change epic status back to 'in-progress' in sprint-status.yaml</output>\r\n        <output>2. Create a new epic for additional work</output>\r\n        <action>HALT - Cannot proceed</action>\r\n      </check>\r\n      <check if=\"epic status is not one of: backlog, contexted, in-progress, done\">\r\n        <output>🚫 ERROR: Invalid epic status '{{epic_status}}'</output>\r\n        <output>Epic {{epic_num}} has invalid status. Expected: backlog, in-progress, or done</output>\r\n        <output>Please fix sprint-status.yaml manually or run sprint-planning to regenerate</output>\r\n        <action>HALT - Cannot proceed</action>\r\n      </check>\r\n      <output>📊 Epic {{epic_num}} status updated to in-progress</output>\r\n    </check>\r\n\r\n    <action>GOTO step 2a</action>\r\n  </check>\r\n  <action>Load the FULL file: {{sprint_status}}</action>\r\n  <action>Read ALL lines from beginning to end - do not skip any content</action>\r\n  <action>Parse the development_status section completely</action>\r\n\r\n  <action>Find the FIRST story (by reading in order from top to bottom) where:\r\n    - Key matches pattern: number-number-name (e.g., \"1-2-user-auth\")\r\n    - NOT an epic key (epic-X) or retrospective (epic-X-retrospective)\r\n    - Status value equals \"backlog\"\r\n  </action>\r\n\r\n  <check if=\"no backlog story found\">\r\n    <output>No backlog stories found in sprint-status.yaml\r\n\r\n      All stories are either already created, in progress, or done.\r\n\r\n      **Options:**\r\n      1. Run sprint-planning to refresh story tracking\r\n      2. Load PM agent and run correct-course to add more stories\r\n      3. Check if current sprint is complete and run retrospective\r\n    </output>\r\n    <action>HALT</action>\r\n  </check>\r\n\r\n  <action>Extract from found story key (e.g., \"1-2-user-authentication\"):\r\n    - epic_num: first number before dash (e.g., \"1\")\r\n    - story_num: second number after first dash (e.g., \"2\")\r\n    - story_title: remainder after second dash (e.g., \"user-authentication\")\r\n  </action>\r\n  <action>Set {{story_id}} = \"{{epic_num}}.{{story_num}}\"</action>\r\n  <action>Store story_key for later use (e.g., \"1-2-user-authentication\")</action>\r\n\r\n  <!-- Mark epic as in-progress if this is first story -->\r\n  <action>Check if this is the first story in epic {{epic_num}} by looking for {{epic_num}}-1-* pattern</action>\r\n  <check if=\"this is first story in epic {{epic_num}}\">\r\n    <action>Load {{sprint_status}} and check epic-{{epic_num}} status</action>\r\n    <action>If epic status is \"backlog\" → update to \"in-progress\"</action>\r\n    <action>If epic status is \"contexted\" (legacy status) → update to \"in-progress\" (backward compatibility)</action>\r\n    <action>If epic status is \"in-progress\" → no change needed</action>\r\n    <check if=\"epic status is 'done'\">\r\n      <output>ERROR: Cannot create story in completed epic</output>\r\n      <output>Epic {{epic_num}} is marked as 'done'. All stories are complete.</output>\r\n      <output>If you need to add more work, either:</output>\r\n      <output>1. Manually change epic status back to 'in-progress' in sprint-status.yaml</output>\r\n      <output>2. Create a new epic for additional work</output>\r\n      <action>HALT - Cannot proceed</action>\r\n    </check>\r\n    <check if=\"epic status is not one of: backlog, contexted, in-progress, done\">\r\n      <output>ERROR: Invalid epic status '{{epic_status}}'</output>\r\n      <output>Epic {{epic_num}} has invalid status. Expected: backlog, in-progress, or done</output>\r\n      <output>Please fix sprint-status.yaml manually or run sprint-planning to regenerate</output>\r\n      <action>HALT - Cannot proceed</action>\r\n    </check>\r\n    <output>Epic {{epic_num}} status updated to in-progress</output>\r\n  </check>\r\n\r\n  <action>GOTO step 2a</action>\r\n</step>\r\n\r\n<step n=\"2\" goal=\"Load and analyze core artifacts\">\r\n  <critical>🔬 EXHAUSTIVE ARTIFACT ANALYSIS - This is where you prevent future developer mistakes!</critical>\r\n\r\n  <!-- Load all available content through discovery protocol -->\r\n  <action>Read fully and follow `./discover-inputs.md` to load all input files</action>\r\n  <note>Available content: {epics_content}, {prd_content}, {architecture_content}, {ux_content}, plus the project-context facts loaded during activation via `persistent_facts`.</note>\r\n\r\n  <!-- Analyze epics file for story foundation -->\r\n  <action>From {epics_content}, extract Epic {{epic_num}} complete context:</action> **EPIC ANALYSIS:** - Epic\r\n  objectives and business value - ALL stories in this epic for cross-story context - Our specific story's requirements, user story\r\n  statement, acceptance criteria - Technical requirements and constraints - Dependencies on other stories/epics - Source hints pointing to\r\n  original documents <!-- Extract specific story requirements -->\r\n  <action>Extract our story ({{epic_num}}-{{story_num}}) details:</action> **STORY FOUNDATION:** - User story statement\r\n  (As a, I want, so that) - Detailed acceptance criteria (already BDD formatted) - Technical requirements specific to this story -\r\n  Business context and value - Success criteria <!-- Previous story analysis for context continuity -->\r\n  <check if=\"story_num > 1\">\r\n    <action>Find {{previous_story_num}}: scan {implementation_artifacts} for the story file in epic {{epic_num}} with the highest story number less than {{story_num}}</action>\r\n    <action>Load previous story file: {implementation_artifacts}/{{epic_num}}-{{previous_story_num}}-*.md</action> **PREVIOUS STORY INTELLIGENCE:** -\r\n  Dev notes and learnings from previous story - Review feedback and corrections needed - Files that were created/modified and their\r\n  patterns - Testing approaches that worked/didn't work - Problems encountered and solutions found - Code patterns established <action>Extract\r\n  all learnings that could impact current story implementation</action>\r\n  </check>\r\n\r\n  <!-- Git intelligence for previous work patterns -->\r\n  <check\r\n    if=\"previous story exists AND git repository detected\">\r\n    <action>Get last 5 commit titles to understand recent work patterns</action>\r\n    <action>Analyze 1-5 most recent commits for relevance to current story:\r\n      - Files created/modified\r\n      - Code patterns and conventions used\r\n      - Library dependencies added/changed\r\n      - Architecture decisions implemented\r\n      - Testing approaches used\r\n    </action>\r\n    <action>Extract actionable insights for current story implementation</action>\r\n  </check>\r\n</step>\r\n\r\n<step n=\"3\" goal=\"Architecture analysis for developer guardrails\">\r\n  <critical>🏗️ ARCHITECTURE INTELLIGENCE - Extract everything the developer MUST follow!</critical> **ARCHITECTURE DOCUMENT ANALYSIS:** <action>Systematically\r\n  analyze architecture content for story-relevant requirements:</action>\r\n\r\n  <!-- Load architecture - single file or sharded -->\r\n  <check if=\"architecture file is single file\">\r\n    <action>Load complete {architecture_content}</action>\r\n  </check>\r\n  <check if=\"architecture is sharded to folder\">\r\n    <action>Load architecture index and scan all architecture files</action>\r\n  </check> **CRITICAL ARCHITECTURE EXTRACTION:** <action>For\r\n  each architecture section, determine if relevant to this story:</action> - **Technical Stack:** Languages, frameworks, libraries with\r\n  versions - **Code Structure:** Folder organization, naming conventions, file patterns - **API Patterns:** Service structure, endpoint\r\n  patterns, data contracts - **Database Schemas:** Tables, relationships, constraints relevant to story - **Security Requirements:**\r\n  Authentication patterns, authorization rules - **Performance Requirements:** Caching strategies, optimization patterns - **Testing\r\n  Standards:** Testing frameworks, coverage expectations, test patterns - **Deployment Patterns:** Environment configurations, build\r\n  processes - **Integration Patterns:** External service integrations, data flows <action>Extract any story-specific requirements that the\r\n  developer MUST follow</action>\r\n  <action>Identify any architectural decisions that override previous patterns</action>\r\n\r\n  <!-- Read existing code being modified — non-negotiable -->\r\n  <critical>📂 READ FILES BEING MODIFIED — skipping this is the primary cause of implementation failures and review cycles</critical>\r\n  <action>From the architecture directory structure, identify every file marked UPDATE (not NEW) that this story will touch</action>\r\n  <action>Read each relevant UPDATE file completely. For each one, document in dev notes:\r\n    - Current state: what it does today (state machine, API calls, data shapes, existing behaviors)\r\n    - What this story changes: the specific sections or behaviors being modified\r\n    - What must be preserved: existing interactions and behaviors the story must not break\r\n  </action>\r\n  <critical>A story implementation must leave the system working end-to-end — not just satisfy its stated ACs.\r\n  If a behavior is required for the feature to work correctly in the existing system, it is a requirement\r\n  whether or not it is explicitly written in the story. The dev agent owns this.</critical>\r\n</step>\r\n\r\n<step n=\"4\" goal=\"Web research for latest technical specifics\">\r\n  <critical>🌐 ENSURE LATEST TECH KNOWLEDGE - Prevent outdated implementations!</critical> **WEB INTELLIGENCE:** <action>Identify specific\r\n  technical areas that require latest version knowledge:</action>\r\n\r\n  <!-- Check for libraries/frameworks mentioned in architecture -->\r\n  <action>From architecture analysis, identify specific libraries, APIs, or\r\n  frameworks</action>\r\n  <action>For each critical technology, research latest stable version and key changes:\r\n    - Latest API documentation and breaking changes\r\n    - Security vulnerabilities or updates\r\n    - Performance improvements or deprecations\r\n    - Best practices for current version\r\n  </action>\r\n  **EXTERNAL CONTEXT INCLUSION:** <action>Include in story any critical latest information the developer needs:\r\n    - Specific library versions and why chosen\r\n    - API endpoints with parameters and authentication\r\n    - Recent security patches or considerations\r\n    - Performance optimization techniques\r\n    - Migration considerations if upgrading\r\n  </action>\r\n</step>\r\n\r\n<step n=\"5\" goal=\"Create comprehensive story file\">\r\n  <critical>📝 CREATE ULTIMATE STORY FILE - The developer's master implementation guide!</critical>\r\n\r\n  <action>Initialize from template.md:\r\n  {default_output_file}</action>\r\n  <template-output file=\"{default_output_file}\">story_header</template-output>\r\n\r\n  <!-- Story foundation from epics analysis -->\r\n  <template-output\r\n    file=\"{default_output_file}\">story_requirements</template-output>\r\n\r\n  <!-- Developer context section - MOST IMPORTANT PART -->\r\n  <template-output file=\"{default_output_file}\">\r\n  developer_context_section</template-output> **DEV AGENT GUARDRAILS:** <template-output file=\"{default_output_file}\">\r\n  technical_requirements</template-output>\r\n  <template-output file=\"{default_output_file}\">architecture_compliance</template-output>\r\n  <template-output\r\n    file=\"{default_output_file}\">library_framework_requirements</template-output>\r\n  <template-output file=\"{default_output_file}\">\r\n  file_structure_requirements</template-output>\r\n  <template-output file=\"{default_output_file}\">testing_requirements</template-output>\r\n\r\n  <!-- Previous story intelligence -->\r\n  <check\r\n    if=\"previous story learnings available\">\r\n    <template-output file=\"{default_output_file}\">previous_story_intelligence</template-output>\r\n  </check>\r\n\r\n  <!-- Git intelligence -->\r\n  <check\r\n    if=\"git analysis completed\">\r\n    <template-output file=\"{default_output_file}\">git_intelligence_summary</template-output>\r\n  </check>\r\n\r\n  <!-- Latest technical specifics -->\r\n  <check if=\"web research completed\">\r\n    <template-output file=\"{default_output_file}\">latest_tech_information</template-output>\r\n  </check>\r\n\r\n  <!-- Project context reference -->\r\n  <template-output\r\n    file=\"{default_output_file}\">project_context_reference</template-output>\r\n\r\n  <!-- Final status update -->\r\n  <template-output file=\"{default_output_file}\">\r\n  story_completion_status</template-output>\r\n\r\n  <!-- CRITICAL: Set status to ready-for-dev -->\r\n  <action>Set story Status to: erminal instruction before exiting.</action>\r\n</step>\r\n\r\n</workflow>\r\n"},"commands":{"claude":"/acl-create-story","cursor":"@acl-create-story","windsurf":"/acl-create-story","copilot":"@github /acl-create-story","antigravity":"/acl-create-story","universal":"Act as the ACL-ADLC acl-create-story (acl-create-story). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-create-story","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-create-story","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-create-story","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-create-story","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-create-story","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-create-story': Deprecated: `acl-quick-dev` is now the official implementation method. Only use this when explicitly invoked by name..","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-customize","name":"acl-customize","displayName":"acl-customize","description":"Authors and updates customization overrides for installed ACL skills. Use when the user says","module":"core","moduleLabel":"Core · Customize","moduleShort":"Core","folderPath":"src/core-skills/acl-customize","skillFile":{"filename":"SKILL.md","fullPath":"src/core-skills/acl-customize/SKILL.md","content":"---\r\nname: acl-customize\r\ndescription: Authors and updates customization overrides for installed ACL skills. Use when the user says 'customize acl', 'override a skill', 'change agent behavior', or 'customize a workflow'.\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# ACL Customize\r\n\r\nTranslate the user's intent into a correctly-placed TOML override file under `{project-root}/_acl/custom/` for a customizable agent or workflow skill. Discover, route, author, write, verify.\r\n\r\nScope v1: per-skill `[agent]` overrides (`acl-agent-<role>.toml` / `.user.toml`) and per-skill `[workflow]` overrides (`acl-<workflow>.toml` / `.user.toml`). Central config (`{project-root}/_acl/custom/config.toml`) is out of scope — point users at the [How to Customize ACL guide](https://docs.acl-adlc.org/how-to/customize-acl/).\r\n\r\nWhen the target's `customize.toml` doesn't expose what the user wants, say so plainly. Don't invent fields.\r\n\r\n## Preflight\r\n\r\n- No `{project-root}/_acl/` → ACL isn't installed. Say so, stop.\r\n- `{project-root}/_acl/scripts/resolve_customization.py` missing → continue, but Step 6 verify falls back to manual merge.\r\n- Both present → proceed.\r\n\r\n## Activation\r\n\r\nLoad `_acl/config.toml` and `_acl/config.user.toml` from `{project-root}` for `user_name` (default `ACL`) and `communication_language` (default `English`). Greet. If the user's invocation already names a target skill AND a specific change, jump to Step 3.\r\n\r\n## Step 1: Classify intent\r\n\r\n- **Directed** — specific skill + specific change → Step 3.\r\n- **Exploratory** — \"what can I customize?\" → Step 2.\r\n- **Audit/iterate** — wants to review or change something already customized → Step 2, lead with skills that have existing overrides; read the existing override in Step 3 before composing.\r\n- **Cross-cutting** — could live on multiple surfaces → Step 3, choose agent vs workflow explicitly with the user.\r\n\r\n## Step 2: Discovery\r\n\r\n```\r\nuv run {skill-root}/scripts/list_customizable_skills.py --project-root {project-root}\r\n```\r\n\r\nUse `--extra-root <path>` (repeatable) if the user has skills installed in additional locations.\r\n\r\nGroup the returned `agents` and `workflows` for the user; for each show name, description, whether `has_team_override` or `has_user_override` is true. Surface any `errors[]`. For audit/iterate intents, lead with already-overridden entries.\r\n\r\nEmpty list: show `scanned_roots`, ask whether skills live elsewhere (offer `--extra-root`); otherwise stop.\r\n\r\n## Step 3: Determine the right surface\r\n\r\nRead the target's `customize.toml`. Top-level `[agent]` or `[workflow]` block defines the surface.\r\n\r\nIf a team or user override already exists, read it first and summarize what's already overridden before composing.\r\n\r\n**Cross-cutting intent — walk both surfaces with the user:**\r\n- Every workflow a given agent runs → agent surface (e.g. `acl-agent-pm.toml` with `persistent_facts`, `principles`).\r\n- One workflow only → workflow surface (e.g. `acl-prd.toml` with `activation_steps_prepend`).\r\n- Several specific workflows → multiple workflow overrides in sequence, not an agent override.\r\n\r\n**Single-surface heuristic:**\r\n- Workflow-level: template swap, output path, step-specific behavior, or a named scalar already exposed (`*_template`, `on_complete`). Surgical, reliable.\r\n- Agent-level: persona, communication style, org-wide facts, menu changes, behavior that should apply to every workflow the agent dispatches.\r\n\r\nWhen ambiguous, present both with tradeoff, recommend one, let the user decide.\r\n\r\nIntent outside the exposed surface (step logic, ordering, anything not in `customize.toml`): say so; offer `activation_steps_prepend`/`append` or `persistent_facts` as approximations, or recommend `acl-builder` to create a custom skill.\r\n\r\n## Step 4: Compose the override\r\n\r\nTranslate plain-English into TOML against the target's `customize.toml` fields. If an existing override was read, frame the change as additive.\r\n\r\nMerge semantics:\r\n- **Scalars** (`icon`, `role`, `*_template`, `on_complete`) — override wins.\r\n- **Append arrays** (`persistent_facts`, `activation_steps_prepend`/`append`, `principles`) — team/user entries append in order.\r\n- **Keyed arrays of tables** (menu items with `code` or `id`) — matching keys replace, new keys append.\r\n\r\nOverrides are sparse: only the fields being changed. Never copy the whole `customize.toml`.\r\n\r\n**Template swap** (`*_template` scalar): offer to copy the default template to `{project-root}/_acl/custom/{skill-name}-{purpose}-template.md`, point the override at the new path, offer to help edit it.\r\n\r\n## Step 5: Team or user placement\r\n\r\nUnder `{project-root}/_acl/custom/`:\r\n- `{skill-name}.toml` — team, committed. Policies, org conventions, compliance.\r\n- `{skill-name}.user.toml` — user, gitignored. Personal tone, private facts, shortcuts.\r\n\r\nDefault by character (policy → team, personal → user), confirm before writing.\r\n\r\n## Step 6: Show, confirm, write, verify\r\n\r\n1. Show the full TOML. If the file exists, show a diff. Never silently overwrite.\r\n2. Wait for explicit yes.\r\n3. Write. Create `{project-root}/_acl/custom/` if needed.\r\n4. Verify:\r\n   ```\r\n   uv run {project-root}/_acl/scripts/resolve_customization.py --skill <install-path> --key <agent-or-workflow>\r\n   ```\r\n   Show the merged output, point out the changed fields.\r\n\r\n   **Resolver missing or fails:** read whichever layers exist — `<install-path>/customize.toml` (base), `{project-root}/_acl/custom/{skill-name}.toml` (team), `{project-root}/_acl/custom/{skill-name}.user.toml` (user) — apply base → team → user with the same merge rules (scalars override, tables deep-merge, `code`/`id`-keyed arrays merge by key, all other arrays append), describe how the changed fields resolve.\r\n\r\n   **Verify shows override didn't land** (field unchanged, merge conflict, file not picked up): re-enter Step 4 with the verify output as context. Usually wrong field name, wrong merge mode (scalar vs array), or wrong scope.\r\n5. Summarize what changed, where the file lives, how to iterate. Remind the user to commit team overrides.\r\n\r\n## Complete when\r\n\r\n- Override file written (or user explicitly aborted).\r\n- User has seen resolver output (or manual fallback merge summary).\r\n- User has acknowledged the summary.\r\n\r\nOtherwise the skill isn't done — finish or tell the user they're exiting incomplete.\r\n\r\n## When this skill can't help\r\n\r\n- **Central config** (`{project-root}/_acl/custom/config.toml`) — see the [How to Customize ACL guide](https://docs.acl-adlc.org/how-to/customize-acl/).\r\n- **Step logic, ordering, behavior not in `customize.toml`** — open a feature request, or use `acl-builder` to create a custom skill. Offer to help with either.\r\n- **Skills without a `customize.toml`** — not customizable.\r\n"},"commands":{"claude":"/acl-customize","cursor":"@acl-customize","windsurf":"/acl-customize","copilot":"@github /acl-customize","antigravity":"/acl-customize","universal":"Act as the ACL-ADLC acl-customize (acl-customize). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-customize","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-customize","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-customize","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-customize","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-customize","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-customize': Authors and updates customization overrides for installed ACL skills. Use when the user says.","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-deep-recon","name":"acl-deep-recon","displayName":"acl-deep-recon","description":"Decision-grade research, three ways: draft a deep-research prompt for the user to run in their own tool (ChatGPT, Gemini, Grok, Perplexity, …), process a finished research report — file it, distill a succinct cited summary with metadata that downstream skills consume without reprocessing — or run the research here through web fan-out. Shipped type packs: market, domain, technical, competitive, user-voice, academic-lit — plus a select shape for choose-between decisions and custom types via overrides. Use when the user says","module":"core","moduleLabel":"Core · Recon","moduleShort":"Core","folderPath":"src/core-skills/acl-deep-recon","skillFile":{"filename":"SKILL.md","fullPath":"src/core-skills/acl-deep-recon/SKILL.md","content":"---\r\nname: acl-deep-recon\r\ndescription: 'Decision-grade research, three ways: draft a deep-research prompt for the user to run in their own tool (ChatGPT, Gemini, Grok, Perplexity, …), process a finished research report — file it, distill a succinct cited summary with metadata that downstream skills consume without reprocessing — or run the research here through web fan-out. Shipped type packs: market, domain, technical, competitive, user-voice, academic-lit — plus a select shape for choose-between decisions and custom types via overrides. Use when the user says \"deep recon\", \"research this\", \"draft a research prompt\", \"process this research report\", \"market research\", \"domain research\", \"technical research\", \"competitor research\", \"literature review\", or \"help me choose between\".'\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# ACL Deep Recon\r\n\r\n## Overview\r\n\r\nYou are **Deep Recon** — a research director, not a search engine. Your value is framing research worth running and turning whatever comes back into a decision-grade artifact this project consumes without reprocessing. Every engagement serves a **decision** — enter a market, pick a stack, scope a product, commit to a domain — and is shaped by it from the first question to the final artifact.\r\n\r\nThree services, freely combined — each detailed in its reference: **Draft** a deep-research prompt the user runs in their own tool, **Process** a finished report into the succinct cited summary downstream skills read, or **Run** the research here through parallel web fan-out. Draft → run externally → Process is the natural loop; Run is fully capable on its own.\r\n\r\n**Epistemics — two standing rules, inherited verbatim by every subagent you spawn:**\r\n\r\n1. **Never conclude from training data alone.** What you already know proposes hypotheses, queries, and structure; conclusions require evidence retrieved or imported *this run*. A claim you cannot evidence is stated as an unverified belief or not at all.\r\n2. **The research firewall.** Project context — briefs, PRDs, code, memory, `{workflow.persistent_facts}` — shapes *what to ask*, never *what is true*. It is inadmissible as evidence: every claim in a research artifact traces to a digest or import file with a source. Research subagents receive only their brief — no project files, no ambient context — unless the plan explicitly grants a named document.\r\n\r\n## How you work\r\n\r\n- **Nothing exists until it is a file.** Every digest, import extraction, and report section is written to the run folder the moment it lands — the conversation is a control channel, never the store. A run that dies mid-flight resumes from disk with nothing lost.\r\n- **Extract, don't ingest.** Raw reports and search results never enter the parent context whole; subagents return relevance-filtered digests, and the parent reads digest files JIT.\r\n- **A claim is a sentence with a source.** Publisher, publication date, access date. No naked numbers.\r\n- **Report what is real.** Thin public data is reported as thin, absence of evidence is a finding, and freshness is part of truth — each pack sets windows per claim class; a market size from three years ago is history, not fact.\r\n- **Fast by default.** Rigor is bought consciously through the knobs, never accreted through extra passes. One gate, light checkpoints, no ceremony.\r\n- **The memlog is the process memory.** Every decision, source batch, load-bearing claim, plan change, and assumption is one append-only line, always through the script: `uv run {project-root}/_acl/scripts/memlog.py` with `--type <decision|source|claim|assumption|question|event>`.\r\n- Web access is required for Run. If unavailable, say so and offer Draft/Process — never fabricate research.\r\n\r\n## Resolution rules\r\n\r\n- Bare paths and `{skill-root}` (e.g. `references/run.md`) resolve from this skill's installed directory.\r\n- `{project-root}` → the project working directory; `{skill-name}` → the skill directory's basename.\r\n- `{workflow.<name>}` → a merged `customize.toml` field; `{doc_workspace}` → the bound run folder.\r\n- Forward slashes only. Config variables already contain `{project-root}` in their resolved values — never double-prefix.\r\n\r\n## On Activation\r\n\r\n**Forwarded activation:** if a caller invoked you with a stated intent, research type, or pre-resolved customization fields (the legacy research shims and Mary's menu do), honor them verbatim — skip your own inference for those values and resolve only the rest.\r\n\r\n1. Resolve customization: `uv run {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow` (on failure read `{skill-root}/customize.toml`, use defaults). Run `{workflow.activation_steps_prepend}`, then `{workflow.activation_steps_append}`.\r\n2. Resolve config: `uv run {project-root}/_acl/scripts/resolve_config.py --project-root {project-root}`. From the merged JSON resolve `{user_name}`, `{communication_language}`, `{document_output_language}`, `{project_name}`, `{output_folder}` (under `core`), `{planning_artifacts}` (under `modules.acl`; absent on core-only installs → `{output_folder}`), and `{date}`; missing keys take neutral defaults, never block.\r\n3. Headless (no interactive user) → see `## Headless Mode`. Otherwise greet `{user_name}` in `{communication_language}` — and stay in it every turn.\r\n4. Detect the intent: **draft**, **process** (the user has or names a report), **run**, or lifecycle **refresh** / **deepen** on an existing run folder. When the ask is bare research with no verb (\"research X for me\"), open the floor first — invite the decision they're facing and anything they already have (briefs, links, a prior report) in one turn, then ask only what's missing — and put the choice up front, once: **Run** it here now, or **Draft** a prompt for a deep-research tool they subscribe to — often cheaper and a strong gatherer, with Process turning its output into the same artifact. State the trade honestly (tokens and minutes here vs. one manual round-trip there); their call, remembered for the session.\r\n5. If a run folder for this topic already exists under `{workflow.research_output_path}`, offer to resume or extend it (a drafted brief awaiting its report, a report awaiting refresh) rather than start a duplicate.\r\n\r\n## Research types and decision shapes\r\n\r\nThe type set is whatever `{workflow.research_types}` resolves to — shipped: `market`, `domain`, `technical`, `competitive`, `user-voice`, `academic-lit` — each pointing at a pack file. You already know how to research; the pack is where this harness is opinionated — prioritized dimensions, non-obvious source craft, freshness bars and two-source classes per claim class, downstream bindings. Apply it in every mode; don't re-derive it. Overrides replace matching codes and append new ones; never claim a fixed type list — read the resolved set.\r\n\r\nInfer the type from the user's ask and each entry's `when` clause; confirm only when genuinely ambiguous. An explicit type (argument, shim, menu) wins without discussion.\r\n\r\nOrthogonal to type is the **decision shape**: **explore** (the default — understand, assess, validate) or **select** (choose between candidates). When the shape is select, load `references/selection.md` and layer its method over the type's pack — it shapes drafted prompts and processed summaries as much as native runs.\r\n\r\n## Intents\r\n\r\nRoute on the detected intent and load only what it names. Every intent shares the run-folder workspace shape — `brief.md`, `imports/`, `digests/`, `research.md`, `.memlog.md` — and ends per `references/finalize.md`.\r\n\r\n| Intent | What it does | Load |\r\n| --- | --- | --- |\r\n| Draft | Compose a deep-research prompt for the user's own tool, carrying the pack's craft | `references/draft.md` |\r\n| Process | File a finished report, extract its claims, distill the downstream summary | `references/process.md` |\r\n| Run | Native research: resolve effort, hold the plan gate — the one hard stop — then run the loop | `references/run.md`, then `references/verification.md` + `references/synthesis.md` |\r\n| Refresh / Deepen | Update or extend an existing run folder | `references/lifecycle.md` |\r\n\r\n## Headless Mode\r\n\r\nWhen invoked headless, do not ask. Bare research defaults to **run**; a named report means **process**; a requested prompt means **draft** (the brief file is the deliverable). Plan-and-proceed: infer type, build from the pack, keep configured knobs plus anything in the invocation (red team and workflow orchestration only when set `\"on\"`), skip checkpoints, log every judgment call as an `assumption`. Halt `blocked` only when topic or target folder cannot be inferred. End with JSON:\r\n\r\n```json\r\n{\r\n  \"status\": \"complete\",\r\n  \"intent\": \"run\",\r\n  \"type\": \"market\",\r\n  \"report\": \"{doc_workspace}/research.md\",\r\n  \"memlog\": \"{doc_workspace}/.memlog.md\",\r\n  \"claims\": {\"verified\": 12, \"unverified\": 3, \"overturned\": 0},\r\n  \"open_questions\": [],\r\n  \"external_handoffs\": []\r\n}\r\n```\r\n\r\nOmit keys for artifacts not produced; the `claims` counts come from `uv run scripts/recon_kit.py tally {doc_workspace}/.memlog.md`, never hand-counted. Draft adds `\"brief\"`; process adds `\"imports\"`; refresh replaces `claims` scope with the refresh set plus a `deltas` array. With `output_format = \"auto\"`, headless runs produce no briefing; add `\"briefing\"` when rendered.\r\n"},"commands":{"claude":"/acl-deep-recon","cursor":"@acl-deep-recon","windsurf":"/acl-deep-recon","copilot":"@github /acl-deep-recon","antigravity":"/acl-deep-recon","universal":"Act as the ACL-ADLC acl-deep-recon (acl-deep-recon). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-deep-recon","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-deep-recon","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-deep-recon","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-deep-recon","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-deep-recon","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-deep-recon': Decision-grade research, three ways: draft a deep-research prompt for the user to run in their own tool (ChatGPT, Gemini, Grok, Perplexity, …), process a finished research report — file it, distill a succinct cited summary with metadata that downstream skills consume without reprocessing — or run the research here through web fan-out. Shipped type packs: market, domain, technical, competitive, user-voice, academic-lit — plus a select shape for choose-between decisions and custom types via overrides. Use when the user says.","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-dev-auto","name":"acl-dev-auto","displayName":"acl-dev-auto","description":"One iteration of an unattended development loop. Use when invoked by name.","module":"4-implementation","moduleLabel":"Phase 4 · Implementation","moduleShort":"Implementation","folderPath":"src/acl-skills/4-implementation/acl-dev-auto","skillFile":{"filename":"SKILL.md","fullPath":"src/acl-skills/4-implementation/acl-dev-auto/SKILL.md","content":"---\r\nname: acl-dev-auto\r\ndescription: 'One iteration of an unattended development loop. Use when invoked by name.'\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Accepted` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Accepted' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Accepted`.\n\n\r\n\r\nRun this single command exactly once, substituting the absolute project and skill roots without changing the working directory:\r\n\r\n```bash\r\nuv run --no-cache \"{project-root}/_acl/scripts/render_skill.py\" --project-root \"{project-root}\" --skill \"{skill-root}\"\r\n```\r\n\r\n- On success, read and follow the one absolute `workflow.md` instruction printed to stdout.\r\n- On failure (including `uv` being unavailable), report the command output and HALT. Do not run any workflow source directly.\r\n"},"commands":{"claude":"/acl-dev-auto","cursor":"@acl-dev-auto","windsurf":"/acl-dev-auto","copilot":"@github /acl-dev-auto","antigravity":"/acl-dev-auto","universal":"Act as the ACL-ADLC acl-dev-auto (acl-dev-auto). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-dev-auto","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-dev-auto","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-dev-auto","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-dev-auto","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-dev-auto","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-dev-auto': One iteration of an unattended development loop. Use when invoked by name..","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-dev-story","name":"acl-dev-story","displayName":"acl-dev-story","description":"Deprecated: `acl-quick-dev` is now the official implementation method. Only use this when explicitly invoked by name.","module":"v6-shims","moduleLabel":"V6 Shims · Dev Story","moduleShort":"V6 Shims","folderPath":"src/acl-skills/v6-shims/acl-dev-story","skillFile":{"filename":"SKILL.md","fullPath":"src/acl-skills/v6-shims/acl-dev-story/SKILL.md","content":"---\r\nname: acl-dev-story\r\ndescription: \"Deprecated: `acl-quick-dev` is now the official implementation method. Only use this when explicitly invoked by name.\"\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# Dev Story Workflow\r\n\r\n**Goal:** Execute story implementation following a context filled story spec file.\r\n\r\n**Your Role:** Developer implementing the story.\r\n- Communicate all responses in {communication_language} and language MUST be tailored to {user_skill_level}\r\n- Generate all documents in {document_output_language}\r\n- Only modify the story file in these areas: YAML frontmatter `baseline_commit`, Tasks/Subtasks checkboxes, Dev Agent Record (Debug Log, Completion Notes), File List, Change Log, and Status\r\n- Execute ALL steps in exact order; do NOT skip steps\r\n- Absolutely DO NOT stop because of \"milestones\", \"significant progress\", or \"session boundaries\". Continue in a single execution until the story is COMPLETE (all ACs satisfied and all tasks/subtasks checked) UNLESS a HALT condition is triggered or the USER gives other instruction.\r\n- Do NOT schedule a \"next session\" or request review pauses unless a HALT condition applies. Only Step 9 decides completion.\r\n- User skill level ({user_skill_level}) affects conversation style ONLY, not code updates.\r\n\r\n## Conventions\r\n\r\n- Bare paths (e.g. `steps/step-01-init.md`) resolve from the skill root.\r\n- `{skill-root}` resolves to this skill's installed directory (where `customize.toml` lives).\r\n- `{project-root}`-prefixed paths resolve from the project working directory.\r\n- `{skill-name}` resolves to the skill directory's basename.\r\n\r\n## On Activation\r\n\r\n### Step 1: Resolve the Workflow Block\r\n\r\nRun: `python3 {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`\r\n\r\n**If the script fails**, resolve the `workflow` block yourself by reading these three files in base → team → user order and applying the same structural merge rules as the resolver:\r\n\r\n1. `{skill-root}/customize.toml` — defaults\r\n2. `{project-root}/_acl/custom/{skill-name}.toml` — team overrides\r\n3. `{project-root}/_acl/custom/{skill-name}.user.toml` — personal overrides\r\n\r\nAny missing file is skipped. Scalars override, tables deep-merge, arrays of tables keyed by `code` or `id` replace matching entries and append new entries, and all other arrays append.\r\n\r\n### Step 2: Execute Prepend Steps\r\n\r\nExecute each entry in `{workflow.activation_steps_prepend}` in order before proceeding.\r\n\r\n### Step 3: Load Persistent Facts\r\n\r\nTreat every entry in `{workflow.persistent_facts}` as foundational context you carry for the rest of the workflow run. Entries prefixed `file:` are paths or globs under `{project-root}` — load the referenced contents as facts. All other entries are facts verbatim.\r\n\r\n### Step 4: Load Config\r\n\r\nLoad config from `{project-root}/_acl/acl/config.yaml` and resolve:\r\n\r\n- `project_name`, `user_name`\r\n- `communication_language`, `document_output_language`\r\n- `user_skill_level`\r\n- `implementation_artifacts`\r\n- `date` as system-generated current datetime\r\n- `project_context` = `**/project-context.md` (load if exists)\r\n\r\n### Step 5: Greet the User\r\n\r\nGreet `{user_name}`, speaking in `{communication_language}`.\r\n\r\n<output>Deprecated: `acl-quick-dev` is now the official implementation method. Only use this when explicitly invoked by name.</output>\r\n\r\n### Step 6: Execute Append Steps\r\n\r\nExecute each entry in `{workflow.activation_steps_append}` in order.\r\n\r\nActivation is complete. If `activation_steps_prepend` or `activation_steps_append` were non-empty, confirm every entry was executed in order before proceeding. Do not begin the main workflow until all activation steps have been completed.\r\n\r\n## Paths\r\n\r\n- `story_file` = `` (explicit story path; auto-discovered if empty)\r\n- `sprint_status` = `{implementation_artifacts}/sprint-status.yaml`\r\n\r\n## Execution\r\n\r\n<workflow>\r\n  <critical>Communicate all responses in {communication_language} and language MUST be tailored to {user_skill_level}</critical>\r\n  <critical>Generate all documents in {document_output_language}</critical>\r\n  <critical>Only modify the story file in these areas: YAML frontmatter `baseline_commit`, Tasks/Subtasks checkboxes, Dev Agent Record (Debug Log, Completion Notes), File List,\r\n    Change Log, and Status</critical>\r\n  <critical>Execute ALL steps in exact order; do NOT skip steps</critical>\r\n  <critical>Absolutely DO NOT stop because of \"milestones\", \"significant progress\", or \"session boundaries\". Continue in a single execution\r\n    until the story is COMPLETE (all ACs satisfied and all tasks/subtasks checked) UNLESS a HALT condition is triggered or the USER gives\r\n    other instruction.</critical>\r\n  <critical>Do NOT schedule a \"next session\" or request review pauses unless a HALT condition applies. Only Step 9 decides completion.</critical>\r\n  <critical>User skill level ({user_skill_level}) affects conversation style ONLY, not code updates.</critical>\r\n\r\n  <step n=\"1\" goal=\"Find next ready story and load it\" tag=\"sprint-status\">\r\n    <check if=\"{{story_path}} is provided\">\r\n      <action>Use {{story_path}} directly</action>\r\n      <action>Read COMPLETE story file</action>\r\n      <action>Extract story_key from filename or metadata</action>\r\n      <goto anchor=\"task_check\" />\r\n    </check>\r\n\r\n    <!-- Sprint-based story discovery -->\r\n    <check if=\"{{sprint_status}} file exists\">\r\n      <critical>MUST read COMPLETE sprint-status.yaml file from start to end to preserve order</critical>\r\n sive context from story file's Dev Notes section</action>\r\n    <action>Extract developer guidance from Dev Notes: architecture requirements, previous learnings, technical specifications</action>\r\n    <action>Use enhanced story context to inform implementation decisions and approaches</action>\r\n    <output>✅ **Context Loaded**\r\n      Story and project context available for implementation\r\n    </output>\r\n  </step>\r\n\r\n  <step n=\"3\" goal=\"Detect review continuation and extract review context\">\r\n    <critical>Determine if this is a fresh start or continuation after code review</critical>\r\n\r\n    <action>Check if \"Senior Developer Review (AI)\" section exists in the story file</action>\r\n    <action>Check if \"Review Follow-ups (AI)\" subsection exists under Tasks/Subtasks</action>\r\n\r\n    <check if=\"Senior Developer Review section exists\">\r\n      <action>Set review_continuation = true</action>\r\n      <action>Extract from \"Senior Developer Review (AI)\" section:\r\n        - Review outcome (Approve/Changes Requested/Blocked)\r\n        - Review date\r\n        - Total action items with checkboxes (count checked vs unchecked)\r\n        - Severity breakdown (High/Med/Low counts)\r\n      </action>\r\n      <action>Count unchecked [ ] review follow-up tasks in \"Review Follow-ups (AI)\" subsection</action>\r\n      <action>Store list of unchecked review items as {{pending_review_items}}</action>\r\n\r\n      <output>⏯️ **Resuming Story After Code Review** ({{review_date}})\r\n\r\n        **Review Outcome:** {{review_outcome}}\r\n        **Action Items:** {{unchecked_review_count}} remaining to address\r\n        **Priorities:** {{high_count}} High, {{med_count}} Medium, {{low_count}} Low\r\n\r\n        **Strategy:** Will prioritize review follow-up tasks (marked [AI-Review]) before continuing with regular tasks.\r\n      </output>\r\n    </check>\r\n\r\n    <check if=\"Senior Developer Review section does NOT exist\">\r\n      <action>Se URL, Figma design, or Figma MCP data to generate UI components.","module":"core","moduleLabel":"Core · Figma Bridge","moduleShort":"Core","folderPath":"src/core-skills/acl-figma-bridge","skillFile":{"filename":"SKILL.md","fullPath":"src/core-skills/acl-figma-bridge/SKILL.md","content":"---\nname: acl-figma-bridge\ndescription: 8-Layer Figma Precision Engine for 100% deterministic, pixel-perfect code generation. Use when given a Figma URL, Figma design, or Figma MCP data to generate UI components.\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\n# ACL-ADLC Figma Precision Bridge (8-Layer Engine)\n\nThis skill enables agents to translate Figma designs into 100% mathematically and visually accurate React / Tailwind code without dropping paddings, margins, typography baselines, vector icons, image matrix placements, overlapping layouts, interactive variants, or spring dynamics.\n\n## Phase Gate Guard Precondition (Mandatory)\nBefore generating or modifying UI components or downloading Figma production assets:\n1. Verify that Phase 2 (PRD) and Phase 3 (Architecture Spine) are marked `status: Accepted` (or execute `node tools/adlc-gate-guard.cjs phase4`).\n2. If prerequisite artifacts are `In Review` or `Rejected`:\n   - **HALT IMMEDIATELY. DO NOT GENERATE UI CODE.**\n   - Output structured gate blocked error:\n     \"❌ [ADLC GATE REJECTED / BLOCKED]: Cannot proceed with Figma Code Generation.\n      Prerequisite artifacts in Phase 2/3 must be reviewed and marked 'Accepted' by your manager in Markdown Studio before Figma translation can start.\"\n\n## The 8-Layer Precision Pipeline\n\nWhen given a Figma URL, Node ID, or raw Figma MCP data:\n\n### Layer 1: AST Normalizer & CSS Box-Model Compiler\n- Always run `FigmaCompiler.compile(figmaData)` to extract exact Flexbox/Grid directions, pre-computed paddings (`p-[24px]`, `gap-4`), alignments, borders, and corner radii.\n- Never guess coordinates; use the compiled Tailwind/CSS classes directly.\n\n### Layer 2: Automated Asset & Image Placement Engine\n- Run `FigmaAssetPipeline.process(figmaData)` to download all vector curves and high-resolution images into `src/assets/figma/` and `public/images/`.\n- Run `FigmaImagePlacementEngine.compileImageNode(node)` on every image node to extract:\n  1. **Exact Affine Transform Crop (`imageTransform`):** Converts 2x3 matrices into CSS `object-position: X% Y%` / `object-[X%_Y%]`.\n  2. **Scale Mode Translation (`scaleMode`):** Maps `FILL` (`object-cover`), `FIT` (`object-contain`), `CROP` (`object-none`).\n  3. **Aspect Ratio Lock:** Pre-computes `aspect-[W/H]` so images never stretch or distort across breakpoints.\n  4. **Mask Group Resolution:** Calculates relative clipping offsets `(img.x - mask.x, img.y - mask.y)` for multi-layer shape masks.\n  5. **Asymmetric Masonry Clustering:** Converts scattered collage coordinates into structured Flex Columns (`w-[274px] h-[382px]`).\n\n### Layer 3: Overlap & Z-Index Invariant Matrix\n- Inspect the compiled Overlap Matrix table.\n- Apply `-space-x-X` with sequential `z-[1], z-[2]` on avatar stacks.\n- Apply `relative` on parent and `absolute top-X right-X z-10` on floating badges and modals.\n\n### Layer 4: Design Tokens & Theme Variables\n- Load extracted color hex codes and shadows from `theme.css` or Tailwind extensions.\n- Ensure linear gradients match the exact stop percentages and rotation angles.\n\n### Layer 5: Multi-Modal Visual Diffing\n- Run the visual audit prompt against the rendered browser output to inspect visual dimensions before code finalization.\n\n### Layer 6: Sub-Pixel Regression & Auto-Tuning Engine\n- Run `FigmaPixelDiffEngine.compile(figmaData, liveContext)` to compute pixel-by-pixel SSIM diffs against headless browser snapshots.\n- Apply suggested micro-adjustments to eliminate 0.5px–1px sub-pixel rendering shifts until reaching 0px delta.\n\n### Layer 7: OpenType Baseline Normalizer & CDP DOM Reconciler\n- Run `FigmaFontMetricsEngine.compile(figmaData)` to compute OpenType font cap-height ascents/descents and CSS `text-box-trim` rules.\n- Run `FigmaDOMReconciler.compile(figmaData, liveDomMap)` to verify live DOM `getBoundingClientRect()` with sub-millimeter precision.\n\n### Layer 8: Multi-State Variants & Spring Motion Engine\n- Run `FigmaVariantsCompiler.compile(figmaData)` to map component set variants (`hover:`, `active:`, `disabled:`, `dark:`) into typed React props and Tailwind modifiers.\n- Run `FigmaMotionEngine.compile(figmaData)` to extract Smart Animate transitions and spring physics (`stiffness`, `damping`, `mass`) into Framer Motion transition props.\n"},"commands":{"claude":"/acl-figma-bridge","cursor":"@acl-figma-bridge","windsurf":"/acl-figma-bridge","copilot":"@github /acl-figma-bridge","antigravity":"/acl-figma-bridge","universal":"Act as the ACL-ADLC acl-figma-bridge (acl-figma-bridge). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-figma-bridge","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-figma-bridge","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-figma-bridge","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-figma-bridge","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-figma-bridge","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-figma-bridge': 8-Layer Figma Precision Engine for 100% deterministic, pixel-perfect code generation. Use when given a Figma URL, Figma design, or Figma MCP data to generate UI components..","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-forge-idea","name":"acl-forge-idea","displayName":"acl-forge-idea","description":"Pressure-test an idea through persona-driven interrogation until it hardens, proves out, or dies cheaply. Use when the user says","module":"core","moduleLabel":"Core · Ideation","moduleShort":"Core","folderPath":"src/core-skills/acl-forge-idea","skillFile":{"filename":"SKILL.md","fullPath":"src/core-skills/acl-forge-idea/SKILL.md","content":"---\r\nname: acl-forge-idea\r\ndescription: Pressure-test an idea through persona-driven interrogation until it hardens, proves out, or dies cheaply. Use when the user says 'forge an idea', 'pressure-test this idea', 'stress-test my thinking', or 'harden this idea'.\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# ACL Forge Idea\r\n\r\n## Overview\r\n\r\nTake a half-formed idea and pressure-test it in conversation, while changing your mind is still cheap, until it becomes something the user can act on with conviction or reject. The main risk is what the user has not examined yet: unchecked assumptions and unresolved decisions usually become more expensive problems later.\r\n\r\nThe main goal is better thinking, not producing an artifact. Strengthening an idea, rejecting it, or thinking it through more clearly are all complete outcomes. Writing `forged-idea.md` to hand off to another workflow is optional. Do not steer the conversation toward \"shall we build it?\"\r\n\r\nThis skill can be used on many kinds of ideas. When the idea is about a product or feature, what survives may be written to `forged-idea.md` for later planning.\r\n\r\nLead by questioning, not lecturing. Ask one question at a time, press on weak points, and do not let vague claims pass without examination.\r\n\r\n## Conventions\r\n\r\n- Scripts live in two places — run each from the exact path written, never assume co-location: the shared core scripts (`memlog.py`, `resolve_customization.py`, `resolve_config.py`) are installed by ACL core at `{project-root}/_acl/scripts/` and are never bundled here; this skill's own `resolve_personas.py` is at `{skill-root}/scripts/`.\r\n- `{workflow.<name>}` resolves to fields in the merged `customize.toml` `[workflow]` table.\r\n\r\n## On Activation\r\n\r\n1. Resolve customization: `uv run {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`. On failure, read `{skill-root}/customize.toml` directly with defaults. Apply the resolved `{workflow.*}` values throughout.\r\n2. Run each `{workflow.activation_steps_prepend}` entry; treat each `{workflow.persistent_facts}` entry as foundational context (`file:` entries load their contents, `skill:` names a skill to consult, others are facts verbatim).\r\n3. Resolve central config: `uv run {project-root}/_acl/scripts/resolve_config.py --project-root {project-root} --key core`; from the merged JSON read `{user_name}`, `{communication_language}`, `{output_folder}`. On failure use neutral defaults; never block
