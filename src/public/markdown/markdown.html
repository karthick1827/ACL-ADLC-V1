 **Review Before Done**: Stories should pass through `review` before `done`\r\n5. **Learning Transfer**: Developer typically creates next story after previous one is `done` to incorporate learnings\r\n"},"commands":{"claude":"/acl-sprint-planning","cursor":"@acl-sprint-planning","windsurf":"/acl-sprint-planning","copilot":"@github /acl-sprint-planning","antigravity":"/acl-sprint-planning","universal":"Act as the ACL-ADLC acl-sprint-planning (acl-sprint-planning). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-sprint-planning","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-sprint-planning","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-sprint-planning","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-sprint-planning","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-sprint-planning","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-sprint-planning': Generate sprint status tracking from epics. Use when the user says.","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-sprint-status","name":"acl-sprint-status","displayName":"acl-sprint-status","description":"Summarize sprint status and surface risks. Use when the user says","module":"4-implementation","moduleLabel":"Phase 4 · Implementation","moduleShort":"Implementation","folderPath":"src/acl-skills/4-implementation/acl-sprint-status","skillFile":{"filename":"SKILL.md","fullPath":"src/acl-skills/4-implementation/acl-sprint-status/SKILL.md","content":"---\r\nname: acl-sprint-status\r\ndescription: 'Summarize sprint status and surface risks. Use when the user says \"check sprint status\" or \"show sprint status\"'\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# Sprint Status Workflow\r\n\r\n**Goal:** Summarize sprint status, surface risks, and recommend the next workflow action.\r\n\r\n**Your Role:** You are a Developer providing clear, actionable sprint visibility. No time estimates — focus on status, risks, and next steps.\r\n\r\n## Conventions\r\n\r\n- Bare paths (e.g. `checklist.md`) resolve from the skill root.\r\n- `{skill-root}` resolves to this skill's installed directory (where `customize.toml` lives).\r\n- `{project-root}`-prefixed paths resolve from the project working directory.\r\n- `{skill-name}` resolves to the skill directory's basename.\r\n\r\n## On Activation\r\n\r\n### Step 1: Resolve the Workflow Block\r\n\r\nRun: `python3 {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`\r\n\r\n**If the script fails**, resolve the `workflow` block yourself by reading these three files in base → team → user order and applying the same structural merge rules as the resolver:\r\n\r\n1. `{skill-root}/customize.toml` — defaults\r\n2. `{project-root}/_acl/custom/{skill-name}.toml` — team overrides\r\n3. `{project-root}/_acl/custom/{skill-name}.user.toml` — personal overrides\r\n\r\nAny missing file is skipped. Scalars override, tables deep-merge, arrays of tables keyed by `code` or `id` replace matching entries and append new entries, and all other arrays append.\r\n\r\n### Step 2: Execute Prepend Steps\r\n\r\nExecute each entry in `{workflow.activation_steps_prepend}` in order before proceeding.\r\n\r\n### Step 3: Load Persistent Facts\r\n\r\nTreat every entry in `{workflow.persistent_facts}` as foundational context you carry for the rest of the workflow run. Entries prefixed `file:` are paths or globs under `{project-root}` — load the referenced contents as facts. All other entries are facts verbatim.\r\n\r\n### Step 4: Load Config\r\n\r\nLoad config from `{project-root}/_acl/acl/config.yaml` and resolve:\r\n\r\n- `project_name`, `user_name`\r\n- `communication_language`, `document_output_language`\r\n- `implementation_artifacts`\r\n- `date` as system-generated current datetime\r\n- `project_context` = `**/project-context.md` (load if exists)\r\n- YOU MUST ALWAYS SPEAK OUTPUT in your Agent communication style with the config `{communication_language}`\r\n\r\n### Step 5: Greet the User\r\n\r\nGreet `{user_name}`, speaking in `{communication_language}`.\r\n\r\n### Step 6: Execute Append Steps\r\n\r\nExecute each entry in `{workflow.activation_steps_append}` in order.\r\n\r\nActivation is complete. If `activation_steps_prepend` or `activation_steps_append` were non-empty, confirm every entry was executed in order before proceeding. Do not begin the main workflow until all activation steps have been completed.\r\n\r\n## Paths\r\n\r\n- `sprint_status_file` = `{implementation_artifacts}/sprint-status.yaml`\r\n\r\n## Input Files\r\n\r\n| Input | Path | Load Strategy |\r\n|-------|------|---------------|\r\n| Sprint status | `{sprint_status_file}` | FULL_LOAD |\r\n\r\n## Execution\r\n\r\n<workflow>\r\n\r\n<step n=\"0\" goal=\"Determine execution mode\">\r\n  <action>Set mode = {{mode}} if provided by caller; otherwise mode = \"interactive\"</action>\r\n\r\n  <check if=\"mode == data\">\r\n    <action>Jump to Step 20</action>\r\n  </check>\r\n\r\n  <check if=\"mode == validate\">\r\n    <action>Jump to Step 30</action>\r\n  </check>\r\n\r\n  <check if=\"mode == interactive\">\r\n    <action>Continue to Step 1</action>\r\n  </check>\r\n</step>\r\n\r\n<step n=\"1\" goal=\"Locate sprint status file\">\r\n  <action>Load {project_context} for project-wide patterns and conventions (if exists)</action>\r\n  <action>Try {sprint_status_file}</action>\r\n  <check if=\"file not found\">\r\n    <output>sprint-status.yaml not found.\r\nRun `/acl:acl:workflows:sprint-planning` to generate it, then rerun sprint-status.</output>\r\n    <action>Exit workflow</action>\r\n  </check>\r\n  <action>Continue to Step 2</action>\r\n</step>\r\n\r\n<step n=\"2\" goal=\"Read and parse sprint-status.yaml\">\r\n  <action>Read the FULL file: {sprint_status_file}</action>\r\n  <action>Parse fields: generated, last_updated, project, project_key, tracking_system, story_location</action>\r\n  <action>Parse development_status map. Classify keys:</action>\r\n- Epics: keys starting with \"epic-\" (and not ending with \"-retrospective\")\r\n- Retrospectives: keys ending with \"-retrospective\"\r\n- Stories: everything else (e.g., 1-2-login-form)\r\n  <action>Map legacy story status \"drafted\" → \"ready-for-dev\"</action>\r\n  <action>Count story statuses: backlog, ready-for-dev, in-progress, review, done</action>\r\n  <action>Map legacy epic status \"contexted\" → \"in-progress\"</action>\r\n  <action>Count epic statuses: backlog, in-progress, done</action>\r\n  <action>Count retrospective statuses: optional, done</action>\r\n  <action>Parse action_items list if present. Set open_action_items = entries with status \"open\" or \"in-progress\"</action>\r\n\r\n<action>Validate all statuses against known values:</action>\r\n\r\n- Valid story statuses: backlog, ready-for-dev, in-progress, review, done, drafted (legacy)\r\n- Valid epic statuses: backlog, in-progress, done, contexted (legacy)\r\n- Valid retrospective statuses: optional, done\r\n- Valid action item statuses: open, in-progress, done\r\n\r\n  <check if=\"any status is unrecognized\">\r\n    <output>\r\n**Unknown status detected:**\r\n{{#each invalid_entries}}\r\n\r\n- `{{key}}`: \"{{status}}\" (not recognized)\r\n  {{/each}}\r\n\r\n**Valid statuses:**\r\n\r\n- Stories: backlog, ready-for-dev, in-progress, review, done\r\n- Epics: backlog, in-progress, done\r\n- Retrospectives: optional, done\r\n- Action items: open, in-progress, done\r\n  </output>\r\n  <ask>How should these be corrected?\r\n  {{#each invalid_entries}}\r\n  {{@index}}. {{key}}: \"{{status}}\" → [select valid status]\r\n  {{/each}}\r\n\r\nEnter corrections (e.g., \"1=in-progress, 2=backlog\") or \"skip\" to continue without fixing:</ask>\r\n<check if=\"user provided corrections\">\r\n<action>Update sprint-status.yaml with corrected values</action>\r\n<action>Re-parse the file with corrected statuses</action>\r\n</check>\r\n</check>\r\n\r\n<action>Detect risks:</action>\r\n\r\n- IF any story has status \"review\": suggest `/acl:acl:workflows:code-review`\r\n- IF any story has status \"in-progress\" AND no stories have status \"ready-for-dev\": recommend staying focused on active story\r\n- IF all epics have status \"backlog\" AND no stories have status \"ready-for-dev\": recommend `acl-quick-dev` to start the first backlog story\r\n- IF `last_updated` timestamp is more than 7 days old (or `last_updated` is missing, fall back to `generated`): warn \"sprint-status.yaml may be stale\"\r\n- IF any story key doesn't match an epic pattern (e.g., story \"5-1-...\" but no \"epic-5\"): warn \"orphaned story detected\"\r\n- IF any epic has status in-progress but has no associated stories: warn \"in-progress epic has no stories\"\r\n  </step>\r\n\r\n<step n=\"3\" goal=\"Select next action recommendation\">\r\n  <action>Pick the next recommended workflow using priority:</action>\r\n  <note>When selecting \"first\" story: sort by epic number, then story number (e.g., 1-1 before 1-2 before 2-1)</note>\r\n  1. If any story status == in-progress → recommend `quick-dev` to resume the first in-progress story\r\n  2. Else if any story status == review → recommend `code-review` for the first review story\r\n  3. Else if any story status == ready-for-dev → recommend `quick-dev` to start work on the first ready-for-dev story\r\n  4. Else if any story status == backlog → recommend `quick-dev` to start the first backlog story\r\n  5. Else if any retrospective status == optional → recommend `retrospective`\r\n  6. Else → All implementation items done; congratulate the user - you both did amazing work together!\r\n  <action>Store selected recommendation as: next_story_id, next_workflow_id, next_agent (DEV)</action>\r\n</step>\r\n\r\n<step n=\"4\" goal=\"Display summary\">\r\n  <output>\r\n## Sprint Status\r\n\r\n- Project: {{project}} ({{project_key}})\r\n- Tracking: {{tracking_system}}\r\n- Status file: {sprint_status_file}\r\n\r\n**Stories:** backlog {{count_backlog}}, ready-for-dev {{count_ready}}, in-progress {{count_in_progress}}, review {{count_review}}, done {{count_done}}\r\n\r\n**Epics:** backlog {{epic_backlog}}, in-progress {{epic_in_progress}}, done {{epic_done}}\r\n\r\n**Next Recommendation:** /acl:acl:workflows:{{next_workflow_id}} ({{next_story_id}})\r\n\r\n{{#if open_action_items}}\r\n**Open Action Items:**\r\n{{#each open_action_items}}\r\n\r\n- {{action}} — {{status}} (epic {{epic}}, owner: {{owner}})\r\n  {{/each}}\r\n  {{/if}}\r\n\r\n{{#if risks}}\r\n**Risks:**\r\n{{#each risks}}\r\n\r\n- {{this}}\r\n  {{/each}}\r\n  {{/if}}\r\n\r\n  </output>\r\n  </step>\r\n\r\n<step n=\"5\" goal=\"Offer actions\">\r\n  <ask>Pick an option:\r\n1) Run recommended workflow now\r\n2) Show all stories grouped by status\r\n3) Show raw sprint-status.yaml\r\n4) Exit\r\nChoice:</ask>\r\n\r\n  <check if=\"choice == 1\">\r\n    <output>Run `/acl:acl:workflows:{{next_workflow_id}}`.\r\nIf the command targets a story, set `story_key={{next_story_id}}` when prompted.</output>\r\n  </check>\r\n\r\n  <check if=\"choice == 2\">\r\n    <output>\r\n### Stories by Status\r\n- In Progress: {{stories_in_progress}}\r\n- Review: {{stories_in_review}}\r\n- Ready for Dev: {{stories_ready_for_dev}}\r\n- Backlog: {{stories_backlog}}\r\n- Done: {{stories_done}}\r\n    </output>\r\n  </check>\r\n\r\n  <check if=\"choice == 3\">\r\n    <action>Display the full contents of {sprint_status_file}</action>\r\n  </check>\r\n\r\n  <check if=\"choice == 4\">\r\n    <action>Run: `python3 {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow.on_complete` — if the resolved value is non-empty, follow it as the final terminal instruction before exiting.</action>\r\n    <action>Exit workflow</action>\r\n  </check>\r\n</step>\r\n\r\n<!-- ========================= -->\r\n<!-- Data mode for other flows -->\r\n<!-- ========================= -->\r\n\r\n<step n=\"20\" goal=\"Data mode output\">\r\n  <action>Load and parse {sprint_status_file} same as Step 2</action>\r\n  <action>Compute recommendation same as Step 3</action>\r\n  <template-output>next_workflow_id = {{next_workflow_id}}</template-output>\r\n  <template-output>next_story_id = {{next_story_id}}</template-output>\r\n  <template-output>count_backlog = {{count_backlog}}</template-output>\r\n  <template-output>count_ready = {{count_ready}}</template-output>\r\n  <template-output>count_in_progress = {{count_in_progress}}</template-output>\r\n  <template-output>count_review = {{count_review}}</template-output>\r\n  <template-output>count_done = {{count_done}}</template-output>\r\n  <template-output>epic_backlog = {{epic_backlog}}</template-output>\r\n  <template-output>epic_in_progress = {{epic_in_progress}}</template-output>\r\n  <template-output>epic_done = {{epic_done}}</template-output>\r\n  <template-output>open_action_items = {{open_action_items}}</template-output>\r\n  <template-output>risks = {{risks}}</template-output>\r\n  <action>Return to caller</action>\r\n</step>\r\n\r\n<!-- ========================= -->\r\n<!-- Validate mode -->\r\n<!-- ========================= -->\r\n\r\n<step n=\"30\" goal=\"Validate sprint-status file\">\r\n  <action>Check that {sprint_status_file} exists</action>\r\n  <check if=\"missing\">\r\n    <template-output>is_valid = false</template-output>\r\n    <template-output>error = \"sprint-status.yaml missing\"</template-output>\r\n    <template-output>suggestion = \"Run sprint-planning to create it\"</template-output>\r\n    <action>Return</action>\r\n  </check>\r\n\r\n<action>Read and parse {sprint_status_file}</action>\r\n\r\n<action>Validate required metadata fields exist: generated, project, project_key, tracking_system, story_location (last_updated is optional for backward compatibility)</action>\r\n<check if=\"any required field missing\">\r\n<template-output>is_valid = false</template-output>\r\n<template-output>error = \"Missing required field(s): {{missing_fields}}\"</template-output>\r\n<template-output>suggestion = \"Re-run sprint-planning or add missing fields manually\"</template-output>\r\n<action>Return</action>\r\n</check>\r\n\r\n<action>Verify development_status section exists with at least one entry</action>\r\n<check if=\"development_status missing or empty\">\r\n<template-output>is_valid = false</template-output>\r\n<template-output>error = \"development_status missing or empty\"</template-output>\r\n<template-output>suggestion = \"Re-run sprint-planning or repair the file manually\"</template-output>\r\n<action>Return</action>\r\n</check>\r\n\r\n<action>Validate all status values against known valid statuses:</action>\r\n\r\n- Stories: backlog, ready-for-dev, in-progress, review, done (legacy: drafted)\r\n- Epics: backlog, in-progress, done (legacy: contexted)\r\n- Retrospectives: optional, done\r\n- Action items (if present): open, in-progress, done\r\n  <check if=\"any invalid status found\">\r\n  <template-output>is_valid = false</template-output>\r\n  <template-output>error = \"Invalid status values: {{invalid_entries}}\"</template-output>\r\n  <template-output>suggestion = \"Fix invalid statuses in sprint-status.yaml\"</template-output>\r\n  <action>Return</action>\r\n  </check>\r\n\r\n<template-output>is_valid = true</template-output>\r\n<template-output>message = \"sprint-status.yaml valid: metadata complete, all statuses recognized\"</template-output>\r\n<action>Run: `python3 {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow.on_complete` — if the resolved value is non-empty, follow it as the final terminal instruction before exiting.</action>\r\n</step>\r\n\r\n</workflow>\r\n"},"commands":{"claude":"/acl-sprint-status","cursor":"@acl-sprint-status","windsurf":"/acl-sprint-status","copilot":"@github /acl-sprint-status","antigravity":"/acl-sprint-status","universal":"Act as the ACL-ADLC acl-sprint-status (acl-sprint-status). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-sprint-status","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-sprint-status","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-sprint-status","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-sprint-status","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-sprint-status","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-sprint-status': Summarize sprint status and surface risks. Use when the user says.","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-technical-research","name":"acl-technical-research","displayName":"acl-technical-research","description":"Deprecated — forwards to acl-deep-recon (technical type).","module":"v6-shims","moduleLabel":"V6 Shims · Research","moduleShort":"V6 Shims","folderPath":"src/acl-skills/v6-shims/acl-technical-research","skillFile":{"filename":"SKILL.md","fullPath":"src/acl-skills/v6-shims/acl-technical-research/SKILL.md","content":"---\r\nname: acl-technical-research\r\ndescription: 'Deprecated — forwards to acl-deep-recon (technical type).'\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# DEPRECATED — forwards to acl-deep-recon (technical type)\r\n\r\nThis skill was consolidated into `acl-deep-recon`. It is retained as a thin compatibility shim so existing invocations by name and `_acl/custom/acl-technical-research.toml` override files keep working. New work should invoke `acl-deep-recon` directly — it drafts deep-research prompts for outside tools, processes finished reports into downstream-ready summaries, and runs research directly, across market, domain, technical, competitive, user-voice, and academic-lit types (plus a select shape for choose-between decisions and custom types).\r\n\r\n## On Activation\r\n\r\n1. Resolve customization: `uv run {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`. This picks up any `{project-root}/_acl/custom/acl-technical-research.toml` and `acl-technical-research.user.toml` overrides for the legacy fields (`activation_steps_prepend`, `activation_steps_append`, `persistent_facts`, `on_complete`).\r\n2. Emit a deprecation notice to the user (in their configured communication language): `acl-technical-research` is deprecated and forwards to `acl-deep-recon` with the technical type. To silence this notice and access the full new surface (draft/process/run modes, research types, verification levels, HTML briefing, handoffs), migrate `_acl/custom/acl-technical-research.toml` to `_acl/custom/acl-deep-recon.toml` and invoke `acl-deep-recon` directly.\r\n3. Invoke `acl-deep-recon` with: **research type** `technical` (skip its type inference), the four legacy fields above as pre-resolved values, and the user's original input verbatim. `acl-deep-recon` takes the workflow from here — do not execute any further steps in this shim.\r\n"},"commands":{"claude":"/acl-technical-research","cursor":"@acl-technical-research","windsurf":"/acl-technical-research","copilot":"@github /acl-technical-research","antigravity":"/acl-technical-research","universal":"Act as the ACL-ADLC acl-technical-research (acl-technical-research). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-technical-research","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-technical-research","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-technical-research","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-technical-research","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-technical-research","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-technical-research': Deprecated — forwards to acl-deep-recon (technical type)..","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-ux","name":"acl-ux","displayName":"acl-ux","description":"Plan UX patterns and design specifications. Use when the user says","module":"2-plan-workflows","moduleLabel":"Phase 2 · Planning","moduleShort":"Planning","folderPath":"src/acl-skills/2-plan-workflows/acl-ux","skillFile":{"filename":"SKILL.md","fullPath":"src/acl-skills/2-plan-workflows/acl-ux/SKILL.md","content":"---\r\nname: acl-ux\r\ndescription: Plan UX patterns and design specifications. Use when the user says \"lets create UX design\" or \"create UX specifications\" or \"help me plan the UX\"\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# ACL UX\r\n\r\n## Overview\r\n\r\nYou are a master UX facilitator. **Elicit and capture** the user's vision, never impose yours. Probe like a senior practitioner; never volunteer colors, patterns, or directions. Render options via creative tools when seeing helps; the picks are the user's.\r\n\r\nProduce two peer contracts: **`DESIGN.md`** (visual identity per the [Google Labs spec](https://github.com/google-labs-code/design.md) — owns *how it looks*) and **`EXPERIENCE.md`** (information architecture, behavior, states, interactions, accessibility, journeys — owns *how it works*). EXPERIENCE.md cross-references DESIGN.md tokens by name using `{path.to.token}` syntax. Both spines win on conflict with any mock, wireframe, or import.\r\n\r\n## The DESIGN.md spine\r\n\r\nPer the [Google Labs spec](https://github.com/google-labs-code/design.md). YAML frontmatter tokens (**colors** · **typography** · **rounded** · **spacing** · **components**) + markdown body in canonical order: **Brand & Style** · **Colors** · **Typography** · **Layout & Spacing** · **Elevation & Depth** · **Shapes** · **Components** · **Do's and Don'ts**. Sections omittable; order locked when present. Spec rules: `references/design-md-spec.md`. Shape: read every entry in `{workflow.design_md_examples}`.\r\n\r\n## The EXPERIENCE.md spine\r\n\r\nAlways: **Foundation** (form-factor, UI system when present; DESIGN.md is the visual identity reference) · **Information Architecture** · **Voice and Tone** (microcopy — brand voice lives in DESIGN.md.Brand & Style) · **Component Patterns** (behavioral — visual specs live in DESIGN.md.Components) · **State Patterns** · **Interaction Primitives** · **Accessibility Floor** (behavioral — visual contrast lives in DESIGN.md) · **Key Flows** (named-protagonist journeys with a climax beat).\r\n\r\nWhen triggered: **Inspiration & Anti-patterns** · **Responsive & Platform**.\r\n\r\nInvent sections for product-specific concerns. Shape: read every entry in `{workflow.experience_md_examples}`.\r\n\r\nWhen Foundation names a UI system (shadcn, MUI, native UIKit, Compose, internal design system), both spines inherit from it; DESIGN.md tokens reference or extend the system's defaults, EXPERIENCE.md specifies only the behavioral delta.\r\n\r\n## Sources\r\n\r\nUX may lead, follow, or stand alone. Inherit `sources:` by reference; the spines hold design and experience decisions, not duplicates of upstream product content.\r\n\r\n## On Activation\r\n\r\n1. Resolve customization: `uv run {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`. On failure, read `{skill-root}/customize.toml` directly and use defaults.\r\n2. Run `{workflow.activation_steps_prepend}`. Treat `{workflow.persistent_facts}` as foundational context (entries prefixed `file:` are loaded). `{workflow.external_sources}` is an org-configured registry of internal tools; consult them alongside generic web research on the same triggers, org tools preferred when their directive matches.\r\n3. Load `{project-root}/_acl/acl/config.yaml` (+ `config.user.yaml` if present). Resolve `{user_name}`, `{communication_language}`, `{document_output_language}`, `{planning_artifacts}`, `{project_name}`, `{date}`. Missing keys → neutral defaults; never block.\r\n4. If headless, follow `references/headless.md` for the whole run. Otherwise greet the user **by name** using `{user_name}` and **in their language** using `{communication_language}` — and stay in `{communication_language}` for every turn. In the greeting, let the user know `acl-party-mode` and `acl-advanced-elicitation` are always available. Then scan for misroute on the first message: PRD → `acl-prd`; architecture → `acl-architecture`; game UX → ACL GDS; agent/skill → `acl-workflow-builder`; brief → `acl-product-brief`.\r\n5. Detect intent: **Create**, **Update**, **Validate**. For Create, before binding a fresh workspace, scan `{workflow.ux_output_path}` for prior in-progress runs (folders matching `{workflow.run_folder_pattern}` whose `DESIGN.md` frontmatter `status` is not `final`) and offer to resume rather than starting over.\r\n\r\nRun `{workflow.activation_steps_append}`.\r\n\r\nActivation is complete. If `activation_steps_prepend` or `activation_steps_append` were non-empty, confirm every entry was executed in order before proceeding. Do not begin the main workflow until all activation steps have been completed.\r\n\r\n## Modes\r\n\r\n**Create.** Bind `{doc_workspace}` to `{workflow.ux_output_path}/{workflow.run_folder_pattern}/`. Create `.working/` and `imports/`; seed the memlog with `uv run {project-root}/_acl/scripts/memlog.py init --workspace {doc_workspace} --field topic=\"<product/UX>\"`; create `DESIGN.md` (frontmatter only) and `EXPERIENCE.md` (frontmatter only). Run Discovery → Finalize.\r\n\r\n**Update.** Read spines + memlog + sources. If `.memlog.md` is missing, init it with `uv run {project-root}/_acl/scripts/memlog.py init --workspace {doc_workspace}` — this update is entry one. Surface conflicts with prior decisions. Run Finalize.\r\n\r\n**Validate.** See `references/validate.md`.\r\n\r\n## Discovery\r\n\r\n**Capture; do not author.** The spines are distilled at Finalize toward the memlog. Decisions → `.memlog.md` (canonical), each appended via `uv run {project-root}/_acl/scripts/memlog.py append --workspace {doc_workspace} --type <decision|change|override|assumption|event> --text \"…\"` — never hand-edited; a resume reloads it. Creative-tool artifacts → `.working/`. User-supplied visuals (Figma, sketches, brand decks, image folders) → `imports/`, one `memlog.py append` per item. Spines win on conflict.\r\n\r\n**Source scan.** Glob `{planning_artifacts}/` for candidate input paths; surface paths only — never read content in the parent. User confirms which apply or adds others; subagent-extracts on confirm.\r\n\r\nBrain dump first — even when the user opens with paragraphs (that's intake). Subagent-extract big docs. One \"anything else?\" probe. Stakes: hobby / internal / consumer / regulated.\r\n\r\nWorking mode:\r\n\r\n- **Fast path** — batch gaps, draft both spines with `[ASSUMPTION]` tags, skip creative tools.\r\n- **Coaching path** — walk decisions; creative tools woven in.\r\n- **Design handoff** — assemble captured Discovery into a producer-shaped prompt; user runs the external tool and saves outputs to `{doc_workspace}` in whatever format the tool emits. Producer registry: `{workflow.design_handoffs}` (default: Google Stitch). EXPERIENCE.md can follow via Update mode when ready.\r\n\r\nCreative tools — scan `{workflow.creative_tools}`, invoke when seeing helps. Defaults: HTML color themes, design directions, Excalidraw wireframes; key-screen HTML mocks at Finalize. See `references/creative-tools.md`. Research subagents on demand; consult `{workflow.external_sources}` when entries match.\r\n\r\nConcern scan — name what the UX carries: accessibility, platforms, brand, regulated language, motion, i18n, dark mode, offline, content density, input modalities, notifications. Open list; drives invented sections.\r\n\r\nJourneys: user narrates a real session with a named protagonist (Mary, mom of three, kids asleep — not \"the user\"); structure into numbered steps with a climax beat. Mirror source-spec names verbatim when defined.\r\n\r\nForm-factor: mobile / web / desktop / multi-surface must resolve before IA closes. Named-protagonist journeys often derive it (Pary on iPad implies an iPad surface; Skeeter on Android adds a multi-surface need); when journeys don't disambiguate, probe.\r\n\r\nSurface closure: stated needs become screens through journeys. IA closes when every stated need has a surface that delivers it, and every surface has a journey that lands there. When closure fails, probe — never invent the missing piece.\r\n\r\n## Reviewer Gate\r\n\r\nUsed by Validate and Finalize. **Opt-in, lens-selectable** — reviewers are costly (parallel subagents, substantial token spend). At **Finalize**, first ask whether to run validation at all; default offered, easy skip. At **Validate** intent the user already opted in — skip that question. In both cases, present the lens menu and let the user pick all / a subset / none. Menu: rubric walker (`references/validate.md`) + `{workflow.finalize_reviewers}` + ad-hoc (accessibility for consumer / regulated; others by stakes and content). Picked lenses dispatch as parallel subagents → each writes `review-{slug}.md`, returns a compact summary. If any lens ran, run the synthesis pipeline in `references/validate.md`.\r\n\r\n## Finalize\r\n\r\nOutcomes, in order:\r\n\r\n- **Spines distilled.** Subagent reads `.memlog.md`, `.working/`, `imports/`, sources; produces `DESIGN.md` against `## The DESIGN.md spine` + `{workflow.design_md_examples}` and `EXPERIENCE.md` against `## The EXPERIENCE.md spine` + `{workflow.experience_md_examples}`. Runs the rubric walker's Pass 1 coverage checks proactively (see `references/validate.md`). Surface gaps; never invent.\r\n- **Inputs reconciled.** Subagent per user-supplied input → `reconcile-{slug}.md`. Surface dropped qualitative ideas.\r\n- **Reviewer Gate offered.** Ask whether to run validation; if yes, present the lens menu (see `## Reviewer Gate`) and let the user pick. If any lens ran, resolve findings before polish; otherwise proceed.\r\n- **Open items triaged.** Open Questions, `[ASSUMPTION]`, `[NOTE FOR UX]`. Phase-blockers one at a time; non-blockers → `memlog.py append`.\r\n- **Key-screen mocks rendered.** Key-screens tool → `.working/` for surfaces where layout drives behavior or anchors visual language.\r\n- **Mock coverage confirmed.** Walk every IA surface; classify *mocked* vs *spine-only*. Ask: *\"These will be built from spine tables alone — any need a visual reference?\"* Render more if named; log spine-only choices.\r\n- **Layout extracted, artifacts promoted.** Distill subagent re-reads each `.working/` and `imports/` artifact; lifts visual decisions into DESIGN.md and behavioral decisions into EXPERIENCE.md. Promote `.working/` keepers to `mockups/` (HTML) or `wireframes/` (Excalidraw); imports stay. Inline relative links at relevant spine sections; state spines-win-on-conflict once.\r\n- **Polished, handed off, closed.** Apply `{workflow.doc_standards}` in order. Execute `{workflow.external_handoffs}`; surface URLs. Set both files' `status: In Review`, `updated: {date}`. Remind the user that downstream tasks remain strictly locked until the Manager reviews and marks UX deliverables as `Approved` in Markdown Studio (`markdown.html`). Log finalization via `uv run {project-root}/_acl/scripts/memlog.py append --workspace {doc_workspace} --type event --text \"spines finalized\"`. Share paths. Common next after Manager approval: `acl-architecture`, `acl-create-epics-and-stories`, `acl-quick-dev`. Run `{workflow.on_complete}`.\r\n"},"commands":{"claude":"/acl-ux","cursor":"@acl-ux","windsurf":"/acl-ux","copilot":"@github /acl-ux","antigravity":"/acl-ux","universal":"Act as the ACL-ADLC acl-ux (acl-ux). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-ux","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-ux","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-ux","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-ux","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-ux","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-ux': Plan UX patterns and design specifications. Use when the user says.","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-validate-prd","name":"acl-validate-prd","displayName":"acl-validate-prd","description":"Deprecated — forwards to acl-prd (validate intent).","module":"v6-shims","moduleLabel":"V6 Shims · PRD","moduleShort":"V6 Shims","folderPath":"src/acl-skills/v6-shims/acl-validate-prd","skillFile":{"filename":"SKILL.md","fullPath":"src/acl-skills/v6-shims/acl-validate-prd/SKILL.md","content":"---\r\nname: acl-validate-prd\r\ndescription: 'Deprecated — forwards to acl-prd (validate intent).'\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# DEPRECATED — forwards to acl-prd (validate intent)\r\n\r\nThis skill was consolidated into `acl-prd`. It is retained as a thin compatibility shim so existing invocations by name and `_acl/custom/acl-validate-prd.toml` override files keep working. New work should invoke `acl-prd` directly — it detects create / update / validate intent from the conversation.\r\n\r\n## On Activation\r\n\r\n1. Resolve customization: `python3 {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`. This picks up any `{project-root}/_acl/custom/acl-validate-prd.toml` and `acl-validate-prd.user.toml` overrides for the legacy fields (`activation_steps_prepend`, `activation_steps_append`, `persistent_facts`, `on_complete`).\r\n\r\n2. Load `{project-root}/_acl/acl/config.yaml` (and `config.user.yaml` if present) to resolve `{user_name}` and `{communication_language}`.\r\n\r\n3. Emit a deprecation notice to the user in `{communication_language}`:\r\n\r\n   > Notice: `acl-validate-prd` is deprecated and will be removed in a future release. It now forwards to `acl-prd` with validate intent. To silence this notice and access the full new customization surface (`prd_template`, `validation_checklist_template`, `validation_report_template`, `doc_standards`, `finalize_reviewers`, `external_sources`, `external_handoffs`, `prd_output_path`, `run_folder_pattern`), migrate `_acl/custom/acl-validate-prd.toml` to `_acl/custom/acl-prd.toml` and invoke `acl-prd` directly next time. Customization fields that were in this version still remain in the new version and will be respected if present in `_acl/custom/acl-prd.toml`, but the new version also supports additional fields that you can take advantage of by migrating.\r\n\r\n4. Invoke `acl-prd` with the following context. Pass these as the activating context so `acl-prd` honors them instead of resolving its own customization from scratch:\r\n\r\n   - **Intent:** `validate` — skip `acl-prd`'s usual intent detection step.\r\n   - **Pre-resolved legacy customization** — use these in place of resolving from `acl-prd`'s own `customize.toml` for the four legacy fields. For everything else (`prd_template`, `validation_checklist_template`, `validation_report_template`, `doc_standards`, `finalize_reviewers`, `prd_output_path`, `run_folder_pattern`, `external_sources`, `external_handoffs`), use `acl-prd`'s own defaults and overrides as normal:\r\n     - `activation_steps_prepend` = the resolved value from step 1\r\n     - `activation_steps_append` = the resolved value from step 1\r\n     - `persistent_facts` = the resolved value from step 1\r\n     - `on_complete` = the resolved value from step 1\r\n   - **Original user input:** forward whatever the user said when invoking this skill verbatim (the target PRD path, etc.).\r\n\r\n   `acl-prd` takes the workflow from here. Do not execute any further steps in this shim.\r\n"},"commands":{"claude":"/acl-validate-prd","cursor":"@acl-validate-prd","windsurf":"/acl-validate-prd","copilot":"@github /acl-validate-prd","antigravity":"/acl-validate-prd","universal":"Act as the ACL-ADLC acl-validate-prd (acl-validate-prd). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-validate-prd","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-validate-prd","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-validate-prd","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-validate-prd","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-validate-prd","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-validate-prd': Deprecated — forwards to acl-prd (validate intent)..","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"imagegen","name":"imagegen","displayName":"imagegen","description":"Generate or edit raster images when the task benefits from AI-created bitmap visuals such as photos, illustrations, textures, sprites, mockups, or transparent-background cutouts. Use when Codex should create a brand-new image, transform an existing image, or derive visual variants from references, and the output should be a bitmap asset rather than repo-native code or vector. Do not use when the task is better handled by editing existing SVG/vector/code-native assets, extending an established icon or logo system, or building the visual directly in HTML/CSS/canvas.","module":"acl","moduleLabel":"ACL Method","moduleShort":"ACL","folderPath":"../../../.codex/skills/.system/imagegen","skillFile":{"filename":"SKILL.md","fullPath":"../../../.codex/skills/.system/imagegen/SKILL.md","content":"---\r\nname: \"imagegen\"\r\ndescription: \"Generate or edit raster images when the task benefits from AI-created bitmap visuals such as photos, illustrations, textures, sprites, mockups, or transparent-background cutouts. Use when Codex should create a brand-new image, transform an existing image, or derive visual variants from references, and the output should be a bitmap asset rather than repo-native code or vector. Do not use when the task is better handled by editing existing SVG/vector/code-native assets, extending an established icon or logo system, or building the visual directly in HTML/CSS/canvas.\"\r\n---\r\n\r\n# Image Generation Skill\r\n\r\nGenerates or edits images for the current project (for example website assets, game assets, UI mockups, product mockups, wireframes, logo design, photorealistic images, or infographics).\r\n\r\n## Top-level modes and rules\r\n\r\nThis skill has exactly two top-level modes:\r\n\r\n- **Default built-in tool mode (preferred):** built-in `image_gen` tool for image generation, editing, and transparent-image requests. Does not require `OPENAI_API_KEY`.\r\n- **Fallback CLI mode:** `scripts/image_gen.py` CLI. Use when the user explicitly asks for or confirms the CLI/API/model path. Requires `OPENAI_API_KEY`.\r\n\r\nWithin CLI fallback, the CLI exposes three subcommands:\r\n\r\n- `generate`\r\n- `edit`\r\n- `generate-batch`\r\n\r\nRules:\r\n- Use the built-in `image_gen` tool by default for normal image generation and editing requests.\r\n- Do not switch to CLI fallback for ordinary quality, size, or file-path control.\r\n- For transparent images, ask built-in `image_gen` for a transparent background and preserve the generated alpha.\r\n- Never silently switch from built-in `image_gen` or CLI `gpt-image-2` to CLI `gpt-image-1.5`; ask the user first unless they explicitly requested `gpt-image-1.5`.\r\n- The word `batch` by itself does not mean CLI fallback. If the user asks for many assets or says to batch-generate assets without explicitly asking for CLI/API/model controls, stay on the built-in path and issue one built-in call per requested asset or variant.\r\n- If the built-in tool fails or is unavailable, tell the user the CLI fallback exists and that it requires `OPENAI_API_KEY`. Proceed only if the user explicitly asks for that fallback.\r\n- If the user explicitly asks for CLI mode, use the bundled `scripts/image_gen.py` workflow. Do not create one-off SDK runners.\r\n- Never modify `scripts/image_gen.py`. If something is missing, ask the user before doing anything else.\r\n\r\nBuilt-in save-path policy:\r\n- In built-in tool mode, Codex saves generated images under `$CODEX_HOME/*` by default.\r\n- Do not describe or rely on OS temp as the default built-in destination.\r\n- Do not describe or rely on a destination-path argument (if any) on the built-in `image_gen` tool. If a specific location is needed, generate first and then move or copy the selected output from `$CODEX_HOME/generated_images/...`.\r\n- Save-path precedence in built-in mode:\r\n  1. If the user names a destination, move or copy the selected output there.\r\n  2. If the image is meant for the current project, move or copy the final selected image into the workspace before finishing.\r\n  3. If the image is only for preview or brainstorming, render it inline; the underlying file can remain at the default `$CODEX_HOME/*` path.\r\n- Never leave a project-referenced asset only at the default `$CODEX_HOME/*` path.\r\n- Do not overwrite an existing asset unless the user explicitly asked for replacement; otherwise create a sibling versioned filename such as `hero-v2.png` or `item-icon-edited.png`.\r\n\r\nShared prompt guidance for both modes lives in `references/prompting.md` and `references/sample-prompts.md`.\r\n\r\nFallback-only docs/resources for CLI mode:\r\n- `references/cli.md`\r\n- `references/image-api.md`\r\n- `references/codex-network.md`\r\n- `scripts/image_gen.py`\r\n\r\n## When to use\r\n- Generate a new image (concept art, product shot, cover, website hero)\r\n- Generate a new image using one or more reference images for style, composition, or mood\r\n- Edit an existing image (inpainting, lighting or weather transformations, background replacement, object removal, compositing, transparent background)\r\n- Produce many assets or variants for one task\r\n\r\n## When not to use\r\n- Extending or matching an existing SVG/vector icon set, logo system, or illustration library inside the repo\r\n- Creating simple shapes, diagrams, wireframes, or icons that are better produced directly in SVG, HTML/CSS, or canvas\r\n- Making a small project-local asset edit when the source file already exists in an editable native format\r\n- Any task where the user clearly wants deterministic code-native output instead of a generated bitmap\r\n\r\n## Decision tree\r\n\r\nThink about two separate questions:\r\n\r\n1. **Intent:** is this a new image or an edit of an existing image?\r\n2. **Execution strategy:** is this one asset or many assets/variants?\r\n\r\nIntent:\r\n- If the user wants to modify an existing image while preserving parts of it, treat the request as **edit**.\r\n- If the user provides images only as references for style, composition, mood, or subject guidance, treat the request as **generate**.\r\n- If the user provides no images, treat the request as **generate**.\r\n\r\nBuilt-in edit semantics:\r\n- Built-in edit mode is for images already visible in the conversation context, such as attached images or images generated earlier in the thread.\r\n- If the user wants to edit a local image file with the built-in tool, first load it with built-in `view_image` tool so the image is visible in the conversation context, then proceed with the built-in edit flow.\r\n- Do not promise arbitrary filesystem-path editing through the built-in tool.\r\n- If a local file still needs direct file-path control, masks, or other explicit CLI-only parameters, use the explicit CLI fallback only when the user asks for it.\r\n- For edits, preserve invariants aggressively and save non-destructively by default.\r\n\r\nExecution strategy:\r\n- In the built-in default path, produce many assets or variants by issuing one `image_gen` call per requested asset or variant.\r\n- In the CLI fallback path, use the CLI `generate-batch` subcommand only when the user explicitly chose CLI mode and needs many prompts/assets.\r\n- For many distinct assets, do not use `n` as a substitute for separate prompts. `n` is for variants of one prompt; distinct assets need distinct built-in calls or distinct CLI `generate-batch` jobs.\r\n\r\nAssume the user wants a new image unless they clearly ask to change an existing one.\r\n\r\n## Workflow\r\n1. Decide the top-level mode: built-in by default, including transparent-output requests; fallback CLI only if explicitly requested or confirmed.\r\n2. Decide the intent: `generate` or `edit`.\r\n3. Decide whether the output is preview-only or meant to be consumed by the current project.\r\n4. Decide the execution strategy: single asset vs repeated built-in calls vs CLI `generate-batch`.\r\n5. Collect inputs up front: prompt(s), exact text (verbatim), constraints/avoid list, and any input images.\r\n6. For every input image, label its role explicitly:\r\n   - reference image\r\n   - edit target\r\n   - supporting insert/style/compositing input\r\n7. If the edit target is only on the local filesystem and you are staying on the built-in path, inspect it with `view_image` first so the image is available in conversation context.\r\n8. If the user asked for a photo, illustration, sprite, product image, banner, or other explicitly raster-style asset, use `image_gen` rather than substituting SVG/HTML/CSS placeholders. If the request is for an icon, logo, or UI graphic that should match existing repo-native SVG/vector/code assets, prefer editing those directly instead.\r\n9. Augment the prompt based on specificity:\r\n   - If the user's prompt is already specific and detailed, normalize it into a clear spec without adding creative requirements.\r\n   - If the user's prompt is generic, add tasteful augmentation only when it materially improves output quality.\r\n10. Use the built-in `image_gen` tool by default.\r\n11. For transparent-output requests, ask built-in `image_gen` for a transparent background and preserve the generated alpha channel.\r\n12. Inspect outputs and validate: subject, style, composition, text accuracy, and invariants/avoid items.\r\n13. Iterate with a single targeted change, then re-check.\r\n14. For preview-only work, render the image inline; the underlying file may remain at the default `$CODEX_HOME/generated_images/...` path.\r\n15. For project-bound work, move or copy the selected artifact into the workspace and update any consuming code or references. Never leave a project-referenced asset only at the default `$CODEX_HOME/generated_images/...` path.\r\n16. For batches or multi-asset requests, persist every requested deliverable final in the workspace unless the user explicitly asked to keep outputs preview-only. Discarded variants do not need to be kept unless requested.\r\n17. If the user explicitly chooses or confirms the CLI fallback, then use the fallback-only docs for model, quality, size, `input_fidelity`, masks, output format, output paths, and network setup.\r\n18. Always report the final saved path(s) for any workspace-bound asset(s), plus the final prompt or prompt set and whether the built-in tool or fallback CLI mode was used.\r\n\r\n## Transparent image requests\r\n\r\nAsk built-in `image_gen` for a genuinely transparent background and preserve its alpha.\r\n\r\n## Prompt augmentation\r\n\r\nReformat user prompts into a structured, production-oriented spec. Make the user's goal clearer and more actionable, but do not blindly add detail.\r\n\r\nTreat this as prompt-shaping guidance, not a closed schema. Use only the lines that help, and add a short extra labeled line when it materially improves clarity.\r\n\r\n### Specificity policy\r\n\r\nUse the user's prompt specificity to decide how much augmentation is appropriate:\r\n\r\n- If the prompt is already specific and detailed, preserve that specificity and only normalize/structure it.\r\n- If the prompt is generic, you may add tasteful augmentation when it will materially improve the result.\r\n\r\nAllowed augmentations:\r\n- composition or framing hints\r\n- polish level or intended-use hints\r\n- practical layout guidance\r\n- reasonable scene concreteness that supports the stated request\r\n\r\nNot allowed augmentations:\r\n- extra characters or objects that are not implied by the request\r\n- brand names, slogans, palettes, or narrative beats that are not implied\r\n- arbitrary side-specific placement unless the surrounding layout supports it\r\n\r\n## Use-case taxonomy (exact slugs)\r\n\r\nClassify each request into one of these buckets and keep the slug consistent across prompts and references.\r\n\r\nGenerate:\r\n- photorealistic-natural — candid/editorial lifestyle scenes with real texture and natural lighting.\r\n- product-mockup — product/packaging shots, catalog imagery, merch concepts.\r\n- ui-mockup — app/web interface mockups and wireframes; specify the desired fidelity.\r\n- infographic-diagram — diagrams/infographics with structured layout and text.\r\n- scientific-educational — classroom explainers, scientific diagrams, and learning visuals with required labels and accuracy constraints.\r\n- ads-marketing — campaign concepts and ad creatives with audience, brand position, scene, and exact tagline/copy.\r\n- productivity-visual — slide, chart, workflow, and data-heavy business visuals.\r\n- logo-brand — logo/mark exploration, vector-friendly.\r\n- illustration-story — comics, children’s book art, narrative scenes.\r\n- stylized-concept — style-driven concept art, 3D/stylized renders.\r\n- historical-scene — period-accurate/world-knowledge scenes.\r\n\r\nEdit:\r\n- text-localization — translate/replace in-image text, preserve layout.\r\n- identity-preserve — try-on, person-in-scene; lock face/body/pose.\r\n- precise-object-edit — remove/replace a specific element (including interior swaps).\r\n- lighting-weather — time-of-day/season/atmosphere changes only.\r\n- background-extraction — transparent background / clean cutout. Ask built-in `image_gen` for actual transparency.\r\n- style-transfer — apply reference style while changing subject/scene.\r\n- compositing — multi-image insert/merge with matched lighting/perspective.\r\n- sketch-to-render — drawing/line art to photoreal render.\r\n\r\n## Shared prompt schema\r\n\r\nUse the following labeled spec as shared prompt scaffolding for both top-level modes:\r\n\r\n```text\r\nUse case: <taxonomy slug>\r\nAsset type: <where the asset will be used>\r\nPrimary request: <user's main prompt>\r\nInput images: <Image 1: role; Image 2: role> (optional)\r\nScene/backdrop: <environment>\r\nSubject: <main subject>\r\nStyle/medium: <photo/illustration/3D/etc>\r\nComposition/framing: <wide/close/top-down; placement>\r\nLighting/mood: <lighting + mood>\r\nColor palette: <palette notes>\r\nMaterials/textures: <surface details>\r\nText (verbatim): \"<exact text>\"\r\nConstraints: <must keep/must avoid>\r\nAvoid: <negative constraints>\r\n```\r\n\r\nNotes:\r\n- `Asset type` and `Input images` are prompt scaffolding, not dedicated CLI flags.\r\n- `Scene/backdrop` refers to the visual setting. It is not the same as the fallback CLI `background` parameter, which controls output transparency behavior.\r\n- Fallback-only execution notes such as `Quality:`, `Input fidelity:`, masks, output format, and output paths belong in the CLI path only. Do not treat them as built-in `image_gen` tool arguments.\r\n\r\nAugmentation rules:\r\n- Keep it short.\r\n- Add only the details needed to improve the prompt materially.\r\n- For edits, explicitly list invariants (`change only X; keep Y unchanged`).\r\n- If any critical detail is missing and blocks success, ask a question; otherwise proceed.\r\n\r\n## Examples\r\n\r\n### Generation example (hero image)\r\n```text\r\nUse case: product-mockup\r\nAsset type: landing page hero\r\nPrimary request: a minimal hero image of a ceramic coffee mug\r\nStyle/medium: clean product photography\r\nComposition/framing: wide composition with usable negative space for page copy if needed\r\nLighting/mood: soft studio lighting\r\nConstraints: no logos, no text, no watermark\r\n```\r\n\r\n### Edit example (invariants)\r\n```text\r\nUse case: precise-object-edit\r\nAsset type: product photo background replacement\r\nPrimary request: replace only the background with a warm sunset gradient\r\nConstraints: change only the background; keep the product and its edges unchanged; no text; no watermark\r\n```\r\n\r\n## Prompting best practices\r\n- Structure prompt as scene/backdrop -> subject -> details -> constraints.\r\n- Include intended use (ad, UI mock, infographic) to set the mode and polish level.\r\n- Use camera/composition language for photorealism.\r\n- Only use SVG/vector stand-ins when the user explicitly asked for vector output or a non-image placeholder.\r\n- Quote exact text and specify typography + placement.\r\n- For tricky words, spell them letter-by-letter and require verbatim rendering.\r\n- For multi-image inputs, reference images by index and describe how they should be used.\r\n- For edits, repeat invariants every iteration to reduce drift.\r\n- Iterate with single-change follow-ups.\r\n- If the prompt is generic, add only the extra detail that will materially help.\r\n- If the prompt is already detailed, normalize it instead of expanding it.\r\n- For CLI fallback only, see `references/cli.md` and `references/image-api.md` for model, `quality`, `input_fidelity`, masks, output format, and output-path guidance.\r\n- For transparent images, ask built-in `image_gen` for actual transparency and preserve its alpha.\r\n\r\nMore principles shared by both modes: `references/prompting.md`.\r\nCopy/paste specs shared by both modes: `references/sample-prompts.md`.\r\n\r\n## Guidance by asset type\r\nAsset-type templates (website assets, game assets, wireframes, logo) are consolidated in `references/sample-prompts.md`.\r\n\r\n## gpt-image-2 guidance for CLI fallback\r\n\r\nThe fallback CLI defaults to `gpt-image-2`.\r\n\r\n- Use `gpt-image-2` for new CLI/API workflows unless the user confirms a different model.\r\n- CLI `gpt-image-2` does not support `background=transparent`; ask before using `gpt-image-1.5` unless the user explicitly requested that model.\r\n- `gpt-image-2` always uses high fidelity for image inputs; do not set `input_fidelity` with this model.\r\n- `gpt-image-2` supports `quality` values `low`, `medium`, `high`, and `auto`.\r\n- Use `quality low` for fast drafts, thumbnails, and quick iterations. Use `medium`, `high`, or `auto` for final assets, dense text, diagrams, identity-sensitive edits, or high-resolution outputs.\r\n- Square images are typically fastest to generate. Use `1024x1024` for fast square drafts.\r\n- If the user asks for 4K-style output, use `3840x2160` for landscape or `2160x3840` for portrait.\r\n- `gpt-image-2` size may be `auto` or `WIDTHxHEIGHT` if all constraints hold: max edge `<= 3840px`, both edges multiples of `16px`, long-to-short ratio `<= 3:1`, total pixels between `655,360` and `8,294,400`.\r\n\r\nPopular `gpt-image-2` sizes:\r\n- `1024x1024` square\r\n- `1536x1024` landscape\r\n- `1024x1536` portrait\r\n- `2048x2048` 2K square\r\n- `2048x1152` 2K landscape\r\n- `3840x2160` 4K landscape\r\n- `2160x3840` 4K portrait\r\n- `auto`\r\n\r\n## Fallback CLI mode only\r\n\r\n### Temp and output conventions\r\nThese conventions apply only to the CLI fallback. They do not describe built-in `image_gen` output behavior.\r\n- Use `tmp/imagegen/` for intermediate files (for example JSONL batches); delete them when done.\r\n- Write final artifacts under `output/imagegen/`.\r\n- Use `--out` or `--out-dir` to control output paths; keep filenames stable and descriptive.\r\n\r\n### Dependencies\r\nPrefer `uv` for dependency management in this repo.\r\n\r\nRequired Python package:\r\n```bash\r\nuv pip install openai\r\n```\r\n\r\nOptional for image inspection and downscaling:\r\n```bash\r\nuv pip install pillow\r\n```\r\n\r\nPortability note:\r\n- If you are using the installed skill outside this repo, install dependencies into that environment with its package manager.\r\n- In uv-managed environments, `uv pip install ...` remains the preferred path.\r\n\r\n### Environment\r\n- `OPENAI_API_KEY` must be set for live API calls.\r\n- Do not ask the user for `OPENAI_API_KEY` when using the built-in `image_gen` tool.\r\n- Never ask the user to paste the full key in chat. Ask them to set it locally and confirm when ready.\r\n\r\nIf the key is missing, give the user these steps:\r\n1. Create an API key in the OpenAI platform UI: https://platform.openai.com/api-keys\r\n2. Set `OPENAI_API_KEY` as an environment variable in their system.\r\n3. Offer to guide them through setting the environment variable for their OS/shell if needed.\r\n\r\nIf installation is not possible in this environment, tell the user which dependency is missing and how to install it into their active environment.\r\n\r\n### Script-mode notes\r\n- CLI commands + examples: `references/cli.md`\r\n- API parameter quick reference: `references/image-api.md`\r\n- Network approvals / sandbox settings for CLI mode: `references/codex-network.md`\r\n\r\n## Reference map\r\n- `references/prompting.md`: shared prompting principles for both modes.\r\n- `references/sample-prompts.md`: shared copy/paste prompt recipes for both modes.\r\n- `references/cli.md`: fallback-only CLI usage via `scripts/image_gen.py`.\r\n- `references/image-api.md`: fallback-only API/CLI parameter reference.\r\n- `references/codex-network.md`: fallback-only network/sandbox troubleshooting for CLI mode.\r\n- `scripts/image_gen.py`: fallback-only CLI implementation. Use only when the user explicitly chooses or confirms CLI mode.\r\n"},"commands":{"claude":"/imagegen","cursor":"@imagegen","windsurf":"/imagegen","copilot":"@github /imagegen","antigravity":"/imagegen","universal":"Act as the ACL-ADLC imagegen (imagegen). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/imagegen","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@imagegen","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/imagegen","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /imagegen","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/imagegen","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'imagegen': Generate or edit raster images when the task benefits from AI-created bitmap visuals such as photos, illustrations, textures, sprites, mockups, or transparent-background cutouts. Use when Codex should create a brand-new image, transform an existing image, or derive visual variants from references, and the output should be a bitmap asset rather than repo-native code or vector. Do not use when the task is better handled by editing existing SVG/vector/code-native assets, extending an established icon or logo system, or building the visual directly in HTML/CSS/canvas..","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"openai-docs","name":"openai-docs","displayName":"openai-docs","description":"Use for Codex models/pricing, scheduled tasks, skills, settings, setup, troubleshooting, customization, automations, and self-knowledge—including","module":"acl","moduleLabel":"ACL Method","moduleShort":"ACL","folderPath":"../../../.codex/skills/.system/openai-docs","skillFile":{"filename":"SKILL.md","fullPath":"../../../.codex/skills/.system/openai-docs/SKILL.md","content":"---\r\nname: \"openai-docs\"\r\ndescription: \"Use for Codex models/pricing, scheduled tasks, skills, settings, setup, troubleshooting, customization, automations, and self-knowledge—including 'you,' 'your,' 'this app,' or 'this coding agent' when they refer to Codex—and for OpenAI APIs/products and ChatGPT Work. Also use for model choice/migration, prompting, SDKs, Responses, Realtime, agents, evals, and Chat/Work/Codex comparisons. Do not use for generic app/software tasks that merely mention Codex.\"\r\nmetadata:\r\n  short-description: \"Codex models/pricing, scheduled tasks, skills, settings, setup, troubleshooting, and self-knowledge; OpenAI APIs and ChatGPT Work. 'You'/'this app' means Codex only.\"\r\n---\r\n\r\n# OpenAI Docs\r\n\r\nProvide current, cited OpenAI product, API, model, and Codex guidance. Read zero or one primary reference.\r\n\r\n**First substantive action:** Search the user's exact requested official OpenAI documentation topic and any explicitly named model using a concise, topic-specific query of 2-6 essential terms. When an already-available direct official documentation search and page-retrieval capability is present, use it first: search, then fetch or open the matching official page before general web search. Otherwise, immediately use official-domain web search, then actually open or fetch the relevant official page. Complete this source order before reading a reference, inspecting local or repository files, running a Codex manual or model resolver, drafting a plan, or answering from memory. Use the actual fetched page, not a search snippet or an unopened link. If one official search or page does not establish the answer, search another appropriate official domain and actually open or fetch the result. Preserve the exact requested model; never substitute a newer model.\r\n\r\n**Only exception:** An explicitly requested, genuinely broad, cross-topic Codex setup, orientation, or system-map synthesis may use the manual first when shell execution and an allowed temporary cache are available. A specific Codex feature, setting, command, error, model, or requested citation remains docs-first. Mixed Chat/Work/Codex comparisons are official documentation questions, not manual-first Codex requests.\r\n\r\nFor generic software tasks, answer the software task directly. OpenAI implementation, debugging, SDK, API, prompting, agent, and eval requests are not generic.\r\n\r\nFor a straightforward factual or citation-only request, follow the source order and do not read a route reference. This includes straightforward API facts, ChatGPT Work or mixed Chat/Work/Codex comparisons, model tiers, aliases, Pro mode, reasoning settings, factual migration baselines, and narrow Codex facts. Prioritize `learn.chatgpt.com` for ChatGPT Work.\r\n\r\n## Choose one primary route\r\n\r\nUse the first matching route, and read its reference only when the requested task needs that specialized workflow:\r\n\r\n- **Explicitly requested local documentation integration:** Read [integration guidance](references/mcp-diagnostics.md) only when the user explicitly requests that local integration.\r\n- **Model migration, upgrades, or model-specific prompting:** Read [model-migration.md](references/model-migration.md) for actual migration planning, implementation, dynamic target resolution, or prompt changes. Preserve an explicitly requested target.\r\n- **Model selection and comparisons:** Read [model-selection.md](references/model-selection.md) only when nuanced current, latest, default, cost, latency, quality, or modality tradeoffs need more guidance. Do not run a migration resolver for selection alone.\r\n- **Product, API, ChatGPT Work, and mixed Chat/Work/Codex documentation:** Read [official-docs.md](references/official-docs.md) only when fetched official pages leave source selection, API schemas, or the requested implementation unresolved. This route is not manual-first.\r\n- **Explicitly broad Codex setup, orientation, or cross-topic synthesis:** Read [codex-self-knowledge.md](references/codex-self-knowledge.md) when the eligible Codex manual or deeper Codex procedures are needed.\r\n\r\nRead at most one primary reference. Do not open every route, bundled model guide, or helper script. Read a supporting reference or run a helper only when the chosen workflow demonstrably needs it.\r\n\r\n## Source and execution boundaries\r\n\r\n- Search, open, fetch, and cite only `developers.openai.com`, `platform.openai.com`, and `learn.chatgpt.com`. Cite the page that supports the claim. State uncertainty when official sources do not establish pricing, availability, account access, limits, or behavior.\r\n- Preserve an explicitly requested model for selection, migration, and prompting. Resolve an unspecified latest or current migration target only after searching and fetching current official guidance.\r\n- Use `references/latest-model.md` only as a disclosed fallback after current official model guidance does not answer the question. Read `references/upgrading-to-gpt-6-astra.md` only for an actual, requested GPT-6 migration; read `references/prompting-guide.md` only for requested prompting work.\r\n- Before building, running, editing, debugging, or testing an API-backed app or tool, use `openai-platform-api-key` first when available. Documentation, conceptual examples, model selection, and read-only guidance do not require an API key.\r\n- Say \"OpenAI Docs\" or \"official OpenAI documentation\" in user-facing answers. Keep exact official citations and examples concise.\r\n"},"commands":{"claude":"/openai-docs","cursor":"@openai-docs","windsurf":"/openai-docs","copilot":"@github /openai-docs","antigravity":"/openai-docs","universal":"Act as the ACL-ADLC openai-docs (openai-docs). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/openai-docs","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@openai-docs","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/openai-docs","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /openai-docs","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/openai-docs","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'openai-docs': Use for Codex models/pricing, scheduled tasks, skills, settings, setup, troubleshooting, customization, automations, and self-knowledge—including.","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"review-agent","name":"review-agent","displayName":"review-agent","description":"Perform a read-only, defect-first review of a specified code change and return every actionable finding. Use when another agent delegates review of uncommitted changes, a base-branch diff, a commit, or custom review instructions.","module":"acl","moduleLabel":"ACL Method","moduleShort":"ACL","folderPath":"../../../.codex/skills/.system/review-agent","skillFile":{"filename":"SKILL.md","fullPath":"../../../.codex/skills/.system/review-agent/SKILL.md","content":"---\r\nname: review-agent\r\ndescription: Perform a read-only, defect-first review of a specified code change and return every actionable finding. Use when another agent delegates review of uncommitted changes, a base-branch diff, a commit, or custom review instructions.\r\n---\r\n\r\n# Review Agent\r\n\r\nInspect the requested target directly and return every finding that the author would likely fix.\r\nDo not modify files, create commits, push branches, post review comments, or delegate the review\r\nto another agent.\r\n\r\n## Review the change\r\n\r\n1. Read the applicable `AGENTS.md` instructions.\r\n2. Inspect the complete diff for the requested target and enough surrounding code to understand\r\n   each changed path.\r\n3. Identify concrete regressions introduced by the change. Continue through the whole diff after\r\n   finding the first issue.\r\n4. Check the relevant tests and call sites to confirm that each finding is real and actionable.\r\n\r\nFor a base-branch review, compare the changes that would actually merge rather than diffing\r\ndirectly against the branch tip. Resolve the comparison ref to the branch's upstream when that\r\nupstream exists and is ahead of the local branch; otherwise use the local branch. Run\r\n`git merge-base HEAD <comparison-ref>`, then inspect `git diff <merge-base-sha>`. If the local\r\nbranch cannot be resolved, try its configured upstream explicitly before reporting that the target\r\nis unavailab
