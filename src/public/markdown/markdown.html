    <script>
      window.__ACL_EMBEDDED_FILES__ = [{"id":"_acl-output_1-analysis_acl-product-brief_brief_md","folderPath":"_acl-output/1-analysis/acl-product-brief","filename":"brief.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T07:22:55.490Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T04:26:05.941Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Product Brief: Fleet 360\"\nproject_type: greenfield\ncreated: 2026-10-13\n---\n\n# Product Brief: Fleet 360\n\n## Executive Summary\n\n**Fleet 360** is an enterprise-grade IoT device and distributed site management platform designed to deliver complete operational visibility, unified telemetry control, and real-time incident response across distributed asset networks. Built for operational leaders, site managers, and facility engineers, Fleet 360 aggregates telemetry from distributed field hardware (including HVAC, edge sensors, and gateway equipment) into a single, intuitive command center.\n\nOrganizations operating extensive physical infrastructure struggle with fragmented monitoring tools, disjointed authentication systems, and blind spots across remote geographic sites. Fleet 360 bridges this gap by unifying secure role-based access control, visual site mapping, real-time device health diagnostics, and proactive alarm triage into a cohesive, high-performance web application.\n\nBy empowering teams with precision data and millisecond latency insights, Fleet 360 transforms reactive maintenance into proactive operational excellence, reducing equipment downtime, ensuring strict regulatory compliance, and lowering total cost of ownership.\n\n---\n\n## The Problem\n\n1. **Fragmented Asset Visibility**: Organizations manage thousands of connected devices across geographically dispersed sites using disparate vendor portals, spreadsheets, and legacy SCADA systems. Teams lack a consolidated single pane of glass.\n2. **Delayed Fault & Alarm Detection**: Critical hardware anomalies, sensor offline events, and threshold breaches frequently go unnoticed until cascading failures occur, resulting in costly business disruptions and equipment damage.\n3. **Complex Multi-Site Access Administration**: Managing granular user permissions across dozens or hundreds of remote physical facilities is error-prone. Operators lack per-site role assignments, risking unauthorized access or administrative gridlock.\n4. **Disjointed Operational Hand-offs**: When field technicians and remote operations teams coordinate on device provisioning or incident resolution, they suffer from inconsistent device naming, missing location context, and unassigned hardware queues.\n\n---\n\n## The Solution\n\nFleet 360 addresses these challenges through a centralized, responsive web platform featuring:\n\n- **Unified Command Center**: An executive landing dashboard offering top-level operational summaries, immediate health telemetry, and one-click navigation into specialized management consoles.\n- **Hierarchical Site Management**: Interactive visual hierarchy and location-based mapping (\"Point On Map\") enabling operators to navigate effortlessly from global portfolios down to individual facility zones.\n- **Comprehensive Device Lifecycle Control**: Full-lifecycle device monitoring encompassing active status, inactive hardware detection, unassigned provisioning queues, property configurations, and search filtering.\n- **Granular Multi-Site RBAC**: Flexible role-based access management allowing administrators to grant tailored view, operate, or admin privileges on a per-site and per-tenant basis.\n- **Proactive Alarm & Event Triage**: Real-time alarm monitoring cards and detailed event logs that categorize severity, alert operators instantaneously, and streamline incident remediation workflows.\n\n---\n\n## What Makes This Different\n\n- **Single Pane of Glass with Zero Bloat**: Unlike heavyweight enterprise IoT suites that require months of custom configuration, Fleet 360 delivers an immediate, purpose-built user experience tailored to day-to-day operational workflows.\n- **Visual Hierarchy & Geographic Mapping**: Combines structured topological trees with geographical map coordinates to provide immediate spatial awareness for distributed facilities.\n- **High-Fidelity Deterministic UX & Figma Parity**: Grounded directly in the official Figma design specification ([Figma File `FE12zdGPJ4ROng1HfhL55c`, Node `104:7811`](https://www.figma.com/design/FE12zdGPJ4ROng1HfhL55c/Fleet-360_BK--1-?node-id=104-7811&p=f&t=4OMryB20bJHM5DCd-0)). All assets, icons, and background artwork are exported directly via the Figma MCP server into `src/assets/figma/`:\n  - **Login View (Frame `1228:11322`)**: Split-layout hero featuring industrial AC compressor artwork (`login_hero.png`, Node `1252:14409`) with a 4-stop Figma linear gradient overlay into `#003366`, white vector logo (`fleet360_white.svg`, Node `4003:14129`), red action button (`#E40F37`), and official brand footer (`acl_digital_logo.svg`, Node `4045:14223`).\n  - **Command Center Landing (Frame `227:3884`)**: Dual-tone executive layout featuring a pure white (`#FFFFFF`) header/welcome section with navy blue vector logo (`fleet360_blue.svg`, Node `4003:14139`) and deep navy typography (`#1E3A8A`), and a dark slate (`#4A5568`) Hub Card container hosting three dedicated modules (Devices, Sites, Users) with authentic Figma vector icons (`icon_devices.svg` Node `227:3932`, `icon_sites.svg` Node `227:3946`, `icon_users.svg` Node `227:3962`) and red pill CTAs (`#E40F37`).\n- **Zero Asset Discrepancy Invariant**: No unverified or generic placeholder icons are permitted. All vector paths and raster graphics must map 1:1 to verified Figma design components.\n\n---\n\n## Who This Serves\n\n- **Primary Persona — Facilities & Fleet Operations Manager**: Responsible for ensuring maximum uptime across all regional facilities and connected hardware; requires rapid alarm triage, high-level health dashboards, and aggregated status reports.\n- **Secondary Persona — Field Service & Maintenance Engineer**: Needs quick lookup of specific device configurations, unassigned hardware queues, and connection diagnostics while performing on-site service.\n- **Tertiary Persona — IT & Security Administrator**: Oversees user provisioning, enforces strong authentication, and audits per-site role permissions across organizational boundaries.\n\n---\n\n## Success Criteria\n\n1. **Operational Efficiency**: 50% reduction in mean time to identify (MTTI) offline or faulty field devices.\n2. **Access Security & Compliance**: 100% of user access governed by explicit per-site role assignments, verifiable through centralized audit logs.\n3. **User Adoption & Usability**: Seamless task completion for device lookup, site inspection, and alarm acknowledgment within 3 clicks from the landing console.\n4. **Performance & Reliability**: Landing dashboard and management card views load in under 1.5 seconds with live telemetry indicators updating with sub-second responsiveness.\n\n---\n\n## Scope\n\n### In Scope (MVP)\n\n- **Secure Authentication Flow**: Email/password authentication, forgot password routing, and policy acceptance (Terms of Service / Privacy Notice).\n- **Executive Landing Console**: Dynamic welcome overview featuring direct navigation cards for Devices, Sites, Users, and Alarms.\n- **Core Navigation & App Shell**: Global header with branding, global search bar, user profile menu, and primary module switcher.\n- **Initial Device Management**: Device listing, active/inactive status filters, unassigned device cards, and hardware search.\n- **Site Hierarchy Overview**: Visual site cards and geographic map indicators.\n- **User Role Overview**: Site-specific role assignment view and basic user directory.\n\n### Out of Scope (Deferred to Post-MVP)\n\n- Automated hardware over-the-air (OTA) firmware flashing.\n- Native mobile application builds (iOS / Android) — initial focus is responsive Web desktop/tablet.\n- Custom drag-and-drop dashboard widget customization.\n- Third-party billing and subscription management integrations.\n\n---\n\n## Vision\n\nOver the next 2–3 years, Fleet 360 aims to evolve into an autonomous operations platform powered by predictive AI diagnostics and closed-loop edge automation. As connected deployments scale from thousands to millions of edge endpoints, Fleet 360 will integrate automated root-cause analysis, dynamic energy optimization for HVAC/facility systems, and automated dispatch workflows for field maintenance crews.\n"},{"id":"_acl-output_2-plan-workflows_acl-prd_prd_md","folderPath":"_acl-output/2-plan-workflows/acl-prd","filename":"prd.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T07:22:55.761Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T04:37:00.873Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Product Requirements Document (PRD): Fleet 360\"\nproject_type: greenfield\ncreated: 2026-10-14\nupdated: 2026-10-14\n---\n\n# Product Requirements Document (PRD): Fleet 360\n\n## 0. Document Purpose\n\nThis Product Requirements Document (PRD) defines the functional requirements, user experience behavior, non-functional quality attributes, and architectural constraints for **Fleet 360**. It serves as the authoritative source of truth for engineering, UX architecture, quality assurance, and project management.\n\nFleet 360 is grounded directly in the Manager-approved **Product Brief** (`_acl-output/1-analysis/acl-product-brief/brief.md`) and deterministic design tokens extracted from Figma design deliverable `FE12zdGPJ4ROng1HfhL55c` (Node `104:7811`, Canvas `🌷 Web`, URL: `https://www.figma.com/design/FE12zdGPJ4ROng1HfhL55c/Fleet-360_BK--1-?node-id=104-7811&p=f&t=4OMryB20bJHM5DCd-0`). All vector iconography and artwork are extracted via the Figma MCP server into `src/assets/figma/`:\n\n| Asset File             | Figma Source Node | Description / View Context                                         |\n| :--------------------- | :---------------- | :----------------------------------------------------------------- |\n| `fleet360_white.svg`   | Node `4003:14129` | Exact white vector brand logo for Login Screen (`#1228:11322`)     |\n| `fleet360_blue.svg`    | Node `4003:14139` | Exact navy/blue vector brand logo for Landing Screen (`#227:3884`) |\n| `acl_digital_logo.svg` | Node `4045:14223` | Official \"Powered by ACL Digital\" brand footer graphic             |\n| `icon_devices.svg`     | Node `227:3932`   | Devices management hub vector icon                                 |\n| `icon_sites.svg`       | Node `227:3946`   | Sites management hub vector icon                                   |\n| `icon_users.svg`       | Node `227:3962`   | Users administration hub vector icon                               |\n| `login_hero.png`       | Node `1252:14409` | High-res industrial AC compressor raster artwork                   |\n\nAll functional requirements (FRs) are numbered globally (FR-1 through FR-22) for strict downstream traceability in Phase 3 (Architecture Spine) and Phase 4 (Story Implementation). In accordance with enterprise UI engineering standards, every user-facing view mandates the **5-State Component Matrix** (Default, Loading skeleton, Empty, Error, and Text Overflow).\n\n---\n\n## 1. Vision\n\n**Fleet 360** is an enterprise-grade IoT device and distributed facility telemetry management platform. It transforms disparate, disconnected equipment operations into a unified, proactive command center. Operational leaders, facilities directors, and field engineers receive instant, sub-second visibility into hardware health, site hierarchy topology, and active alarm incidents across distributed geographic physical plants.\n\nBy pairing modern reactive web architecture with granular role-based access control, Fleet 360 eradicates the operational silos and communication delays that lead to catastrophic infrastructure outages, empowering teams to operate with mathematical precision, elevated security, and minimal downtime.\n\n---\n\n## 2. Target User\n\n### 2.1 Jobs To Be Done (JTBD)\n\n- **Functional**: \"When sensor anomalies or equipment faults occur in remote facilities, I want instant, prioritized alarm notifications and one-click access to device diagnostics so I can dispatch maintenance before service interrupts.\"\n- **Operational**: \"When onboarding new regional facilities and edge controllers, I want an intuitive site hierarchy and visual mapping tool so my team can associate unassigned hardware without manual database queries.\"\n- **Security / Compliance**: \"When assigning user accounts to regional contractors and site managers, I want granular per-site role assignments so operators only access the equipment under their direct jurisdiction.\"\n- **Emotional**: \"I want complete confidence that our distributed physical footprint is continuously monitored, eliminating the dread of discovering an offline site from an executive escalation.\"\n\n### 2.2 Non-Users (v1)\n\n- **Direct Consumers / End Customers**: Fleet 360 v1 is exclusively an operational enterprise portal; residential tenants or retail customers do not have logins.\n- **Hardware Manufacturing Engineers**: v1 does not support low-level chip debugging, oscilloscope telemetry traces, or JTAG firmware burning.\n\n### 2.3 Key User Journeys\n\n- **UJ-1: Operations Manager Triages a Critical Facility Alarm**\n  - **Persona & Context**: Marcus, Regional Operations Director overseeing 45 commercial sites.\n  - **Entry State**: Authenticated session on desktop browser; currently viewing the Command Center Landing dashboard.\n  - **Path**: Marcus notices an orange warning badge in the global header and clicks the **Manage Alarms** entry card. The system renders the filtered alarm queue. Marcus clicks the top Critical alert originating from an HVAC compressor at the Chicago South site.\n  - **Climax**: The device telemetry inspector opens within 300ms, displaying live temperature spikes, last-seen timestamp, and assigned site manager details.\n  - **Resolution**: Marcus clicks \"Acknowledge Alarm\", enters an dispatch incident note, and notifies the local field tech. The alarm transitions to `Acknowledged`.\n  - **Edge Case**: If the telemetry feed disconnects during triage, an amber banner informs Marcus with a \"Reconnect\" action while displaying the last known cached values.\n\n- **UJ-2: Field Technician Provisions an Unassigned Edge Gateway**\n  - **Persona & Context**: Elena, Field Service Engineer on-site at Dallas North facility.\n  - **Entry State**: Authenticated via tablet browser on facility Wi-Fi.\n  - **Path**: Elena navigates to **Devices**, selects the \"Unassigned\" tab. She uses the global search bar to scan the gateway MAC address from the physical hardware label.\n  - **Climax**: The system locates the unassigned gateway card. Elena clicks \"Assign to Site\", picks \"Dallas North > Building B > Mechanical Room\", and sets its device alias.\n  - **Resolution**: The gateway status transitions to `Active`, and telemetry starts streaming into the site hierarchy.\n  - **Edge Case**: If another technician concurrently claims the device, an error toast alerts Elena that the hardware was recently claimed and refreshes the list.\n\n- **UJ-3: IT Administrator Provisions a Regional Site Manager**\n  - **Persona & Context**: David, Corporate IT Security Admin.\n  - **Entry State**: Authenticated with Enterprise Admin privileges.\n  - **Path**: David opens **Users**, clicks \"Invite User\", enters the user's corporate email, selects the \"Site Manager\" role, and checks three designated Texas facilities.\n  - **Climax**: David clicks \"Send Invitation\"; the platform records the per-site RBAC policy in the audit log and dispatches the welcome credential setup.\n  - **Resolution**: The user record appears in the Texas site view with `Invited` status.\n\n- **UJ-4: Secure Operator Sign-In and Session Initialization**\n  - **Persona & Context**: Sarah, Day Shift Facility Operator logging in for shift handover.\n  - **Entry State**: Unauthenticated user arriving at `/login`.\n  - **Path**: Sarah enters her corporate email and password, checks the legal compliance acknowledgment checkbox, and clicks \"Login\".\n  - **Climax**: The system validates credentials, issues a secure JWT session, and loads the personalized Fleet 360 Landing dashboard displaying Sarah's authorized sites.\n  - **Resolution**: Sarah begins reviewing shift device counts and active alarm statuses.\n\n---\n\n## 3. Glossary\n\n- **Command Center Landing**: The primary post-authentication dashboard (`Landing` frame `#227:3884`) featuring high-level operational counters and entry cards for Devices, Sites, Users, and Alarms.\n- **Device**: Any networked physical hardware unit (e.g., HVAC system, temperature sensor, gateway) tracked in the platform with a unique MAC address and hardware ID.\n- **Unassigned Device**: A newly detected or online device that has not yet been bound to a specific Site or zone hierarchy.\n- **Site**: A physical facility, campus, or geographic property containing zones, rooms, and devices.\n- **Point On Map**: The geographic coordinate representation (`latitude`, `longitude`) enabling spatial visualization of a Site.\n- **Alarm**: A categorized event triggered when device telemetry breaches defined operational thresholds (Categorized as Critical, Major, Minor, Info).\n- **Per-Site RBAC**: Role-Based Access Control model where user privileges (`Admin`, `Site Manager`, `Technician`, `Viewer`) are scoped strictly to designated Sites.\n- **5-State Matrix**: The required UI engineering contract mandating that every view deterministically handles Default (Baseline), Loading skeleton, Empty, Error, and Text Overflow states.\n\n---\n\n## 4. Features & Functional Requirements\n\n### 4.1 Authentication & Session Security\n\n**Description**: Provides secure authentication adhering to the split-screen layout specified in Figma frame `Login` (`#1228:11322`) and reference `Login.png`, validating user credentials, maintaining secure session tokens, and enforcing regulatory terms consent. Realizes UJ-4.\n\n```\n+----------------------------------------------------------------------------------------------------+\n| 5-STATE COMPONENT MATRIX: Authentication View (Figma Frame #1228:11322)                            |\n+-------------------+--------------------------------------------------------------------------------+\n| State 1 (Default) | Deep blue canvas (#003366); right-aligned industrial AC compressor hero        |\n|                   | graphic (login_hero.png) with 4-stop linear gradient overlay; 340px form card  |\n|                   | with white vector logo (fleet360_white.svg), Email & Password inputs, Forgot   |\n|                   | Password link, red Login CTA (#E40F37), Terms subtext, and ACL Digital footer. |\n| State 2 (Loading) | Input fields disabled with opacity 0.7; Login CTA displays inline spinner and  |\n|                   | label \"Authenticating...\"; prevents double-submission.                         |\n| State 3 (Empty)   | Initial pristine state; inputs display placeholders (\"Enter Email\", etc.).     |\n| State 4 (Error)   | Red helper text beneath failed inputs; dismissible top toast for invalid       |\n|                   | credentials (\"Invalid email or password. Please try again.\").                  |\n| State 5 (Overflow)| Email input limits to 254 chars with horizontal auto-scroll; responsive       |\n|                   | single-column stacked layout on viewports < 768px.                             |\n+-------------------+--------------------------------------------------------------------------------+\n```\n\n#### FR-1: User Credential Authentication\n\nThe system MUST authenticate users via valid Email and Password combination. Realizes UJ-4.\n\n- **Consequences (testable)**:\n  - Submitting valid credentials returns HTTP 200 with JWT access and refresh tokens.\n  - Submitting invalid credentials returns HTTP 401 with structured error code `AUTH_INVALID_CREDENTIALS`.\n  - Rate limiting enforces a temporary lockout (HTTP 429) after 5 consecutive failed attempts per IP within 15 minutes.\n\n#### FR-2: Compliance Terms Acknowledgment\n\nThe system MUST require users to accept Terms and Conditions & Privacy Notice prior to initial login. Realizes UJ-4.\n\n- **Consequences (testable)**:\n  - If terms consent is unrecorded, the user cannot proceed beyond the login prompt.\n  - Timestamped acceptance record is logged to the compliance audit store upon successful authentication.\n\n#### FR-3: Password Reset Initiation\n\nThe system MUST provide a self-service password recovery flow accessible via \"Forgot Password?\". Realizes UJ-4.\n\n- **Consequences (testable)**:\n  - Submitting an email triggers a time-limited (15-minute) cryptographically signed reset token via email.\n  - Response does not reveal whether the email address exists in the system (prevents user enumeration).\n\n---\n\n### 4.2 Command Center Landing Dashboard\n\n**Description**: The executive landing surface (`Landing` frame `#227:3884` and reference `Landing.png`) welcoming operators to Fleet 360 and presenting aggregated counters and direct navigation cards into core management hubs (Devices, Sites, Users). Realizes UJ-1, UJ-4.\n\n```\n+----------------------------------------------------------------------------------------------------+\n| 5-STATE COMPONENT MATRIX: Landing Dashboard View (Figma Frame #227:3884)                          |\n+-------------------+--------------------------------------------------------------------------------+\n| State 1 (Default) | Dual-tone layout: Pure white (#FFFFFF) top section with blue Fleet 360 logo    |\n|                   | (fleet360_blue.svg) and navy headline (#1E3A8A); dark slate (#4A5568) bottom   |\n|                   | section hosting 3 Hub Cards (Devices, Sites, Users) with authentic Figma       |\n|                   | vector icons (icon_devices.svg, etc.) and red pill buttons (#E40F37).         |\n| State 2 (Loading) | Shimmer skeleton cards (314px x 214px) and pulsating banner text placeholders; |\n|                   | layout remains completely stable without layout shift (CLS < 0.05).            |\n| State 3 (Empty)   | First-time tenant onboarding state: Cards display \"0 Connected\" with an       |\n|                   | onboarding prompt (\"Connect your first gateway\") linking to device provisioning.|\n| State 4 (Error)   | Failed telemetry polling renders an inline card warning with a \"Retry\" button |\n|                   | without crashing the parent page shell.                                        |\n| State 5 (Overflow)| Responsive auto-layout grid wrapping: 3 columns (>1024px), 2 columns (768px-  |\n|                   | 1024px), single column (<768px); card copy clamps at 3 lines with ellipsis.    |\n+-------------------+--------------------------------------------------------------------------------+\n```\n\n#### FR-4: Global App Shell & Navigation Header\n\nThe system MUST display the persistent global header (`Header` `#257:8132`) containing company branding, global search, tenant context, and user avatar. Realizes UJ-1, UJ-2, UJ-3.\n\n- **Consequences (testable)**:\n  - Header is pinned at top with z-index 50 and renders across all authenticated routes.\n  - Clicking the logo navigates to `/` (Landing).\n  - User menu displays active user email and provides a \"Sign Out\" action.\n\n#### FR-5: Core Management Hub Routing\n\nThe system MUST provide interactive navigation cards for Devices, Sites, and Users. Realizes UJ-1, UJ-2, UJ-3.\n\n- **Consequences (testable)**:\n  - Clicking \"Manage Devices\" navigates to `/devices`.\n  - Clicking \"Manage Sites\" navigates to `/sites`.\n  - Clicking \"Manage Users\" navigates to `/users`.\n  - Cards support keyboard focus navigation (Tab / Enter / Space).\n\n#### FR-6: High-Level Fleet Telemetry Summary\n\nThe system MUST compute and display aggregated operational counts for active devices, monitored sites, and assigned users. Realizes UJ-1.\n\n- **Consequences (testable)**:\n  - Aggregated metrics reflect only the sites the authenticated user has permissions to view.\n  - Metrics cache refreshes automatically every 60 seconds or on explicit page refresh.\n\n---\n\n### 4.3 Device Lifecycle & Telemetry Catalog\n\n**Description**: Comprehensive device inventory (`Devices - Devices` `#362:14620`, `Manage Devices_Card` `#231:1152`) providing search, active/inactive filtering, unassigned card management, and hardware configuration. Realizes UJ-2.\n\n```\n+----------------------------------------------------------------------------------------------------+\n| 5-STATE COMPONENT MATRIX: Device Catalog View                                                     |\n+-------------------+--------------------------------------------------------------------------------+\n| State 1 (Default) | Filterable device grid/table showing Model, Alias, MAC, Status pill (Active/   |\n|                   | Inactive/Alarm), Site location, and Action buttons.                            |\n| State 2 (Loading) | Table skeleton rows with pulsating gray bars matching column cell widths;      |\n|                   | search bar disabled during initial fetch.                                      |\n| State 3 (Empty)   | Zero-state illustration with text: \"No devices found matching your criteria\";  |\n|                   | provides \"Clear Filters\" secondary action and \"Register Device\" primary CTA.   |\n| State 4 (Error)   | Red alert banner at top of table: \"Unable to retrieve device records. [Retry]\";|\n|                   | preserves cached data if available with an \"Offline Data\" badge.               |\n| State 5 (Overflow)| Device aliases > 28 chars truncate with tooltip; table enables horizontal      |\n|                   | scroll with sticky first column (Device ID) on narrow screens.                 |\n+-------------------+--------------------------------------------------------------------------------+\n```\n\n#### FR-7: Real-Time Device Listing & Status Filtering\n\nThe system MUST render connected devices with status indicators (`Active`, `Inactive`, `In Alarm`). Realizes UJ-2.\n\n- **Consequences (testable)**:\n  - Filter dropdown (`Inactive Devices_Dropdown` `#259:2947`) filters items client-side in < 50ms for lists up to 1,000 devices.\n  - Status indicators use semantic design tokens (`#34C759` for Active, `#FE5B26` for Alarm, `#9CA0B3` for Inactive).\n\n#### FR-8: Unassigned Device Provisioning Queue\n\nThe system MUST segregate unassigned edge devices into a dedicated \"Unassigned\" view (`Un-assigned Card` `#256:10410`). Realizes UJ-2.\n\n- **Consequences (testable)**:\n  - Displays hardware MAC, discovery timestamp, and default firmware identifier.\n  - Action modal allows assigning the hardware to a selected Site, Zone, and Device Group.\n\n#### FR-9: Fast Keyword Search\n\nThe system MUST provide real-time search filtering across Device Alias, MAC Address, Model, and Site Name. Realizes UJ-2.\n\n- **Consequences (testable)**:\n  - Search input debounces at 250ms before triggering filtering.\n  - Cleared search input restores the complete device catalog instantaneously.\n\n#### FR-10: Device Property Configuration\n\nThe system MUST allow authorized operators to view and update device metadata properties (`Property` `#259:1375`). Realizes UJ-2.\n\n- **Consequences (testable)**:\n  - Updating a device alias persists to the backend and reflects immediately across all site hierarchies.\n  - Unauthorized users (e.g. `Viewer` role) see read-only property fields with disabled save controls.\n\n---\n\n### 4.4 Site Hierarchy & Geographic Navigation\n\n**Description**: Visual site navigation (`Devices - Sites` `#362:14621`, `Point On Map` `#290:5447`) allowing operators to explore physical asset distributions via interactive topological trees and geographic map coordinates. Realizes UJ-1, UJ-2.\n\n```\n+----------------------------------------------------------------------------------------------------+\n| 5-STATE COMPONENT MATRIX: Site Navigation View                                                    |\n+-------------------+--------------------------------------------------------------------------------+\n| State 1 (Default) | Split view: Left geographic map with site pin clusters; Right site cards with   |\n|                   | facility address, device counts, alarm badges, and zone drill-down buttons.    |\n| State 2 (Loading) | Map renders muted tile background with centering spinner; site list displays   |\n|                   | 4 skeleton card outlines with pulsing content blocks.                          |\n| State 3 (Empty)   | When no sites exist: \"No sites configured. Click '+ Add Site' to begin.\"       |\n| State 4 (Error)   | Map tile loading failure displays fallback: \"Map unavailable. Viewing list    |\n|                   | mode\" without blocking site card interaction.                                  |\n| State 5 (Overflow)| Facility titles > 35 chars clamp with tooltip; site tree supports collapsible  |\n|                   | accordion nodes up to 6 depth levels with breadcrumb navigation.               |\n+-------------------+--------------------------------------------------------------------------------+\n```\n\n#### FR-11: Geographic Site Visualization (\"Point On Map\")\n\nThe system MUST display site locations on an interactive geographic map using GPS coordinates (`Point On Map` `#290:5447`). Realizes UJ-1.\n\n- **Consequences (testable)**:\n  - Clicking a site marker centers the map and filters the device catalog to that facility.\n  - Clustered markers expand smoothly when zooming into dense municipal regions.\n\n#### FR-12: Multi-Tier Site Hierarchy\n\nThe system MUST model sites as hierarchical trees (Region > Facility > Building > Floor > Zone). Realizes UJ-2.\n\n- **Consequences (testable)**:\n  - Devices inherit the parent facility's operational policies and access control boundaries.\n  - Breadcrumbs reflect the full path (e.g., `West Region / Dallas Campus / Building 4 / Rooftop`).\n\n#### FR-13: Site Health Indicator\n\nThe system MUST compute and display an aggregate health badge for each facility based on active child alarms. Realizes UJ-1.\n\n- **Consequences (testable)**:\n  - Site with >=1 Critical alarm displays red `Critical` badge.\n  - Site with only Minor alarms displays yellow `Warning` badge.\n  - Site with 0 active alarms displays green `Healthy` badge.\n\n#### FR-14: Site Catalog Search & Filtering\n\nThe system MUST support searching facilities by name, city, postal code, and assigned manager. Realizes UJ-1, UJ-3.\n\n- **Consequences (testable)**:\n  - Matching sites are highlighted simultaneously on both map and list views.\n\n---\n\n### 4.5 Alarm & Incident Triage Console\n\n**Description**: Real-time event and incident triage interface (`Manage Alarms` `#293:8138`, `Manage Alarms List` `#293:10463`, `Devices - Alarms` `#362:14623`) streaming critical equipment alarms and providing rapid acknowledgment workflows. Realizes UJ-1.\n\n```\n+----------------------------------------------------------------------------------------------------+\n| 5-STATE COMPONENT MATRIX: Alarm Triage View                                                       |\n+-------------------+--------------------------------------------------------------------------------+\n| State 1 (Default) | Chronological alarm feed sorted by severity (Critical, Major, Minor, Info),    |\n|                   | showing device name, timestamp, trigger value, and \"Acknowledge\" button.       |\n| State 2 (Loading) | Table skeleton placeholder rows with shimmering badges; live-stream indicator  |\n|                   | shows pulsing dot.                                                             |\n| State 3 (Empty)   | \"Zero Active Alarms — All systems operational\" state featuring a green shield   |\n|                   | icon and prompt to view historical logs.                                       |\n| State 4 (Error)   | Disconnected streaming banner: \"Live event stream interrupted. Reconnecting    |\n|                   | in 5s... [Force Refresh]\"; retains existing alarms with timestamp notice.      |\n| State 5 (Overflow)| Long alarm diagnostic descriptions clamp to 2 lines with a \"+ Expand\" link;   |\n|                   | pagination controls engage automatically when active alarms exceed 100 entries.|\n+-------------------+--------------------------------------------------------------------------------+\n```\n\n#### FR-15: Multi-Tier Alarm Categorization\n\nThe system MUST categorize alarms into 4 explicit severity tiers: `Critical`, `Major`, `Minor`, and `Info`. Realizes UJ-1.\n\n- **Consequences (testable)**:\n  - Critical alarms trigger visual pulse animation and float to the top of the queue.\n  - Colors strictly adhere to design system: Critical (`#E50026`), Major (`#FE5B26`), Minor (`#FF8C65`), Info (`#0A93D3`).\n\n#### FR-16: Alarm Acknowledgment Workflow\n\nThe system MUST permit authenticated operators to acknowledge active alarms. Realizes UJ-1.\n\n- **Consequences (testable)**:\n  - Clicking \"Acknowledge\" prompts for optional incident comment and updates status to `Acknowledged`.\n  - Records acknowledging operator ID and timestamp in the immutable event log.\n  - Removes alarm from the unresolved alert counter.\n\n#### FR-17: Device Telemetry Inspection from Alarm\n\nThe system MUST provide direct one-click navigation from any alarm row to the triggering device's live telemetry view. Realizes UJ-1.\n\n- **Consequences (testable)**:\n  - Clicking device link opens the device telemetry pane scoped to the incident timeframe (+/- 15 minutes).\n\n#### FR-18: Real-Time Event Stream Notification\n\nThe system MUST deliver live alarm events to the web client via WebSocket or Server-Sent Events (SSE) with sub-second latency. Realizes UJ-1.\n\n- **Consequences (testable)**:\n  - Incoming alarms appear dynamically at the top of the list without requiring full page reload.\n  - If WebSocket drops, automatic exponential backoff reconnection initiates within 2 seconds.\n\n---\n\n### 4.6 User Administration & Granular Per-Site RBAC\n\n**Description**: Centralized user provisioning and security management (`Devices - Users` `#362:14622`) enforcing per-site authorization boundaries across tenant operators. Realizes UJ-3.\n\n```\n+----------------------------------------------------------------------------------------------------+\n| 5-STATE COMPONENT MATRIX: User Administration View                                                |\n+-------------------+--------------------------------------------------------------------------------+\n| State 1 (Default) | User table listing Avatar, Name, Email, Role badge, Assigned Sites list, and   |\n|                   | \"Edit Permissions\" action menu.                                                |\n| State 2 (Loading) | Table row skeleton placeholders; action buttons disabled during network fetch. |\n| State 3 (Empty)   | \"No users found\" zero-state with \"+ Invite User\" button.                       |\n| State 4 (Error)   | Action-level error toast: \"Permission update failed: Insufficient authority\"   |\n|                   | with red border highlight on failed record.                                    |\n| State 5 (Overflow)| Users assigned to > 5 sites display \"+N more\" badge with full popover list on  |\n|                   | hover; user emails > 32 characters truncate with ellipsis.                     |\n+-------------------+--------------------------------------------------------------------------------+\n```\n\n#### FR-19: Per-Site Role-Based Access Control (RBAC)\n\nThe system MUST enforce role scoping at the per-site level. Realizes UJ-3.\n\n- **Consequences (testable)**:\n  - Supported roles: `Admin` (Global), `Site Manager` (Designated sites), `Technician` (Designated sites, operate-only), `Viewer` (Designated sites, read-only).\n  - Users with `Site Manager` at Site A cannot access, edit, or view alarms for Site B unless explicitly granted.\n\n#### FR-20: User Invitation & Account Provisioning\n\nThe system MUST allow Admins to invite new users via email and assign their initial site-role pairs. Realizes UJ-3.\n\n- **Consequences (testable)**:\n  - Inviting a user dispatches a time-limited onboarding link (48-hour expiration).\n  - Invited user appears with status `Invited` until password setup is finalized.\n\n#### FR-21: Immediate Permission Revocation\n\nThe system MUST immediately invalidate session access when a user's role or site assignment is revoked. Realizes UJ-3.\n\n- **Consequences (testable)**:\n  - Revoking access invalidates existing JWT tokens within 60 seconds across all active browser sessions.\n\n#### FR-22: Administrative Security Audit Log\n\nThe system MUST record all user provisioning, role adjustments, and login events in a tamper-evident audit log. Realizes UJ-3.\n\n- **Consequences (testable)**:\n  - Audit records include Timestamp (UTC), Initiating User ID, Target User ID, Action Type, and Delta.\n\n---\n\n## 5. Non-Goals (Explicit)\n\n- **[NON-GOAL for MVP] Over-The-Air (OTA) Firmware Flashing**: Fleet 360 v1 displays firmware versions but does NOT execute binary firmware uploads or flashes to devices.\n- **[NON-GOAL for MVP] Native Mobile Builds**: Fleet 360 v1 is a responsive Web Application (Desktop & Tablet); no native iOS or Android apps will be distributed via app stores.\n- **[NON-GOAL for MVP] Custom End-User Dashboard Widget Drag-and-Drop**: Layout follows the deterministic 8-layer Figma architecture; custom end-user canvas rearranging is deferred to v2.\n- **[NON-GOAL for MVP] Customer Billing & SaaS Metering**: Invoicing, payment gateway connections, and tenant subscription billing are out of scope for the operational telemetry MVP.\n\n---\n\n## 6. MVP Scope\n\n### 6.1 In Scope (v1 MVP)\n\n- Full Authentication Flow (Login, Terms Consent, Password Recovery).\n- Command Center Landing Dashboard (`Header`, `Landing` overview cards for Devices, Sites, Users).\n- Complete Device Catalog with Active/Inactive filters, Unassigned device queue, and Search.\n- Site Hierarchy view with \"Point On Map\" geographic navigation.\n- Real-time Alarm Triage Console with 4-tier severity ranking and acknowledgment workflow.\n- User Administration with Per-Site RBAC.\n- Mandatory 5-State Component Matrix implemented across all 6 views.\n\n### 6.2 Out of Scope for MVP\n\n- Direct PLC / Modbus serial protocol bridging (assumes IP/MQTT gateway ingestion).\n- Automated AI predictive equipment failure forecasting (v2 roadmap).\n- SMS / Phone-call automated dispatch dialing (in-app notifications and email alerts only for v1).\n\n---\n\n## 7. Success Metrics\n\n### 7.1 Primary Metrics\n\n- **SM-1: Mean Time to Triage (MTTT)**: Average time from critical alarm trigger to operator acknowledgment decreases to < 2 minutes across monitored facilities. Validates FR-15, FR-16, FR-18.\n- **SM-2: Unassigned Device Provisioning Speed**: Average duration to discover, name, and bind a new edge device to a site hierarchy takes < 60 seconds. Validates FR-7, FR-8, FR-12.\n\n### 7.2 Secondary Metrics\n\n- **SM-3: Core Page Performance**: Command Center Landing and Device Catalog views achieve Largest Contentful Paint (LCP) < 1.5s and Cumulative Layout Shift (CLS) < 0.05 on standard 4G/broadband connections. Validates FR-4, FR-5, FR-7.\n\n### 7.3 Counter-Metrics (Do Not Optimize At Expense Of)\n\n- **SM-C1: Alarm Fatigue Suppression**: Ensuring rapid MTTT (SM-1) is NOT achieved by auto-silencing or suppressing minor/warning alerts; 100% of telemetry threshold breaches must be logged to the event stream. Counterbalances SM-1.\n\n---\n\n## 8. Cross-Cutting Non-Functional Requirements (NFRs)\n\n### 8.1 Performance & Latency\n\n- **NFR-1**: Initial application bundle download must be under 350 KB (gzipped); code-splitting enforced per primary route (`/login`, `/`, `/devices`, `/sites`, `/alarms`, `/users`).\n- **NFR-2**: WebSocket event propagation latency must not exceed 500ms from telemetry broker to browser DOM rendering.\n\n### 8.2 Security & Compliance\n\n- **NFR-3**: All data in transit must be encrypted using TLS 1.3; all sensitive persistent credentials encrypted using AES-256.\n- **NFR-4**: API endpoints must validate JWT claims and enforce Per-Site RBAC checks on every request.\n- **NFR-5**: Passwords hashed using Argon2id or bcrypt (work factor >= 12).\n\n### 8.3 Reliability & Availability\n\n- **NFR-6**: Platform availability SLA target of 99.9% uptime during operational business hours.\n- **NFR-7**: Zero data loss for alarm events; if browser connectivity drops, buffered events replay upon socket reconnection.\n\n### 8.4 Usability & Accessibility\n\n- **NFR-8**: Minimum contrast ratio of 4.5:1 for all text elements in accordance with WCAG 2.1 AA standards.\n- **NFR-9**: Full keyboard accessibility: every button, input, card, and modal action navigable via standard Tab / Enter / Escape key sequences.\n\n---\n\n## 9. Open Questions & Assumptions Index\n\n### 9.1 Open Questions\n\n1. **OQ-1**: What is the maximum anticipated count of concurrent edge devices per single tenant in v1? _(Assumption: Up to 5,000 devices per tenant)_.\n2. **OQ-2**: Will mapping tiles use OpenStreetMap, Mapbox, or Google Maps API for the \"Point On Map\" visualization? _(Assumption: OpenStreetMap via Leaflet for MVP to avoid proprietary API key blockers)_.\n\n### 9.2 Assumptions Index\n\n- `[ASSUMPTION: §4.1]` Password complexity requires minimum 8 characters, at least one uppercase letter, one number, and one special character.\n- `[ASSUMPTION: §4.3]` Devices communicate through standard JSON over HTTPS/WSS or MQTT over WebSockets.\n- `[ASSUMPTION: §4.5]` Alarm acknowledgment does not automatically clear the physical fault; clearing requires the edge device telemetry to return below trigger threshold.\n- `[ASSUMPTION: §4.6]` Only Global Admins can create new Sites; Site Managers can only modify devices and users within their assigned facilities.\n"},{"id":"_acl-output_2-plan-workflows_acl-prd_reconcile-brief_md","folderPath":"_acl-output/2-plan-workflows/acl-prd","filename":"reconcile-brief.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-10-15T07:22:55.795Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T04:35:12.355Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Project Reconcile-Brief: Fleet 360\"\ntype: audit\ncreated: 2026-10-14\n---\n\n# Reconcile Audit: Product Brief to PRD\n\n## 1. Executive Summary\n\nThis audit reconciles the Manager-approved **Phase 1 Product Brief** (`_acl-output/1-analysis/acl-product-brief/brief.md`) with the **Phase 2 Product Requirements Document (PRD)** (`_acl-output/2-plan-workflows/acl-prd/prd.md`) for **Fleet 360**.\n\nAll functional boundaries, target personas, scope constraints, and visual design inputs from Figma node `104:7811` were systematically verified.\n\n---\n\n## 2. Requirement Reconciliation Matrix\n\n| Brief Section           | Brief Core Intent                                   | PRD Realization                              | Status            | Notes / Gaps                                                                               |\n| :---------------------- | :-------------------------------------------------- | :------------------------------------------- | :---------------- | :----------------------------------------------------------------------------------------- |\n| **Problem Statement**   | Fragmented asset visibility across multiple portals | §4.3 Device Management & §4.4 Site Hierarchy | **Fully Covered** | FR-7 through FR-14 deliver unified single pane of glass.                                   |\n| **Problem Statement**   | Delayed fault & alarm detection leading to outages  | §4.5 Alarm & Incident Triage Console         | **Fully Covered** | FR-15 through FR-18 deliver real-time sub-second alarm streams with 4 severity levels.     |\n| **Problem Statement**   | Complex multi-site access administration            | §4.6 User Administration & Granular RBAC     | **Fully Covered** | FR-19 through FR-22 enforce per-site role assignments.                                     |\n| **Authentication Flow** | Email, password, forgot password, terms policy      | §4.1 Authentication & Session Security       | **Fully Covered** | FR-1 through FR-3 implement exact Figma Login layout `#1228:11322`.                        |\n| **Executive Landing**   | Command center with direct navigation cards         | §4.2 Command Center Landing Dashboard        | **Fully Covered** | FR-4 through FR-6 implement Figma Landing `#227:3884` with Devices, Sites, and Users hubs. |\n| **Device Control**      | Active/inactive status, unassigned cards, search    | §4.3 Device Lifecycle & Telemetry Catalog    | **Fully Covered** | FR-7 through FR-10 cover active/inactive filters and unassigned cards.                     |\n| **Site Management**     | Visual site cards and geographic map indicators     | §4.4 Site Hierarchy & Geographic Navigation  | **Fully Covered** | FR-11 through FR-14 cover Point On Map `#290:5447` and site breadcrumbs.                   |\n| **UI State Invariant**  | 100% Fidelity 5-State Component Matrix              | §4 Features (All Subsections)                | **Fully Covered** | Every UI view specifies Baseline, Loading skeleton, Empty, Error, and Overflow states.     |\n| **Non-Goals / Scope**   | No OTA firmware flashing in MVP                     | §5 Non-Goals & §6.2 Out of Scope             | **Maintained**    | Explicitly excluded from MVP scope.                                                        |\n| **Non-Goals / Scope**   | Web desktop/tablet focus (no native iOS/Android)    | §5 Non-Goals & §6.2 Out of Scope             | **Maintained**    | Responsive web application standard enforced.                                              |\n\n---\n\n## 3. Qualitative & Aesthetic Alignment\n\n- **Visual Fidelity**: Verified against Figma reference `Login.png` and `Landing.png` and AST in `src/assets/figma/figma-node.json`.\n- **Tone & Persona Voice**: Maintains enterprise operational gravity, focusing on high reliability, fast incident remediation, and deterministic system responsiveness.\n- **5-State Matrix Verification**: No component is specified as a purely static happy-path mock; loading skeletons, empty zero-states, error retries, and text boundary clampings are fully documented.\n\n---\n\n## 4. Audit Verdict\n\n- **Total Requirements Audited**: 10\n- **Requirements Satisfied**: 10\n- **Scope Drift Detected**: 0\n- **Unresolved Inconsistencies**: 0\n- **Gate Recommendation**: **PASS (In Review)**\n"},{"id":"_acl-output_3-solutioning_acl-architecture_ARCHITECTURE-SPINE_md","folderPath":"_acl-output/3-solutioning/acl-architecture","filename":"ARCHITECTURE-SPINE.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-10-15T07:22:55.922Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T04:48:01.860Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\nname: Fleet 360\ntype: architecture-spine\npurpose: build-substrate\naltitude: feature\nparadigm: vertical-slice-modular-monolith\nscope: Fleet 360 Web Application & Telemetry Portal\ncreated: \"2026-10-14\"\nupdated: \"2026-10-14\"\nbinds:\n  - FR-1\n  - FR-2\n  - FR-3\n  - FR-4\n  - FR-5\n  - FR-6\n  - FR-7\n  - FR-8\n  - FR-9\n  - FR-10\n  - FR-11\n  - FR-12\n  - FR-13\n  - FR-14\n  - FR-15\n  - FR-16\n  - FR-17\n  - FR-18\n  - FR-19\n  - FR-20\n  - FR-21\n  - FR-22\nsources:\n  - _acl-output/1-analysis/acl-product-brief/brief.md\n  - _acl-output/2-plan-workflows/acl-prd/prd.md\n  - src/assets/figma/figma-node.json\ncompanions: []\n---\n\n# Architecture Spine — Fleet 360\n\n## Design Paradigm\n\nFleet 360 is built as a **Vertical-Slice Modular Monolith** using React, TypeScript, and Tailwind CSS. Each core business capability is organized into a self-contained, domain-scoped vertical slice that encapsulates its own presentation components, state management, API hooks, types, and mock telemetry fixtures. Cross-cutting shared infrastructure (design tokens, primitives, HTTP/WebSocket transports, auth context) forms a thin foundational substrate that slices consume but never depend on each other through internal leakage.\n\n```mermaid\ngraph TD\n    AppShell[\"App Shell & Router (src/app/)\"]\n    SharedPrimitives[\"Shared Primitives (src/components/ui/)\"]\n    DesignTokens[\"Design Tokens & theme.css (src/assets/figma/)\"]\n    Transports[\"API & WebSocket Transports (src/shared/api/)\"]\n\n    SliceAuth[\"Auth Slice (src/features/auth/)\"]\n    SliceLanding[\"Landing Slice (src/features/landing/)\"]\n    SliceDevices[\"Devices Slice (src/features/devices/)\"]\n    SliceSites[\"Sites Slice (src/features/sites/)\"]\n    SliceAlarms[\"Alarms Slice (src/features/alarms/)\"]\n    SliceUsers[\"Users Slice (src/features/users/)\"]\n\n    AppShell --> SliceAuth\n    AppShell --> SliceLanding\n    AppShell --> SliceDevices\n    AppShell --> SliceSites\n    AppShell --> SliceAlarms\n    AppShell --> SliceUsers\n\n    SliceAuth --> SharedPrimitives\n    SliceLanding --> SharedPrimitives\n    SliceDevices --> SharedPrimitives\n    SliceSites --> SharedPrimitives\n    SliceAlarms --> SharedPrimitives\n    SliceUsers --> SharedPrimitives\n\n    SharedPrimitives --> DesignTokens\n    SliceDevices --> Transports\n    SliceSites --> Transports\n    SliceAlarms --> Transports\n    SliceUsers --> Transports\n```\n\n---\n\n## Invariants & Rules\n\n### AD-1 — Exact Typography via Google Fonts Link [ADOPTED]\n\n- **Binds:** `all UI components, index.html, typography system`\n- **Prevents:** `typography drift, baseline misalignments, unstyled system font fallback`\n- **Rule:** `index.html` MUST embed Google Fonts `<link rel=\"stylesheet\">` importing the exact font families from Figma design deliverable `104:7811`:\n  ```html\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link\n    href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;500;600;700&display=swap\"\n    rel=\"stylesheet\"\n  />\n  ```\n  Tailwind configuration MUST extend `fontFamily` mapping `sans: ['Roboto', 'Inter', 'sans-serif']`. Default browser system fonts (`ui-sans-serif`, Arial) are forbidden as primary typography in application styling.\n\n### AD-2 — Design Tokens & Shadow Elevation Linked from theme.css [ADOPTED]\n\n- **Binds:** `all UI color fills, border strokes, gradient backgrounds, and elevation shadows`\n- **Prevents:** `arbitrary hex hardcoding, theme divergence, inconsistent shadow depths`\n- **Rule:** All styling MUST reference CSS custom properties exported in `src/assets/figma/theme.css`. Components must never declare arbitrary one-off color hex strings that deviate from the design system tokens. Tailwind configuration MUST link semantic color utilities directly to the CSS custom properties:\n  - `--fleet-red: #E40F37` (Primary Red CTA Action)\n  - `--fleet-red-hover: #CC0D31` (Hover Red State)\n  - `--fleet-blue: #0094D9` (Interactive Brand Blue)\n  - `--fleet-navy-login: #003366` (Deep Navy Login Canvas)\n  - `--fleet-slate-dark: #4A5568` (Dark Slate Landing Hub Container)\n  - `--fleet-navy-text: #1E3A8A` (Deep Navy Welcome Typography)\n  - `--fleet-white: #FFFFFF` (Pure White Canvas / Card Surfaces)\n  - Semantic status tokens: Alert Major (`#FE5B26`), Success Active (`#34C759`), Inactive Muted (`#9CA0B3`).\n\n### AD-3 — Vertical Slice Modularity under src/features/<feature-name>/ [ADOPTED]\n\n- **Binds:** `all application code organization, routing, component boundaries`\n- **Prevents:** `horizontal layer sprawl, tight coupling between distinct business domains, circular dependencies`\n- **Rule:** Every domain capability MUST reside in its own vertical slice under `src/features/<feature-name>/` with a strict `index.ts` public interface barrier:\n  - `src/features/auth/` (Login, Session, Compliance consent)\n  - `src/features/landing/` (Command Center, Overview Hub Cards)\n  - `src/features/devices/` (Device catalog, unassigned queue, status filters, properties)\n  - `src/features/sites/` (Site hierarchy, Point On Map geographic visualization)\n  - `src/features/alarms/` (Real-time alarm feed, severity ranking, acknowledgment)\n  - `src/features/users/` (User directory, Per-Site RBAC assignment)\n    Cross-feature imports must ONLY import from sibling `index.ts` barrels, never reaching into internal subdirectories (e.g., importing `src/features/devices/internal/...` from `src/features/sites/` is strictly forbidden). Shared UI primitives (buttons, inputs, modal dialogs) reside in `src/components/ui/`.\n\n### AD-4 — 5-State Component Matrix Enforcement [ADOPTED]\n\n- **Binds:** `all feature view controllers, page shells, and interactive cards`\n- **Prevents:** `unhandled loading freezes, white screens on network failures, layout collapse on empty lists, uncontained text overflow`\n- **Rule:** Every user-facing view MUST implement the deterministic 5-State Component Matrix:\n  1. **State 1 (Baseline / Default):** Exact Figma design mockup rendering happy-path data.\n  2. **State 2 (Loading):** Shimmer skeleton bars matching exact container bounding boxes (`width`, `height`, `aspect-ratio`) to prevent Cumulative Layout Shift (CLS < 0.05).\n  3. **State 3 (Empty):** Zero-item state illustration with actionable onboarding prompt.\n  4. **State 4 (Error):** Inline error banner or toast notification accompanied by an active \"Retry\" action trigger.\n  5. **State 5 (Overflow / Boundary):** Maximum character count handling via CSS text truncation (`truncate`, `line-clamp-2`), tooltip popover on hover, and responsive layout wrapping.\n\n```mermaid\nstateDiagram-v2\n    [*] --> Loading: Mount / Query Trigger\n    Loading --> Default: Success (Items > 0)\n    Loading --> Empty: Success (Items == 0)\n    Loading --> Error: Network / API Failure\n    Default --> Overflow: Long Text / Viewport Resize\n    Empty --> Loading: Action / Refresh\n    Error --> Loading: Retry Action\n```\n\n### AD-5 — Client-Side Per-Site RBAC and JWT Session Management [ADOPTED]\n\n- **Binds:** `routing guard, API request interceptors, navigation visibility`\n- **Prevents:** `unauthorized cross-site data exposure, privilege escalation, leaking tenant telemetry`\n- **Rule:** The global application shell must enforce a per-site RBAC authorization guard. Navigation items, action buttons, and telemetry streams must be scoped strictly to the user's active site context and assigned role (`Admin`, `Site Manager`, `Technician`, `Viewer`). Unauthorized routes must redirect to `/` with an access-denied notification.\n\n### AD-6 — Deterministic Figma MCP Asset Pipeline & Zero Placeholder Rule [ADOPTED]\n\n- **Binds:** `all visual iconography, brand marks, and layout artwork across all components`\n- **Prevents:** `generic placeholder icons, visual drift, unverified SVGs, missing high-res artwork`\n- **Rule:** All vector icons and illustration assets MUST be downloaded directly from the official Figma design canvas (`FE12zdGPJ4ROng1HfhL55c`) via the Figma MCP server into `src/assets/figma/` and exposed via `FigmaAssets` in `src/assets/figma/index.ts`. Hand-crafted or arbitrary third-party substitute icons are strictly prohibited from replacing design system deliverables. Components consume:\n  - `FigmaAssets.fleet360White` (Login logo)\n  - `FigmaAssets.fleet360Blue` (Landing logo)\n  - `FigmaAssets.loginHero` (Industrial AC compressor hero background)\n  - `FigmaAssets.aclDigitalLogo` (Powered by ACL Digital footer)\n  - `FigmaAssets.iconDevices`, `FigmaAssets.iconSites`, `FigmaAssets.iconUsers` (Hub Card icons)\n\n---\n\n## Consistency Conventions\n\n| Concern              | Convention                                                                                                               |\n| -------------------- | ------------------------------------------------------------------------------------------------------------------------ |\n| **Component Naming** | PascalCase for React components (`DeviceCatalog.tsx`, `SiteCard.tsx`). Match Figma node names where applicable.          |\n| **Directory Naming** | kebab-case for directories (`features/device-management/`, `components/ui/`).                                            |\n| **File Structure**   | Every feature folder contains `components/`, `hooks/`, `api/`, `types/`, and a public `index.ts`.                        |\n| **Data Identifiers** | Prefixed string IDs: `dev_<uuid>` for Devices, `site_<uuid>` for Sites, `usr_<uuid>` for Users, `alm_<uuid>` for Alarms. |\n| **Date & Time**      | All telemetry and audit timestamps stored and serialized in ISO 8601 UTC (`YYYY-MM-DDTHH:mm:ss.sssZ`).                   |\n| **State Mutation**   | React Query (`@tanstack/react-query`) for server state and caching; React Context for active site/tenant session state.  |\n| **CSS Architecture** | Tailwind CSS utility classes linked to `src/assets/figma/theme.css` tokens. No inline CSS `style=\"\"` attributes.         |\n\n---\n\n## Stack\n\n| Name                  | Version |\n| --------------------- | ------- |\n| Node.js               | 20.20.0 |\n| React                 | 18.3.1  |\n| TypeScript            | 5.5.4   |\n| Vite                  | 5.4.2   |\n| Tailwind CSS          | 3.4.10  |\n| Lucide React (Icons)  | 0.439.0 |\n| @tanstack/react-query | 5.56.2  |\n| React Router DOM      | 6.26.1  |\n\n---\n\n## Structural Seed\n\n```text\nmastercopy/\n├── index.html                           # Root HTML with Google Fonts link (AD-1)\n├── src/\n│   ├── app/\n│   │   ├── App.tsx                      # App root with providers & router\n│   │   └── routes.tsx                   # Route definitions & RBAC guards (AD-5)\n│   ├── assets/\n│   │   └── figma/\n│   │       ├── figma-node.json          # Parsed 15,490-node Figma AST (104:7811)\n│   │       ├── theme.css                # Extracted CSS color/shadow tokens (AD-2)\n│   │       ├── fleet360_white.svg       # Login white vector logo (Node 4003:14129)\n│   │       ├── fleet360_blue.svg        # Landing blue vector logo (Node 4003:14139)\n│   │       ├── acl_digital_logo.svg     # Powered by ACL Digital footer (Node 4045:14223)\n│   │       ├── icon_devices.svg         # Devices Hub Card icon (Node 227:3932)\n│   │       ├── icon_sites.svg           # Sites Hub Card icon (Node 227:3946)\n│   │       ├── icon_users.svg           # Users Hub Card icon (Node 227:3962)\n│   │       ├── login_hero.png           # Industrial AC compressor artwork (Node 1252:14409)\n│   │       ├── Login.png                # Reference screenshot\n│   │       ├── Landing.png              # Reference screenshot\n│   │       └── index.ts                 # FigmaAssets manifest export\n│   ├── components/\n│   │   └── ui/                          # Shared agnostic primitives (Button, Input, Card, Modal, Skeleton)\n│   ├── features/                        # Vertical slice architecture (AD-3)\n│   │   ├── auth/                        # Login, compliance consent, password recovery\n│   │   │   ├── components/\n│   │   │   ├── hooks/\n│   │   │   └── index.ts\n│   │   ├── landing/                     # Command center hero banner & hub cards\n│   │   │   ├── components/\n│   │   │   └── index.ts\n│   │   ├── devices/                     # Device catalog, inactive filters, unassigned queue\n│   │   │   ├── components/\n│   │   │   ├── hooks/\n│   │   │   └── index.ts\n│   │   ├── sites/                       # Site hierarchy & Point On Map visualization\n│   │   │   ├── components/\n│   │   │   ├── hooks/\n│   │   │   └── index.ts\n│   │   ├── alarms/                      # Real-time alarm stream & triage workflows\n│   │   │   ├── components/\n│   │   │   ├── hooks/\n│   │   │   └── index.ts\n│   │   └── users/                       # User directory & per-site RBAC provisioning\n│   │       ├── components/\n│   │       ├── hooks/\n│   │       └── index.ts\n│   └── shared/\n│       ├── api/                         # HTTP client & WebSocket stream manager\n│       ├── types/                       # Shared domain types\n│       └── utils/                       # Common formatting helpers\n```\n\n---\n\n## Capability → Architecture Map\n\n| Capability / Area                                | Lives in                          | Governed by            |\n| :----------------------------------------------- | :-------------------------------- | :--------------------- |\n| **FR-1..3 (Authentication & Terms)**             | `src/features/auth/`              | AD-1, AD-2, AD-4, AD-5 |\n| **FR-4..6 (Command Center Landing)**             | `src/features/landing/`           | AD-1, AD-2, AD-3, AD-4 |\n| **FR-7..10 (Device Catalog & Unassigned Queue)** | `src/features/devices/`           | AD-1, AD-2, AD-3, AD-4 |\n| **FR-11..14 (Site Hierarchy & Point On Map)**    | `src/features/sites/`             | AD-1, AD-2, AD-3, AD-4 |\n| **FR-15..18 (Real-Time Alarm Triage Stream)**    | `src/features/alarms/`            | AD-1, AD-2, AD-3, AD-4 |\n| **FR-19..22 (User Admin & Per-Site RBAC)**       | `src/features/users/`             | AD-1, AD-2, AD-3, AD-5 |\n| **Global Typography & Design Tokens**            | `index.html`, `src/assets/figma/` | AD-1, AD-2             |\n\n---\n\n## Deferred\n\n- **Automated OTA Firmware Update Pipeline**: Post-MVP; requires hardware bootloader integration and edge agent verification.\n- **Native Mobile Apps (iOS/Android)**: Post-MVP; responsive web shell satisfies operational requirements for v1.\n- **Third-Party SaaS Metering & Tenant Billing**: Post-MVP; enterprise deployment currently relies on contracted site licensing.\n"},{"id":"_acl-output_3-solutioning_acl-create-epics-and-stories_epics_md","folderPath":"_acl-output/3-solutioning/acl-create-epics-and-stories","filename":"epics.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T07:22:56.110Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T04:53:21.395Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Epics and User Stories: Fleet 360\"\nproject_type: greenfield\ncreated: 2026-10-14\nupdated: 2026-10-14\nstepsCompleted:\n  - step-01-validate-prerequisites\n  - step-02-design-epics\n  - step-03-create-stories\n  - step-04-final-validation\n---\n\n# Fleet 360 — Epic & Story Breakdown\n\n## Overview\n\nThis document defines the complete epic and user story breakdown for **Fleet 360**, translating the requirements from the approved **Product Brief** (`brief.md`), **PRD** (`prd.md`), and **Architecture Spine** (`ARCHITECTURE-SPINE.md`) into implementable delivery units.\n\nIn strict compliance with the **Two-Pass UI Story Decomposition Rule**, all user-facing interface modules are structured in two sequential passes:\n\n- **Pass 1 (Visual Shell — Story X.1):** 100% pixel-perfect static layout constructed using compiled Tailwind CSS utility classes linked to `theme.css` tokens and local Figma assets. Validated visually against Figma design deliverable `104:7811` with zero dynamic state.\n- **Pass 2 (Functional Wiring & State — Story X.2):** Full functional enablement, including React state, form handlers, API hooks, real-time WebSocket feeds, the mandatory 5-State Component Matrix (Default, Loading skeleton, Empty, Error, Overflow), and automated unit/integration tests (`npm test`).\n\n---\n\n## Requirements Inventory\n\n### Functional Requirements (FR-1 through FR-22)\n\n- **FR-1**: User Credential Authentication (Email & Password, JWT issue, lockout).\n- **FR-2**: Compliance Terms Acknowledgment (Terms of Service & Privacy Notice consent).\n- **FR-3**: Password Reset Initiation (Self-service recovery flow).\n- **FR-4**: Global App Shell & Navigation Header (Pinned header, branding, user menu, global search).\n- **FR-5**: Core Management Hub Routing (Interactive cards for Devices, Sites, Users).\n- **FR-6**: High-Level Fleet Telemetry Summary (Aggregated operational counts).\n- **FR-7**: Real-Time Device Listing & Status Filtering (Active, Inactive, In Alarm).\n- **FR-8**: Unassigned Device Provisioning Queue (Segregated unassigned edge controllers).\n- **FR-9**: Fast Keyword Search (Debounced client-side filtering).\n- **FR-10**: Device Property Configuration (Metadata editing and persistence).\n- **FR-11**: Geographic Site Visualization (\"Point On Map\" GPS coordinates).\n- **FR-12**: Multi-Tier Site Hierarchy (Region > Facility > Building > Floor > Zone).\n- **FR-13**: Site Health Indicator (Aggregated status badges based on child alarms).\n- **FR-14**: Site Catalog Search & Filtering (City, zip code, facility search).\n- **FR-15**: Multi-Tier Alarm Categorization (Critical, Major, Minor, Info).\n- **FR-16**: Alarm Acknowledgment Workflow (Incident comment and acknowledgment log).\n- **FR-17**: Device Telemetry Inspection from Alarm (Direct navigation to device telemetry).\n- **FR-18**: Real-Time Event Stream Notification (Sub-second WebSocket/SSE alarm feed).\n- **FR-19**: Per-Site Role-Based Access Control (Admin, Site Manager, Tech, Viewer).\n- **FR-20**: User Invitation & Account Provisioning (Time-limited invitation link).\n- **FR-21**: Immediate Permission Revocation (Instant session invalidation).\n- **FR-22**: Administrative Security Audit Log (Tamper-evident administrative history).\n\n### Architecture Invariants (AD-1 through AD-5)\n\n- **AD-1 (Typography)**: Roboto and Inter imported via Google Fonts link in `index.html`.\n- **AD-2 (Design Tokens)**: Colors and shadows bound to `src/assets/figma/theme.css`.\n- **AD-3 (Vertical Slices)**: Features isolated under `src/features/<feature-name>/` with public `index.ts`.\n- **AD-4 (5-State Matrix)**: Baseline, Loading skeleton, Empty, Error, Overflow across all views.\n- **AD-5 (Security Guard)**: Client-side per-site RBAC routing and session guard.\n\n---\n\n## FR Coverage Map\n\n| Functional Requirement         | Assigned Epic                      | Implementing Stories                       | Verification Method                    |\n| :----------------------------- | :--------------------------------- | :----------------------------------------- | :------------------------------------- |\n| **FR-1, FR-2, FR-3**           | Epic 1: Authentication & App Shell | Story 1.1 (Visual), Story 1.2 (Functional) | Visual regression + Jest auth tests    |\n| **FR-4, FR-5, FR-6**           | Epic 2: Command Center Landing     | Story 2.1 (Visual), Story 2.2 (Functional) | Visual regression + Router tests       |\n| **FR-7, FR-8, FR-9, FR-10**    | Epic 3: Device Lifecycle Catalog   | Story 3.1 (Visual), Story 3.2 (Functional) | Component test + Mock API tests        |\n| **FR-11, FR-12, FR-13, FR-14** | Epic 4: Site Hierarchy & Map       | Story 4.1 (Visual), Story 4.2 (Functional) | Map render test + Tree filter tests    |\n| **FR-15, FR-16, FR-17, FR-18** | Epic 5: Real-Time Alarm Triage     | Story 5.1 (Visual), Story 5.2 (Functional) | WebSocket mock test + Acknowledge test |\n| **FR-19, FR-20, FR-21, FR-22** | Epic 6: User Admin & Per-Site RBAC | Story 6.1 (Visual), Story 6.2 (Functional) | RBAC guard test + Invite flow test     |\n\n---\n\n## Epic List\n\n- **Epic 1: Authentication & Global App Shell** (Login screen `#1228:11322` and Header `#257:8132`).\n- **Epic 2: Command Center Landing Console** (Landing surface `#227:3884` with Hub Cards).\n- **Epic 3: Device Lifecycle Management & Unassigned Queue** (Catalog `#362:14620`, Device Card `#231:1152`, Unassigned Card `#256:10410`).\n- **Epic 4: Site Hierarchy & Geographic Visualization** (Site console `#362:14621`, Point On Map `#290:5447`).\n- **Epic 5: Real-Time Alarm & Incident Triage Stream** (Alarms `#293:8138`, Alarm List `#293:10463`, Alarms View `#362:14623`).\n- **Epic 6: User Administration & Per-Site RBAC** (Users directory `#362:14622` and invite modal).\n\n---\n\n## Epic 1: Authentication & Global App Shell\n\nDeliver the secure entry gateway and persistent application shell for Fleet 360, establishing the visual baseline and authentication session management.\n\n### Story 1.1: Authentication & Global Header Visual Shell (Pass 1)\n\nAs a frontend developer,  \nI want to build the static visual layout for the Login screen matching Figma,  \nSo that the visual presentation achieves 100% pixel-perfect fidelity before adding dynamic logic.\n\n**Acceptance Criteria:**\n\n- **Given** Figma node `Login` (`#1228:11322`), white vector logo `fleet360_white.svg` (Node `4003:14129`), industrial compressor hero `login_hero.png` (Node `1252:14409`), and `acl_digital_logo.svg` (Node `4045:14223`),\n- **When** the developer renders `src/components/LoginView.jsx`,\n- **Then** the split-screen hero layout renders with deep blue background `#003366`, right-aligned compressor artwork with 4-stop gradient blend overlay, white vector logo, Email & Password inputs, and centered authentication card matching Figma reference `src/assets/figma/Login.png`.\n- **And** all inputs (Email, Password) and action elements (\"Forgot Password?\", \"Login\" in `#E40F37`, terms agreement copy) render with exact Inter typography baselines and compiled Tailwind classes.\n- **And** the footer renders \"Powered by\" and `acl_digital_logo.svg` with zero dynamic state or network calls.\n\n### Story 1.2: Authentication Functional Wiring & State (Pass 2)\n\nAs an authorized facility operator,  \nI want to submit my credentials, accept regulatory terms, and securely authenticate into Fleet 360,  \nSo that I can access my designated site telemetry in accordance with corporate security policy.\n\n**Acceptance Criteria:**\n\n- **Given** the static `LoginView` component from Story 1.1,\n- **When** valid user credentials and checked terms consent are submitted,\n- **Then** the system calls the authentication API, stores JWT tokens in secure storage, and redirects to `/` within 500ms.\n- **And** the mandatory 5-State Component Matrix is fully operational:\n  - **Loading:** Submit button shows spinner and label \"Authenticating...\" while inputs are disabled.\n  - **Empty:** Pristine fields display placeholders (\"Enter Email\", \"Enter Password\").\n  - **Error:** Submitting invalid credentials displays an inline error banner (\"Invalid email or password. Please try again.\") and highlights failed inputs.\n  - **Overflow:** Long email addresses (> 35 chars) scroll horizontally without breaking container layout; mobile viewports (< 768px) stack into a responsive single column.\n- **And** automated test suite (`npm test`) verifies validation errors, token storage, and session guard redirection.\n\n---\n\n## Epic 2: Command Center Landing Console\n\nProvide operational leaders with an aggregated high-level command center and intuitive navigation into operational subsystems.\n\n### Story 2.1: Command Center Landing Visual Shell (Pass 1)\n\nAs a frontend developer,  \nI want to construct the static visual layout for the Command Center Landing dashboard,  \nSo that the overview cards and hero banner mirror Figma frame `Landing` (`#227:3884`) with 100% fidelity.\n\n**Acceptance Criteria:**\n\n- **Given** Figma frame `Landing` (`#227:3884`), blue vector logo `fleet360_blue.svg` (Node `4003:14139`), and Hub Card vector icons `icon_devices.svg` (`#227:3932`), `icon_sites.svg` (`#227:3946`), and `icon_users.svg` (`#227:3962`),\n- **When** the developer renders `src/features/landing/components/LandingView.jsx` (and `src/components/LandingView.jsx`),\n- **Then** the dual-tone executive dashboard renders: top half in pure white (`#FFFFFF`) featuring the blue Fleet 360 vector logo and navy headline (\"Welcome to Fleet 360\", `#1E3A8A`); bottom half in dark slate (`#4A5568`) hosting the 3 Hub Cards (Devices, Sites, Users) matching `src/assets/figma/Landing.png`.\n- **And** all Hub Cards render with authentic Figma vector icons, crisp white titles, muted descriptions, and red pill action buttons (`#E40F37`, hover `#CC0D31`).\n\n### Story 2.2: Landing Console Functional Wiring & Aggregated Telemetry State (Pass 2)\n\nAs a facilities operations manager,  \nI want the landing dashboard to display live aggregated fleet counters and navigate directly to management consoles,  \nSo that I can assess operational health at a glance and jump straight to impacted areas.\n\n**Acceptance Criteria:**\n\n- **Given** the static `LandingView` component from Story 2.1,\n- **When** an operator loads the landing page,\n- **Then** the platform fetches aggregated counts (active devices, monitored sites, users) scoped to the user's authorized sites.\n- **And** clicking \"Manage Devices\", \"Manage Sites\", or \"Manage Users\" routes to `/devices`, `/sites`, and `/users` respectively.\n- **And** the mandatory 5-State Component Matrix is enforced:\n  - **Loading:** Shimmer skeleton placeholders display across the banner and 3 cards with zero layout shift (CLS < 0.05).\n  - **Empty:** New tenants with zero connected hardware display onboarding prompts (\"Connect your first gateway\").\n  - **Error:** Polling failures render card-level retry triggers without breaking the parent dashboard shell.\n  - **Overflow:** Grid wraps responsively (3 columns desktop, 2 columns tablet, 1 column mobile); card descriptions clamp at 3 lines with ellipsis.\n- **And** automated tests verify metric calculation, error boundary fallbacks, and router transitions.\n\n---\n\n## Epic 3: Device Lifecycle Management & Unassigned Queue\n\nEmpower engineering teams to discover, inspect, configure, and provision IoT edge devices across distributed locations.\n\n### Story 3.1: Device Catalog & Unassigned Queue Visual Shell (Pass 1)\n\nAs a frontend developer,  \nI want to implement the static visual presentation for the Device Catalog and Unassigned Card,  \nSo that the device table and card elements mirror Figma components `Devices - Devices` (`#362:14620`), `Manage Devices_Card` (`#231:1152`), and `Un-assigned Card` (`#256:10410`).\n\n**Acceptance Criteria:**\n\n- **Given** Figma components `#362:14620`, `#231:1152`, and `#256:10410`,\n- **When** `src/features/devices/components/DeviceCatalogView.tsx` is rendered,\n- **Then** the device list, status pills (Active, Inactive, Alarm), Inactive dropdown trigger (`#259:2947`), and Unassigned device card render with exact Figma typography, colors (`#34C759`, `#FE5B26`, `#9CA0B3`), and border tokens.\n- **And** layout renders statically with mock hardware entries without active API connections.\n\n### Story 3.2: Device Catalog Functional Wiring & State (Pass 2)\n\nAs a field service technician,  \nI want to filter devices by status, search by serial/MAC, and provision unassigned edge controllers,  \nSo that I can inspect device health and associate hardware with physical facility rooms.\n\n**Acceptance Criteria:**\n\n- **Given** the static device catalog from Story 3.1,\n- **When** a user types in the search bar or toggles the Active/Inactive dropdown,\n- **Then** the device list filters client-side in < 50ms with a 250ms debounce on keystrokes.\n- **And** selecting an unassigned device opens the assignment modal allowing selection of parent Site and Zone.\n- **And** the mandatory 5-State Component Matrix is active:\n  - **Loading:** 6-row skeleton table shimmer matching exact cell heights.\n  - **Empty:** Zero search matches display \"No devices found matching your criteria\" with a \"Clear Filters\" action.\n  - **Error:** Telemetry fetch error renders an alert banner with \"Retry\" action while maintaining cached offline rows.\n  - **Overflow:** Long MAC/serial strings truncate with one-click copy icon; table enables horizontal scroll on narrow viewports.\n- **And** automated tests verify filter logic, assignment payload submission, and debounced search.\n\n---\n\n## Epic 4: Site Hierarchy & Geographic Visualization\n\nProvide facility directors with spatial awareness and structured topological oversight of distributed physical properties.\n\n### Story 4.1: Site Navigation & Point On Map Visual Shell (Pass 1)\n\nAs a frontend developer,  \nI want to construct the static visual shell for the Site Navigation view and Map component,  \nSo that the layout mirrors Figma components `Devices - Sites` (`#362:14621`) and `Point On Map` (`#290:5447`).\n\n**Acceptance Criteria:**\n\n- **Given** Figma components `#362:14621` and `#290:5447`,\n- **When** `src/features/sites/components/SiteNavigationView.tsx` is rendered,\n- **Then** the split-pane layout displays the map container on the left and facility cards with address, health badges, and zone metrics on the right.\n- **And** all static pin markers and card typography match Figma design specifications.\n\n### Story 4.2: Site Hierarchy Functional Wiring & Geographic Filtering (Pass 2)\n\nAs a facilities director,  \nI want to interact with site map pins and drill down through hierarchical facility zones,  \nSo that I can locate hardware physically and inspect site-level health.\n\n**Acceptance Criteria:**\n\n- **Given** the static site navigation view from Story 4.1,\n- **When** an operator clicks a map pin or selects a facility card,\n- **Then** the map centers on the selected facility coordinates, and the zone breadcrumbs display child buildings, floors, and rooms.\n- **And** site health scores dynamically reflect active child alarms (Critical red, Warning yellow, Healthy green).\n- *
