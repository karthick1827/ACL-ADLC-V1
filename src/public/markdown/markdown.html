 all dimensions:</action>\r\n\r\n- Dependencies on Epic {{epic_number}} work\r\n- Technical setup and infrastructure\r\n- Knowledge gaps and research needs\r\n- Documentation or specification work\r\n- Testing infrastructure\r\n- Refactoring or debt reduction\r\n- External dependencies (APIs, integrations, etc.)\r\n\r\n<action>For each preparation area, facilitate team discussion that:</action>\r\n\r\n- Identifies specific needs with concrete examples\r\n- Estimates effort realistically based on Epic {{epic_number}} experience\r\n- Assigns ownership to specific agents\r\n- Determines criticality and timing\r\n- Surfaces risks of NOT doing the preparation\r\n- Explores parallel work opportunities\r\n- Brings {user_name} in for key decisions\r\n\r\n<output>\r\nAmelia (Developer): \"I'm hearing a clear picture of what we need before Epic {{next_epic_num}}. Let me summarize...\"\r\n\r\n**CRITICAL PREPARATION (Must complete before epic starts):**\r\n{{list_critical_prep_items_with_owners_and_estimates}}\r\n\r\n**PARALLEL PREPARATION (Can happen during early stories):**\r\n{{list_parallel_prep_items_with_owners_and_estimates}}\r\n\r\n**NICE-TO-HAVE PREPARATION (Would help but not blocking):**\r\n{{list_nice_to_have_prep_items}}\r\n\r\nAmelia (Developer): \"Total critical prep effort: {{critical_hours}} hours ({{critical_days}} days)\"\r\n\r\nAlice (Product Owner): \"That's manageable. We can communicate that to stakeholders.\"\r\n\r\nAmelia (Developer): \"{user_name}, does this preparation plan work for you?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} final validation of preparation plan</action>\r\n\r\n</step>\r\n\r\n<step n=\"9\" goal=\"Synthesize Action Items with Significant Change Detection\">\r\n\r\n<output>\r\nAmelia (Developer): \"Let's capture concrete action items from everything we've discussed.\"\r\n\r\nAmelia (Developer): \"I want specific, achievable actions with clear owners. Not vague aspirations.\"\r\n</output>\r\n\r\n<action>Synthesize themes from \"\r\n\r\nCharlie (Senior Dev): \"I marked it medium because {{reasoning}}, but I hear your point.\"\r\n\r\nAmelia (Developer): \"{user_name}, this is a priority call. Testing impact vs. {{reasoning}} - how do you want to prioritize it?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to help resolve priority discussions</action>\r\n\r\n<output>\r\n**Documentation:**\r\n1. {{doc_need_1}}\r\n   Owner: {{agent_5}}\r\n   Deadline: {{timeline_3}}\r\n\r\n2. {{doc_need_2}}\r\n   Owner: {{agent_6}}\r\n   Deadline: {{timeline_4}}\r\n\r\n**Team Agreements:**\r\n\r\n- {{agreement_1}}\r\n- {{agreement_2}}\r\n- {{agreement_3}}\r\n\r\nAmelia (Developer): \"These agreements are how we're committing to work differently going forward.\"\r\n\r\nElena (Junior Dev): \"I like agreement 2 - that would've saved me on Story {{difficult_story_num}}.\"\r\n\r\n═══════════════════════════════════════════════════════════\r\n🚀 EPIC {{next_epic_num}} PREPARATION TASKS:\r\n═══════════════════════════════════════════════════════════\r\n\r\n**Technical Setup:**\r\n[ ] {{setup_task_1}}\r\nOwner: {{owner_1}}\r\nEstimated: {{est_1}}\r\n\r\n[ ] {{setup_task_2}}\r\nOwner: {{owner_2}}\r\nEstimated: {{est_2}}\r\n\r\n**Knowledge Development:**\r\n[ ] {{research_task_1}}\r\nOwner: {{owner_3}}\r\nEstimated: {{est_3}}\r\n\r\n**Cleanup/Refactoring:**\r\n[ ] {{refactor_task_1}}\r\nOwner: {{owner_4}}\r\nEstimated: {{est_4}}\r\n\r\n**Total Estimated Effort:** {{total_hours}} hours ({{total_days}} days)\r\n\r\n═══════════════════════════════════════════════════════════\r\n⚠️ CRITICAL PATH:\r\n═══════════════════════════════════════════════════════════\r\n\r\n**Blockers to Resolve Before Epic {{next_epic_num}}:**\r\n\r\n1. {{critical_item_1}}\r\n   Owner: {{critical_owner_1}}\r\n   Must complete by: {{critical_deadline_1}}\r\n\r\n2. {{critical_item_2}}\r\n   Owner: {{critical_owner_2}}\r\n   Must complete by: {{critical_deadline_2}}\r\n   </output>\r\n\r\n<action>CRITICAL ANALYSIS - Detect if discoveries require nAmelia (Developer): \"Let me show you the complete action plan...\"\r\n\r\nAmelia (Developer): \"That's {{total_action_count}} action items, {{prep_task_count}} preparation tasks, and {{critical_count}} critical path items.\"\r\n\r\nAmelia (Developer): \"Everyone clear on what they own?\"\r\n</output>\r\n\r\n<action>Give each agent with assignments a moment to acknowledge their ownership</action>\r\n\r\n<action>Ensure {user_name} approves the complete action plan</action>\r\n\r\n</step>\r\n\r\n<step n=\"10\" goal=\"Critical Readiness Exploration - Interactive Deep Dive\">\r\n\r\n<output>\r\nAmelia (Developer): \"Before we close, I want to do a final readiness check.\"\r\n\r\nAmelia (Developer): \"Epic {{epic_number}} is marked complete in sprint-status, but is it REALLY done?\"\r\n\r\nAlice (Product Owner): \"What do you mean, Amelia?\"\r\n\r\nAmelia (Developer): \"I mean truly production-ready, stakeholders happy, no loose ends that'll bite us later.\"\r\n\r\nAmelia (Developer): \"{user_name}, let's walk through this together.\"\r\n</output>\r\n\r\n<action>Explore testing and quality state through natural conversation</action>\r\n\r\n<output>\r\nAmelia (Developer): \"{user_name}, tell me about the testing for Epic {{epic_number}}. What verification has been done?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to describe testing status</action>\r\n\r\n<output>\r\nDana (QA Engineer): [Responds to what {user_name} shared] \"I can add to that - {{additional_testing_context}}.\"\r\n\r\nDana (QA Engineer): \"But honestly, {{testing_concern_if_any}}.\"\r\n\r\nAmelia (Developer): \"{user_name}, are you confident Epic {{epic_number}} is production-ready from a quality perspective?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to assess quality readiness</action>\r\n\r\n<check if=\"{user_name} expresses concerns\">\r\n  <output>\r\nAmelia (Developer): \"Okay, let's capture that. What specific testing is still needed?\"\r\n\r\nDana (QA Engineer): \"I can handle {{testing_work_needed}}, estimated {{testing_hours}} hours.\"\r\n\r\nAmelia (Developer): \"Adding to critical path: Complete {{testing_work_needed}} before Epic {{next_epic_num}}.\"\r\n</output>\r\n<action>Add testing completion to critical path</action>\r\n</check>\r\n\r\n<action>Explore deployment and release status</action>\r\n\r\n<output>\r\nAmelia (Developer): \"{user_name}, what's the deployment status for Epic {{epic_number}}? Is it live in production, scheduled for deployment, or still pending?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to provide deployment status</action>\r\n\r\n<check if=\"not yet deployed\">\r\n  <output>\r\nCharlie (Senior Dev): \"If it's not deployed yet, we need to factor that into Epic {{next_epic_num}} timing.\"\r\n\r\nAmelia (Developer): \"{user_name}, when is deployment planned? Does that timing work for starting Epic {{next_epic_num}}?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to clarify deployment timeline</action>\r\n\r\n<action>Add deployment milestone to critical path with agreed timeline</action>\r\n</check>\r\n\r\n<action>Explore stakeholder acceptance</action>\r\n\r\n<output>\r\nAmelia (Developer): \"{user_name}, have stakeholders seen and accepted the Epic {{epic_number}} deliverables?\"\r\n\r\nAlice (Product Owner): \"This is important - I've seen 'done' epics get rejected by stakeholders and force rework.\"\r\n\r\nAmelia (Developer): \"{user_name}, any feedback from stakeholders still pending?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to describe stakeholder acceptance status</action>\r\n\r\n<check if=\"acceptance incomplete or feedback pending\">\r\n  <output>\r\nAlice (Product Owner): \"We should get formal acceptance before moving on. Otherwise Epic {{next_epic_num}} might get interrupted by rework.\"\r\n\r\nAmelia (Developer): \"{user_name}, how do you want to handle stakeholder acceptance? Should we make it a critical path item?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} decision</action>\r\n\r\n<action>Add stakeholder acceptance to critical path if user agrees</action>\r\n</check>\r\n\r\n<action>Explore technical health and stability</action>\r\n\r\n<output>\r\nAmelia (Developer): \"{user_name}, this is a gut-check question: How does the codebase feel after Epic {{epic_number}}?\"\r\n\r\nAmelia (Developer): \"Stable and maintainable? Or are there concerns lurking?\"\r\n\r\nCharlie (Senior Dev): \"Be honest, {user_name}. We've all shipped epics that felt... fragile.\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to assess codebase health</action>\r\n\r\n<check if=\"{user_name} expresses stability concerns\">\r\n  <output>\r\nCharlie (Senior Dev): \"Okay, let's dig into that. What's causing those concerns?\"\r\n\r\nCharlie (Senior Dev): [Helps {user_name} articulate technical concerns]\r\n\r\nAmelia (Developer): \"What would it take to address these concerns and feel confident about stability?\"\r\n\r\nCharlie (Senior Dev): \"I'd say we need {{stability_work_needed}}, roughly {{stability_hours}} hours.\"\r\n\r\nAmelia (Developer): \"{user_name}, is addressing this stability work worth doing before Epic {{next_epic_num}}?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} decision</action>\r\n\r\n<action>Add stability work to preparation sprint if user agrees</action>\r\n</check>\r\n\r\n<action>Explore unresolved blockers</action>\r\n\r\n<output>\r\nAmelia (Developer): \"{user_name}, are there any unresolved blockers or technical issues from Epic {{epic_number}} that we're carrying forward?\"\r\n\r\nDana (QA Engineer): \"Things that might create problems for Epic {{next_epic_num}} if we don't deal with them?\"\r\n\r\nAmelia (Developer): \"Nothing is off limits here. If there's a problem, we need to know.\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to surface any blockers</action>\r\n\r\n<check if=\"blockers identified\">\r\n  <output>\r\nAmelia (Developer): \"Let's capture those blockers and figure out how they affect Epic {{next_epic_num}}.\"\r\n\r\nCharlie (Senior Dev): \"For {{blocker_1}}, if we leave it unresolved, it'll {{impact_description_1}}.\"\r\n\r\nAlice (Product Owner): \"That sounds critical. We need to address that before moving forward.\"\r\n\r\nAmelia (Developer): \"Agreed. Adding to critical path: Resolve {{blocker_1}} before Epic {{next_epic_num}} kickoff.\"\r\n\r\nAmelia (Developer): \"Who owns that work?\"\r\n</output>\r\n\r\n<action>Assign blocker resolution to appropriate agent</action>\r\n<action>Add to critical path with priority and deadline</action>\r\n</check>\r\n\r\n<action>Synthesize the readiness assessment</action>\r\n\r\n<output>\r\nAmelia (Developer): \"Okay {user_name}, let me synthesize what we just uncovered...\"\r\n\r\n**EPIC {{epic_number}} READINESS ASSESSMENT:**\r\n\r\nTesting & Quality: {{quality_status}}\r\n{{#if quality_concerns}}⚠️ Action needed: {{quality_action_needed}}{{/if}}\r\n\r\nDeployment: {{deployment_status}}\r\n{{#if deployment_pending}}⚠️ Scheduled for: {{deployment_date}}{{/if}}\r\n\r\nStakeholder Acceptance: {{acceptance_status}}\r\n{{#if acceptance_incomplete}}⚠️ Action needed: {{acceptance_action_needed}}{{/if}}\r\n\r\nTechnical Health: {{stability_status}}\r\n{{#if stability_concerns}}⚠️ Action needed: {{stability_action_needed}}{{/if}}\r\n\r\nUnresolved Blockers: {{blocker_status}}\r\n{{#if blockers_exist}}⚠️ Must resolve: {{blocker_list}}{{/if}}\r\n\r\nAmelia (Developer): \"{user_name}, does this assessment match your understanding?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to confirm or correct the assessment</action>\r\n\r\n<output>\r\nAmelia (Developer): \"Based on this assessment, Epic {{epic_number}} is {{#if all_clear}}fully complete and we're clear to proceed{{else}}complete from a story perspective, but we have {{critical_work_count}} critical items before Epic {{next_epic_num}}{{/if}}.\"\r\n\r\nAlice (Product Owner): \"This level of thoroughness is why retrospectives are valuable.\"\r\n\r\nCharlie (Senior Dev): \"Better to catch this now than three stories into the next epic.\"\r\n</output>\r\n\r\n</step>\r\n\r\n<step n=\"11\" goal=\"Retrospective Closure with Celebration and Commitment\">\r\n\r\n<output>\r\nAmelia (Developer): \"We've covered a lot of ground today. Let me bring this retrospective to a close.\"\r\n\r\n═══════════════════════════════════════════════════════════\r\n✅ RETROSPECTIVE COMPLETE\r\n═══════════════════════════════════════════════════════════\r\n\r\nAmelia (Developer): \"Epic {{epic_number}}: {{epic_title}} - REVIEWED\"\r\n\r\n**Key Takeaways:**\r\n\r\n1. {{key_lesson_1}}\r\n2. {{key_lesson_2}}\r\n3. {{key_lesson_3}}\r\n   {{#if key_lesson_4}}4. {{key_lesson_4}}{{/if}}\r\n\r\nAlice (Product Owner): \"That first takeaway is huge - {{impact_of_lesson_1}}.\"\r\n\r\nCharlie (Senior Dev): \"And lesson 2 is something we can apply immediately.\"\r\n\r\nAmelia (Developer): \"Commitments made today:\"\r\n\r\n- Action Items: {{action_count}}\r\n- Preparation Tasks: {{prep_task_count}}\r\n- Critical Path Items: {{critical_count}}\r\n\r\nDana (QA Engineer): \"That's a lot of commitments. We need to actually follow through this time.\"\r\n\r\nAmelia (Developer): \"Agreed. Which is why we'll review these action items in our next standup.\"\r\n\r\n═══════════════════════════════════════════════════════════\r\n🎯 NEXT STEPS:\r\n═══════════════════════════════════════════════════════════\r\n\r\n1. Execute Preparation Sprint (Est: {{prep_days}} days)\r\n2. Complete Critical Path items before Epic {{next_epic_num}}\r\n3. Review action items in next standup\r\n   {{#if epic_update_needed}}4. Hold Epic {{next_epic_num}} planning review session{{else}}4. Begin Epic {{next_epic_num}} planning when preparation complete{{/if}}\r\n\r\nElena (Junior Dev): \"{{prep_days}} days of prep work is significant, but necessary.\"\r\n\r\nAlice (Product Owner): \"I'll communicate the timeline to stakeholders. They'll understand if we frame it as 'ensuring Epic {{next_epic_num}} success.'\"\r\n\r\n═══════════════════════════════════════════════════════════\r\n\r\nAmelia (Developer): \"Before we wrap, I want to take a moment to acknowledge the team.\"\r\n\r\nAmelia (Developer): \"Epic {{epic_number}} delivered {{completed_stories}} stories with {{velocity_description}} velocity. We overcame {{blocker_count}} blockers. We learned a lot. That's real work by real people.\"\r\n\r\nCharlie (Senior Dev): \"Hear, hear.\"\r\n\r\nAlice (Product Owner): \"I'm proud of what we shipped.\"\r\n\r\nDana (QA Engineer): \"And I'm excited about Epic {{next_epic_num}} - especially now that we're prepared for it.\"\r\n\r\nAmelia (Developer): \"{user_name}, any final thoughts before we close?\"\r\n</output>\r\n\r\n<action>WAIT for {user_name} to share final reflections</action>\r\n\r\n<output>\r\nAmelia (Developer): [Acknowledges what {user_name} shared] \"Thank you for that, {user_name}.\"\r\n\r\nAmelia (Developer): \"Alright team - great work today. We learned a lot from Epic {{epic_number}}. Let's use these insights to make Epic {{next_epic_num}} even better.\"\r\n\r\nAmelia (Developer): \"See you all when prep work is done. Meeting adjourned!\"\r\n\r\n═══════════════════════════════════════════════════════════\r\n</output>\r\n\r\n<action>Prepare to save retrospective summary document</action>\r\n\r\n</step>\r\n\r\n<step n=\"12\" goal=\"Save Retrospective and Update Sprint Status\">\r\n\r\n<action>Ensure retrospectives folder exists: {implementation_artifacts}</action>\r\n<action>Create folder if it doesn't exist</action>\r\n\r\n<action>Generate comprehensive retrospective summary document including:</action>\r\n\r\n- Epic summary and metrics\r\n- Team participants\r\n- Successes and strengths identified\r\n- Challenges and growth areas\r\n- Key insights and learnings\r\n- Previous retro follow-through analysis (if applicable)\r\n- Next epic preview and dependencies\r\n- Action items with owners and timelines\r\n- Preparation tasks for next epic\r\n- Critical path items\r\n- Significant discoveries and epic update recommendations (if any)\r\n- Readiness assessment\r\n- Commitments and next steps\r\n\r\n<action>Format retrospective document as readable markdown with clear sections</action>\r\n<action>Set filename: {implementation_artifacts}/epic-{{epic_number}}-retro-{date}.md</action>\r\n<action>Save retrospective document</action>\r\n\r\n<output>\r\n✅ Retrospective document saved: {implementation_artifacts}/epic-{{epic_number}}-retro-{date}.md\r\n</output>\r\n\r\n<action>Update {sprint_status_file} to mark retrospective as completed</action>\r\n\r\n<action>Load the FULL file: {sprint_status_file}</action>\r\n<action>Find development_status key \"epic-{{epic_number}}-retrospective\"</action>\r\n<action>Verify current status (typically \"optional\" or \"pending\")</action>\r\n<action>Update development_status[\"epic-{{epic_number}}-retrospective\"] = \"done\"</action>\r\n<action>Append each Epic {{epic_number}} action item to the action_items section, creating the section after development_status if missing. One entry per item:</action>\r\n\r\n```yaml\r\naction_items:\r\n  - epic: {{epic_number}}\r\n    action: \"{{action_description}}\"\r\n    owner: \"{{owner}}\"\r\n    status: open\r\n```\r\n\r\n<action>Quote action and owner values so punctuation (e.g., \"#\") cannot break YAML parsing</action>\r\n\r\n<action>Update Epic {{prev_epic_num}} action_items entries based on Step 4 follow-through: ✅ Completed → done, ⏳ In Progress → in-progress, ❌ Not Addressed → keep existing status (do not modify)</action>\r\n<action>Update last_updated field to current date</action>\r\n<action>Save file, preserving ALL comments and structure including STATUS DEFINITIONS</action>\r\n\r\n<check if=\"update successful\">\r\n  <output>\r\n✅ Retrospective marked as completed in {sprint_status_file}\r\n\r\nRetrospective key: epic-{{epic_number}}-retrospective\r\nStatus: {{previous_status}} → done\r\nAction items recorded: {{action_count}}\r\n</output>\r\n</check>\r\n\r\n<check if=\"retrospective key not found\">\r\n  <output>\r\n⚠️ Could not update retrospective status: epic-{{epic_number}}-retrospective not found in {sprint_status_file}\r\n\r\nRetrospective document was saved successfully, but {sprint_status_file} may need manual update.\r\n</output>\r\n</check>\r\n\r\n</step>\r\n\r\n<step n=\"13\" goal=\"Final Summary and Handoff\">\r\n\r\n<output>\r\n**✅ Retrospective Complete, {user_name}!**\r\n\r\n**Epic Review:**\r\n\r\n- Epic {{epic_number}}: {{epic_title}} reviewed\r\n- Retrospective Status: completed\r\n- Retrospective saved: {implementation_artifacts}/epic-{{epic_number}}-retro-{date}.md\r\n\r\n**Commitments Made:**\r\n\r\n- Action Items: {{action_count}}\r\n- Preparation Tasks: {{prep_task_count}}\r\n- Critical Path Items: {{critical_count}}\r\n\r\n**Next Steps:**\r\n\r\n1. **Review retrospective summary**: {implementation_artifacts}/epic-{{epic_number}}-retro-{date}.md\r\n\r\n2. **Execute preparation sprint** (Est: {{prep_days}} days)\r\n   - Complete {{critical_count}} critical path items\r\n   - Execute {{prep_task_count}} preparation tasks\r\n   - Verify all action items are in progress\r\n\r\n3. **Review action items in next standup**\r\n   - Ensure ownership is clear\r\n   - Track progress on commitments\r\n   - Adjust timelines if needed\r\n\r\n{{#if epic_update_needed}} 4. **IMPORTANT: Schedule Epic {{next_epic_num}} planning review session**\r\n\r\n- Significant discoveries from Epic {{epic_number}} require epic updates\r\n- Review and update affected stories\r\n- Align team on revised approach\r\n- Do NOT start Epic {{next_epic_num}} until review is complete\r\n  {{else}}\r\n\r\n4. **Begin Epic {{next_epic_num}} when ready**\r\n   - Start the next epic's stories with Developer agent's `quick-dev`\r\n   - Epic will be marked as `in-progress` automatically when first story is created\r\n   - Ensure all critical path items are done first\r\n     {{/if}}\r\n\r\n**Team Performance:**\r\nEpic {{epic_number}} delivered {{completed_stories}} stories with {{velocity_summary}}. The retrospective surfaced {{insight_count}} key insights and {{significant_discovery_count}} significant discoveries. The team is well-positioned for Epic {{next_epic_num}} success.\r\n\r\n{{#if significant_discovery_count > 0}}\r\n⚠️ **REMINDER**: Epic update required before starting Epic {{next_epic_num}}\r\n{{/if}}\r\n\r\n---\r\n\r\nAmelia (Developer): \"Great session today, {user_name}. The team did excellent work.\"\r\n\r\nAlice (Product Owner): \"See you at epic planning!\"\r\n\r\nCharlie (Senior Dev): \"Time to knock out that prep work.\"\r\n\r\n</output>\r\n<action>Run: `python3 {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow.on_complete` — if the resolved value is non-empty, follow it as the final terminal instruction before exiting.</action>\r\n</step>\r\n\r\n</workflow>\r\n\r\n<facilitation-guidelines>\r\n<guideline>PARTY MODE REQUIRED: All agent dialogue uses \"Name (Role): dialogue\" format</guideline>\r\n<guideline>Amelia (Developer) maintains psychological safety throughout - no blame or judgment</guideline>\r\n<guideline>Focus on systems and processes, not individual performance</guideline>\r\n<guideline>Create authentic team dynamics: disagreements, diverse perspectives, emotions</guideline>\r\n<guideline>User ({user_name}) is active participant, not passive observer</guideline>\r\n<guideline>Encourage specific examples over general statements</guideline>\r\n<guideline>Balance celebration of wins with honest assessment of challenges</guideline>\r\n<guideline>Ensure every voice is heard - all agents contribute</guideline>\r\n<guideline>Action items must be specific, achievable, and owned</guideline>\r\n<guideline>Forward-looking mindset - how do we improve for next epic?</guideline>\r\n<guideline>Intent-based facilitation, not scripted phrases</guideline>\r\n<guideline>Deep story analysis provides rich material for discussion</guideline>\r\n<guideline>Previous retro integration creates accountability and continuity</guideline>\r\n<guideline>Significant change detection prevents epic misalignment</guideline>\r\n<guideline>Critical verification prevents starting next epic prematurely</guideline>\r\n<guideline>Document everything - retrospective insights are valuable for future reference</guideline>\r\n<guideline>Two-part structure ensures both reflection AND preparation</guideline>\r\n</facilitation-guidelines>\r\n"},"commands":{"claude":"/acl-retrospective","cursor":"@acl-retrospective","windsurf":"/acl-retrospective","copilot":"@github /acl-retrospective","antigravity":"/acl-retrospective","universal":"Act as the ACL-ADLC acl-retrospective (acl-retrospective). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-retrospective","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-retrospective","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-retrospective","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-retrospective","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-retrospective","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-retrospective': Post-epic review to extract lessons and assess success. Use when the user says.","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-review","name":"acl-review","displayName":"acl-review","description":"Multi-lens review over any diff, doc, spec, or artifact — whichever installed lenses fit the content, run singly or together. Shipped lenses include adversarial, edge-case, verification-gap, structure, and prose. Use when the user says","module":"core","moduleLabel":"Core · Review","moduleShort":"Core","folderPath":"src/core-skills/acl-review","skillFile":{"filename":"SKILL.md","fullPath":"src/core-skills/acl-review/SKILL.md","content":"---\r\nname: acl-review\r\ndescription: 'Multi-lens review over any diff, doc, spec, or artifact — whichever installed lenses fit the content, run singly or together. Shipped lenses include adversarial, edge-case, verification-gap, structure, and prose. Use when the user says \"review this\", \"critical review\", \"editorial review\", \"hunt edge cases\", \"review the structure\", or \"review the prose\".'\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# ACL Review\r\n\r\nReview content through lenses — each a distinct method and stance — and report findings in one canonical shape. Report what is real — never pad to look thorough. Each lens sets its own stance toward the content and toward zero findings: for most an empty result is valid; the adversarial lens treats it as suspicious; the editorial lenses hold content sacrosanct and critique only how it is organized and expressed.\r\n\r\nThe lens set is whatever `{workflow.lenses}` resolves to, not a fixed list — overrides add lenses and replace shipped ones. Never claim a capability from this file; read the resolved lenses and work from those.\r\n\r\n## Inputs\r\n\r\n- **content** — what to review: a diff, branch, uncommitted changes, file, spec, story, or any document. Args: `[path]`.\r\n- **lenses** (optional) — one or more lens codes or names, however the caller expresses them: a spoken request, or a directive of the form `skill:acl-review lenses=<code>[,<code>...]` (the form acl's `doc_standards` uses). Default: every applicable lens (a full review).\r\n- **also_consider** (optional) — areas to keep in mind alongside each lens's normal analysis.\r\n- **pre-resolved customization** (optional) — `[workflow]` field values supplied by a forwarding caller. See Execution step 1.\r\n\r\n## Conventions\r\n\r\n- Bare paths (e.g. `references/lens-edge-case-hunter.md`) resolve from `{skill-root}` — this skill's installed directory, where `customize.toml` lives. `{project-root}` resolves to the project working directory.\r\n- `{workflow.<name>}` resolves to fields in `customize.toml`'s `[workflow]` table (overrides win per ACL merge rules).\r\n- In `style_guide`, `review_guidance`, and `persistent_facts`, a value prefixed `file:` is a path or glob — load that file's contents. If a `file:` value cannot be read, name the failed file in the output header and continue: the shipped baseline for `style_guide`, the remaining entries otherwise.\r\n\r\n## Execution\r\n\r\n1. **Resolve customization:** `uv run {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`. On failure, read `{skill-root}/customize.toml` directly and use defaults. **Forwarded activation:** if a caller invoked you with pre-resolved customization fields (e.g. the `acl-editorial-review` shim), honor them verbatim for those named fields — they already carry the user's overrides — and resolve only the remaining fields from your own `customize.toml`. Then execute each `{workflow.activation_steps_prepend}` entry in order, hold `{workflow.persistent_facts}` as standing context for the session, and treat `{workflow.review_guidance}` entries as standing review directives for every lens.\r\n2. **Load the content.** If it is empty or cannot be decoded as text: when the caller expects the raw findings JSON array (e.g. the legacy edge-case forwarder), return `[{\"location\":\"N/A\",\"trigger_condition\":\"Input empty or undecodable\",\"guard_snippet\":\"Provide valid content to review\",\"potential_consequence\":\"Review skipped — no analysis performed\"}]` (no `lens` field) and stop; otherwise say what's wrong and ask for reviewable content. Classify the content — diff, source file, function, or document — and whether it is **code** or **docs**; scope rules and lens applicability both depend on it. A document that defines behavior (spec, requirements, plan, story) is `docs` that a behavioral lens may still apply to; judge by `when`.\r\n3. **Select lenses** from `{workflow.lenses}`. A lens with an empty `instruction` is disabled. If the user or caller named lenses, run exactly those only — `applies_to` and `when` do not filter an explicit request. Otherwise run every enabled lens whose `applies_to` covers the content class (`any` always covers) and whose `when` applies.\r\n4. **Announce the plan** in one line before running anything: the content class, the lenses about to run, and — when any lens has `after` set — that it runs on top of the named lens's findings. Skip the announcement entirely when the caller pinned an exact output contract (the legacy forwarders that demand raw JSON or one exact line) — their contract covers everything you emit, not just the findings block. Then execute each `{workflow.activation_steps_append}` entry in order.\r\n5. **Run the independent lenses** — every selected lens without `after`. Each sees the content and `also_consider`, never another lens's findings. Follow each lens's `instruction`; the shipped lenses load their reference file just-in-time, so load only what runs. When subagents are available, spawn one per lens in parallel: give it the lens `instruction` with `{skill-root}` and paths resolved absolute, the content or where to read it, any `also_consider` areas, the standing review directives, and the constraint \"Return ONLY your findings — no other output.\" Otherwise run the lenses sequentially yourself, completing one before starting the next.\r\n6. **Run the dependent lenses** — every selected lens with `after`, once the lens it names has completed, passing that lens's findings in. A lens whose `after` target was not selected or produced nothing still runs, with no prior findings. Dependent lenses that name different targets are independent of each other and may run in parallel.\r\n7. **Assemble and present** per Output below. Keep every lens's findings — overlap between lenses is signal, not duplication; note it in the markdown report rather than deduping. Execute `{workflow.on_complete}` if set.\r\n\r\n## Output\r\n\r\nOne JSON array holding every finding from every lens. Each finding carries:\r\n\r\n- `lens` — the code of the lens that produced it\r\n- `location` — where in the content (file:line-range for code, section for documents)\r\n- `trigger_condition` — the problem, or the condition that exposes it, in one line\r\n- `guard_snippet` — the concrete fix, guard, or missing check\r\n- `potential_consequence` — what goes wrong if it ships as-is\r\n\r\nEach lens file refines these semantics for its findings and may add lens-specific fields (e.g. `kind`/`confidence` on deletion findings, `gap_shape`/`consumer`/`evidence` on verification-gap findings). A lens file may instead declare its own findings shape and rendering — the editorial lenses render a findings table — and that shape wins for that lens's findings. `[]` is valid when nothing is found. No severity, priority, or ranking anywhere.\r\n\r\nPresent per `{workflow.output_format}` — `\"json\"` (the raw array in a fenced json block), `\"markdown\"`, or `\"both\"` — unless the caller requested a specific shape; a legacy forwarder's output contract always wins, and governs everything you emit rather than the findings block alone. The markdown report groups findings by lens, each rendered in its declared shape: a short block per finding rendering the fields plus any extras worth surfacing, one line for a lens that found nothing, and a plain clean statement when the whole review is clean. Shape the report per `{workflow.output_preferences}`.\r\n\r\nWhen `{workflow.report_path}` is set, write the report there; otherwise present it in chat.\r\n"},"commands":{"claude":"/acl-review","cursor":"@acl-review","windsurf":"/acl-review","copilot":"@github /acl-review","antigravity":"/acl-review","universal":"Act as the ACL-ADLC acl-review (acl-review). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-review","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-review","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-review","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-review","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-review","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-review': Multi-lens review over any diff, doc, spec, or artifact — whichever installed lenses fit the content, run singly or together. Shipped lenses include adversarial, edge-case, verification-gap, structure, and prose. Use when the user says.","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-review-adversarial-general","name":"acl-review-adversarial-general","displayName":"acl-review-adversarial-general","description":"Deprecated — forwards to acl-review.","module":"v6-shims","moduleLabel":"V6 Shims · Review","moduleShort":"V6 Shims","folderPath":"src/core-skills/v6-shims/acl-review-adversarial-general","skillFile":{"filename":"SKILL.md","fullPath":"src/core-skills/v6-shims/acl-review-adversarial-general/SKILL.md","content":"---\r\nname: acl-review-adversarial-general\r\ndescription: 'Deprecated — forwards to acl-review.'\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Accepted` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Accepted' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Accepted`.\n\n\r\n\r\nMerged into `acl-review`. Invoke the `acl-review` skill on the same content with only the `adversarial` lens, passing through any `also_consider` areas. Present the findings as a Markdown list — descriptions only, no severity, priority, or ranking; no JSON block.\r\n"},"commands":{"claude":"/acl-review-adversarial-general","cursor":"@acl-review-adversarial-general","windsurf":"/acl-review-adversarial-general","copilot":"@github /acl-review-adversarial-general","antigravity":"/acl-review-adversarial-general","universal":"Act as the ACL-ADLC acl-review-adversarial-general (acl-review-adversarial-general). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-review-adversarial-general","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-review-adversarial-general","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-review-adversarial-general","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-review-adversarial-general","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-review-adversarial-general","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-review-adversarial-general': Deprecated — forwards to acl-review..","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-review-edge-case-hunter","name":"acl-review-edge-case-hunter","displayName":"acl-review-edge-case-hunter","description":"Deprecated — Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Accepted' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Accepted`.\n\n\r\n\r\nMerged into `acl-review`. Invoke the `acl-review` skill on the same content with only the `verification-gap` lens. Present the markdown rendering only (no JSON block), listing any `gap_shape: \"other\"` findings under an `## Other findings` heading. When there are no findings at all, output exactly this single line: `No verification gaps found.`\r\n"},"commands":{"claude":"/acl-review-verification-gap","cursor":"@acl-review-verification-gap","windsurf":"/acl-review-verification-gap","copilot":"@github /acl-review-verification-gap","antigravity":"/acl-review-verification-gap","universal":"Act as the ACL-ADLC acl-review-verification-gap (acl-review-verification-gap). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-review-verification-gap","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-review-verification-gap","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-review-verification-gap","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-review-verification-gap","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-review-verification-gap","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-review-verification-gap': Deprecated — forwards to acl-review..","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-spec","name":"acl-spec","displayName":"acl-spec","description":"Distill any intent input into the SPEC kernel + companions — the canonical, preservation-validated machine contract for downstream work. Use when the user says","module":"2-plan-workflows","moduleLabel":"Phase 2 · Planning","moduleShort":"Planning","folderPath":"src/acl-skills/2-plan-workflows/acl-spec","skillFile":{"filename":"SKILL.md","fullPath":"src/acl-skills/2-plan-workflows/acl-spec/SKILL.md","content":"---\r\nname: acl-spec\r\ndescription: Distill any intent input into the SPEC kernel + companions — the canonical, preservation-validated machine contract for downstream work. Use when the user says \"create a spec\", \"distill this into a spec\", \"validate this spec\", \"update the spec\", or \"break this into stories\".\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# ACL Spec\r\n## Overview\r\n\r\nCanonical transformer for the ACL spec-kernel ecosystem. Takes any intent input — vague idea, brain dump, PRD, GDD, RFC, brief, Slack thread, customer email, meeting transcript, mockups, mixed multi-source — and produces **SPEC.md** carrying the five-field kernel (Why, Capabilities, Constraints, Non-goals, Success signal) plus companion files for load-bearing content that does not fit or would bloat the kernel with expansive line-item detail. Together they are the machine contract every downstream ACL skill consumes.\r\n\r\nMultiple skills may call to update the same spec over time.\r\n\r\n## Conventions\r\n\r\n- Bare paths (e.g. `assets/spec-template.md`) resolve from the skill root.\r\n- `{skill-root}` is this skill's install dir; `{project-root}` is the working dir.\r\n- `{workflow.<name>}` resolves to fields in `customize.toml`.\r\n\r\n## On Activation\r\n\r\n1. Resolve customization: `uv run {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`. On failure, read `{skill-root}/customize.toml` directly.\r\n2. Run `{workflow.activation_steps_prepend}`. Treat `{workflow.persistent_facts}` as foundational context (`file:` entries are loaded).\r\n3. Resolve config: `uv run {project-root}/_acl/scripts/resolve_config.py --project-root {project-root}` (merges `_acl/config.toml`, `_acl/config.user.toml`, and the `_acl/custom/` overrides). From the merged JSON resolve `{user_name}`, `{communication_language}`, `{document_output_language}`, `{project_name}`, `{output_folder}` (under `core`), and `{date}`.\r\n4. Detect mode. **Headless** when any of: no TTY, programmatic caller (another skill or non-interactive runner), or the first message pre-supplies all inputs and asks for an artifact path back. **Interactive** otherwise. In interactive mode, greet by `{user_name}` in `{communication_language}`, stay in that language, and mention that `acl-party-mode` and `acl-advanced-elicitation` are available for deeper exploration on any field.\r\n\r\nRun `{workflow.activation_steps_append}`.\r\n\r\nActivation is complete. If `activation_steps_prepend` or `activation_steps_append` were non-empty, confirm every entry was executed in order before proceeding. Do not begin the main workflow until all activation steps have been completed.\r\n\r\n## Workspace\r\n\r\nThe spec is **always a folder** named `{workflow.spec_output_path}/{workflow.run_folder_pattern}`, resolving by default to `{output_folder}/specs/spec-{slug}/`.\r\n\r\n`{slug}` describes the thing being specced, not the input shape:\r\n\r\n- Source artifact already carries a slug (e.g., `prd-foo-bar-2026-05-23/`): inherit (`foo-bar`).\r\n- Sparse, in-chat, or multi-source input: interactive asks; headless caller provides it as part of the input. If absent and underivable, headless blocks with `error_code: \"missing_slug\"`.\r\n- Same slug = same folder. A second invocation with the same `{slug}` lands at the existing spec folder and updates in place, preserving capability IDs.\r\n\r\n**No input.** Interactive: ask the user to share a file path, paste content, explain the idea in detail, or point to a source. Headless: respond with JSON containing `error_code: \"insufficient_intent\"`.\r\n\r\nInside the spec folder:\r\n\r\n```\r\n<spec-folder>/\r\n  SPEC.md                  ← uppercase, the kernel — DERIVED from .memlog.md, never hand-edited\r\n  <companion-1>.md         ← optional, content-typed (e.g. glossary.md); spec-authored ones are derived too\r\n  <companion-2>.md\r\n  stories.yaml             ← optional, written only by Story Breakdown — fixed name, never in companions:\r\n  .memlog.md               ← canonical, append-only memory; what SPEC.md is distilled from\r\n```\r\n\r\n## Memory and derivation\r\n\r\n`.memlog.md` is canonical — an append-only, chronological record of every decision, constraint, capability (with its stable `CAP-N`), assumption, open question, and bit of user direction, one line each in the order it happened, never edited or reordered. `SPEC.md` and every spec-authored companion are **derived on each run** from the memlog (the decision-of-record) plus the sources it cites for raw content — never hand-patched.\r\n\r\nDeriving the contract from a living log instead of editing the contract in place is what lets the steps around the spec (PRD, UX, architecture, epics) run in any order and feed the same spec without merge drift: the log only accumulates, the artifact is re-rendered. So the spec is updated *only* by re-deriving it here — acl-spec is its single writer; a hand-edit to `SPEC.md` from outside is unsupported and is overwritten on the next derive.\r\n\r\nWrites go through the shared script — `{project-root}/_acl/scripts/memlog.py`, the same location as `resolve_customization.py` (atomic; never read it back except to resume):\r\n\r\n- `uv run {project-root}/_acl/scripts/memlog.py init --workspace {spec-folder} --field topic=\"<what is being specced>\"` — once, at create.\r\n- `uv run {project-root}/_acl/scripts/memlog.py append --workspace {spec-folder} --type <decision|constraint|capability|assumption|question|direction|note|event> --text \"<one-line gist, reason included>\"` — as each lands.\r\n- Terminal moments (a validation verdict, \"spec finalized\") are `--type event` entries; the memlog carries no status field.\r\n\r\n## The Operation\r\n\r\nRead the input and its ancillary linked materials. If there is no input, follow the no-input branch in **Workspace** (ask or block). If a prior `.memlog.md` exists at the target folder, read it — the operation becomes an update, and the memlog (not the rendered `SPEC.md`) is the authority on what was decided and on capability IDs. Preserve those IDs; new capabilities get the next unused `CAP-N`; never reuse retired IDs. Otherwise this is a create, and the first move is `memlog.py init`.\r\n\r\nWhen the input is structured and pre-sorted (a PRD with an addendum, a GDD, a brief produced by an upstream ACL skill), trust the authored separation: lift kernel-fitting content into SPEC.md, lift overflow into appropriately-named companions. When the input is mixed (a brain dump, a transcript, an RFC, a customer email), do the sorting yourself: walk each claim, apply the three-lens load-bearing test (Spec Law rule 7), and route to the kernel field or a companion.\r\n\r\nDistill the input into the five-field kernel using `{workflow.spec_template}` as the skeleton. When input is rich, extract directly — no elicitation. When input is sparse, choose: **express** (best-effort distill, every gap becomes an `open_questions[]` entry) or **guided** (walk the five fields with the user one at a time). Headless defaults to express and logs the choice. Interactive asks.\r\n\r\nA recognized domain implication the input leaves unaddressed *is* such a gap — name it as an `open_questions[]` entry (healthcare input silent on PHI/HIPAA, payments silent on PCI, control systems silent on fail-safe) and move on. Flag it; never invent the answer or coach toward it. If these dominate, the input is too thin — suggest `acl-prd`.\r\n\r\nWrite lean from the first pass: every sentence must earn its place. Decoration costs tokens and dilutes downstream readers.\r\n\r\nLog each decision, capability, constraint, and accepted change to `.memlog.md` as it is made — that running record is what the render reads. Because the log is append-only, a later entry supersedes an earlier one on the same point while the history stays intact. When two currently-live sources or companions disagree on the same field, or an either/or never got resolved, surface it to the user rather than silently choosing — the resolution is itself a new memlog entry.\r\n\r\nIf the input is genuinely too thin to distill (e.g. \"an app for hikers\" with no surrounding context), stop and suggest `acl-prd` (or sibling ceremony skill). This skill distills; it does not coach.\r\n\r\n## Load-bearing\r\n\r\nA claim is **load-bearing** if any consumer (downstream skill, implementing agent, verification pass) would change a decision without it.\r\n\r\n## Companions\r\n\r\nWhen load-bearing content does not fit the five-field kernel, it lives in a companion. The kernel cites it; the companion holds it. Companions are part of the contract; every consumer reads `companions:` in SPEC.md frontmatter to discover them. Companions follow the same lean discipline as SPEC.md (Spec Law rule 8).\r\n\r\n**Spawn a companion when the content needs more than one kernel-shape line:** multi-item catalogs (per-entity matrices like archetypes, drinks, modes, routes), tables, diagrams (always), editorial voice rules, long-form reference material the kernel cites by name (glossary, brownfield notes, project conventions). Single-line decision-benders stay in Constraints; intent+success pairs stay in Capabilities. If a kernel field is starting to bullet into sub-bullets, the content has outgrown the kernel and wants a companion.\r\n\r\nCompanions are either:\r\n\r\n- **Spec-authored** companions are written by acl-spec and live as **siblings of SPEC.md** (e.g., `glossary.md`, `patron-archetypes.md`). acl-spec owns them and may edit them on update operations.\r\n- **Adopted** companions are load-bearing artifacts written by an upstream skill that downstream still needs to read. acl-spec references them into `companions:` by relative path but does NOT edit them (e.g., a `DESIGN.md` or `EXPERIENCE.md` from a UX run, an integration partner's API spec). The originating skill owns them.\r\n\r\nTwo rules govern companions:\r\n\r\n1. **Name spec-authored companions for the content type they hold.** `glossary.md`, `<entity-class>.md` (e.g. `patron-archetypes.md`, `medication-routes.md`, `flight-modes.md`), `stack.md`, `conventions.md`, `brownfield.md`, `architecture-diagrams.md`, `state-machines.md`, `failure-modes.md`, `compliance-references.md`. The principle: \"a reader should know what is inside before opening it.\" Adopted companions keep whatever name their originating skill gave them.\r\n2. **Diagrams always land in a companion**, regardless of size. SPEC.md kernel holds prose only. Mermaid blocks, ASCII diagrams, and image references all live in a companion (e.g. `architecture-diagrams.md`), with sibling image files referenced from there.\r\n\r\nPre-existing project-wide docs (e.g. `project-context.md`) that downstream needs are listed as **adopted companions**, never duplicated into SPEC.md or a spec-authored companion.\r\n\r\n`stories.yaml`, when produced, is spec-authored but deliberately **not** a companion — see Story Breakdown below.\r\n\r\n## Spec Law\r\n\r\nEvery spec must satisfy these eight rules. The operation aims for them; the self-validate sweep enforces them.\r\n\r\n1. **Each capability has both `intent` and `success`.** Missing either = not a capability.\r\n2. **Intents describe WHAT, not HOW.** Implementation prescription belongs in a companion (stack, conventions).\r\n3. **Constraints actually bend design decisions.** A \"constraint\" that rules nothing out is decoration.\r\n4. **Non-goals are explicit.** At least one. Absence means downstream skills fill the vacuum.\r\n5. **Success signal is concrete enough to test or demonstrate against.** \"Users love it\" doesn't qualify.\r\n6. **Capability IDs are stable and unique.** Never reused, never renumbered.\r\n7. **Preservation.** Every load-bearing source claim lands in SPEC.md or a companion. Wrapper ceremony does not.\r\n8. **Lean prose.** Every sentence carries load-bearing content. Cut decoration, hedges, backstory, throat-clearing. Applies to SPEC.md, companions, and `.memlog.md`.\r\n\r\n## Self-Validate\r\n\r\nAfter every create or update, sweep the resulting artifact in **two passes** before presenting.\r\n\r\n**Pass 1 — Coherence.** Judge the spec against Spec Law rules 1–6 and 8. For anything that fails or feels weak, attempt to fix it without inventing content the input did not support. Calls made without direct confirmation become `assumptions[]`; gaps that could not be filled become `open_questions[]`.\r\n\r\n**Pass 2 — Preservation.** Walk the source claim by claim. Confirm each load-bearing claim landed in SPEC.md or a companion. Wrapper-ceremony drops are logged under \"Wrapper-only content\" so the drop is on the record, not silent.\r\n\r\nRecord the verdict for each pass to `.memlog.md` (`append --type event`). In interactive mode, review it with the user. In headless mode, `.memlog.md` is one of the files returned, so the caller (or its downstream LLM) reads the verdict there.\r\n\r\n## Spec with no change signal\r\n\r\nWhen the user points the skill at an existing spec folder (or its SPEC.md) with no change signal, offer to review assumptions or open questions, or determine what they want to do.\r\n\r\n## Story Breakdown (optional, interactive-only)\r\n\r\nRequires `SPEC.md` on disk — run the normal Operation first if it doesn't exist yet. Headless runs never do this, even when the invocation text asks for it: if mode detection (On Activation, step 4) resolved headless, skip this section entirely and proceed with the normal headless response. In interactive mode, offer it at most once per run when the input reads as multiple independently shippable slices; a decline ends the offer for this run, not forever. Also run it on direct request (\"break this into stories\") whenever `SPEC.md` exists. When a spec update runs and `stories.yaml` exists, check the story descriptions against the updated spec; if any no longer matches, say so and offer to re-run Story Breakdown. The update itself never rewrites `stories.yaml`.\r\n\r\nEither way, walk the capabilities and constraints with the user and propose a story per independently reviewable slice — this is a conversation, not a silent render. For each story, ask the user for `spec_checkpoint`, `done_checkpoint`, and any `invoke_dev_with` note rather than defaulting them silently; capturing that human judgment is what the fields are for. If the conversation surfaces load-bearing detail beyond dispatch notes (a constraint, a design decision), route it into SPEC.md or a companion — `invoke_dev_with` carries dispatch notes only (Spec Law rule 7 still applies).\r\n\r\nThe output is `stories.yaml`, a sibling of `SPEC.md` inside the spec folder, discovered by that fixed name — same convention as `SPEC.md` and `.memlog.md`. Never list it in `companions:` and never point a frontmatter key at it: companions carry the what-to-build contract every consumer reads; `stories.yaml` is input for whichever tool dispatches the stories.\r\n\r\nField definitions, the validity rules, and a worked example live in `assets/stories-schema.md`. Before writing or re-writing the file, check every entry against those rules; fix violations rather than presenting a file that fails them. Record the check's verdict to `.memlog.md` (`append --type event`), the same discipline as Self-Validate.\r\n\r\nDerive `stories.yaml` from `.memlog.md` exactly like any other spec-authored artifact: log each proposed story (`--type decision`) as the user agrees to it, then render. On a later run against the same spec folder, re-derive the same way, handling ids per the schema's update semantics.\r\n\r\n## Output\r\n\r\n**Interactive** — share the spec folder path conversationally. Name the capability count, the companions produced, and the verdict in one or two sentences. Name the story count too if `stories.yaml` was written this run. If `assumptions[]` or `open_questions[]` are non-empty, list them (short — one line each) and invite the user to walk through them. Make clear that addressing them can update the source input (if it was a file), the spec, or both — whichever combination the user prefers. Do not dump JSON or present a wall of output.\r\n\r\n**Headless** — return JSON per `assets/headless-schemas.md`.\r\n\r\nRun `{workflow.on_complete}` if set.\r\n\r\n## After Spec is Output\r\n\r\nAny update to the spec — resolved assumptions, answered open questions, other changes — is appended to `.memlog.md` as it happens. When a change overrides something that came from a source input, offer to update that source too, so upstream and the spec don't silently diverge.\r\n\r\n## Frontmatter conventions\r\n\r\n- `companions:` array of `.md` files downstream MUST read alongside SPEC.md to have the full contract. Paths may point inside the spec folder (spec-authored companions like `glossary.md`) or outside it (adopted companions like `../planning-artifacts/ux-designs/ux-foo-bar-2026-05-23/DESIGN.md`). The split between spec-authored and adopted is implicit by path; downstream treats both the same.\r\n- `sources:` array of paths to files that were **fully absorbed** into the SPEC, with no remaining downstream value (e.g., a PRD whose every load-bearing claim is now in the kernel). Listed for audit and for acl-spec to re-read on update. Downstream does NOT read these. Files that downstream still needs to read belong in `companions:`, not here.\r\n- **Do not list** the memlog, README files, organizational artifacts, or any operational record of how upstream skills produced their artifacts. Those are not source content; they are process metadata that downstream consumers don't need.\r\n"},"commands":{"claude":"/acl-spec","cursor":"@acl-spec","windsurf":"/acl-spec","copilot":"@github /acl-spec","antigravity":"/acl-spec","universal":"Act as the ACL-ADLC acl-spec (acl-spec). Adhere to the Phase-Gate Governance in Markdown Studio."},"supportedModels":[{"id":"claude","name":"Claude Code","icon":"🟣","command":"/acl-spec","hint":"Type in Claude Code terminal"},{"id":"cursor","name":"Cursor","icon":"🔵","command":"@acl-spec","hint":"Reference in Cursor Chat or Composer"},{"id":"windsurf","name":"Windsurf","icon":"🌊","command":"/acl-spec","hint":"Type in Windsurf Cascade"},{"id":"copilot","name":"GitHub Copilot","icon":"🐙","command":"@github /acl-spec","hint":"Invoke in Copilot Chat"},{"id":"antigravity","name":"Antigravity (AGY)","icon":"⚡","command":"/acl-spec","hint":"Type in Antigravity chat or agy"},{"id":"universal","name":"Universal LLM","icon":"🤖","command":"Execute the ACL-ADLC agent skill 'acl-spec': Distill any intent input into the SPEC kernel + companions — the canonical, preservation-validated machine contract for downstream work. Use when the user says.","hint":"Paste into ChatGPT, Gemini, Claude Web, or DeepSeek"}]},{"id":"acl-sprint-planning","name":"acl-sprint-planning","displayName":"acl-sprint-planning","description":"Generate sprint status tracking from epics. Use when the user says","module":"4-implementation","moduleLabel":"Phase 4 · Implementation","moduleShort":"Implementation","folderPath":"src/acl-skills/4-implementation/acl-sprint-planning","skillFile":{"filename":"SKILL.md","fullPath":"src/acl-skills/4-implementation/acl-sprint-planning/SKILL.md","content":"---\r\nname: acl-sprint-planning\r\ndescription: 'Generate sprint status tracking from epics. Use when the user says \"run sprint planning\" or \"generate sprint plan\"'\r\n---\n\n## 🚦 Universal Phase Gate Precondition (Mandatory & Non-Negotiable)\nBefore executing any actions, adopting any persona, greeting the user, or producing output:\n1. Scan all existing markdown files in `_acl-output/` (or run `node tools/adlc-gate-guard.js`).\n2. If ANY prerequisite markdown file in `_acl-output/` is missing, or has ANY status other than `Approved` (e.g. `In Review`, `draft`, `Pending`, `Rejected`):\n   - **TOTAL AGENT BLOCK (NO PERSONAS, NO CHATTING, NO BRAINSTORMING, NO FILE GENERATION)**:\n     - The AI Agent is **STRICTLY FORBIDDEN** from adopting personas or greeting the user as an agent.\n     - The AI Agent is **STRICTLY FORBIDDEN** from offering conversational advice, whiteboard diagrams, or brainstorming in chat while waiting for approval.\n     - The AI Agent is **STRICTLY FORBIDDEN** from creating, updating, or modifying downstream files.\n     - The AI Agent is **STRICTLY FORBIDDEN** from asking or suggesting the user/developer to self-approve or change the status.\n   - **THE ONLY PERMITTED ACTION**: Output the official waiting message:\n     ```text\n     ========================================================================\n     ⏳ [GATE LOCKED]: Awaiting Manager Sign-Off (ACL-ADLC Protocol)\n     ========================================================================\n     📄 Document in Review: One or more prerequisite documents in _acl-output/ are currently IN REVIEW / PENDING.\n     🏷️ Current Status:      [IN REVIEW / PENDING]\n\n     ⚠️ STATUS:\n        As per the ACL-ADLC sequential delivery framework, this document \n        is currently awaiting official review and sign-off by your Manager.\n\n     👉 NEXT STEP:\n        Please wait for your manager to review and mark this document as \n        'Approved' or 'Rejected' in Markdown Studio before proceeding with \n        downstream tasks.\n     ========================================================================\n     ```\n3. Only proceed if ALL existing documents in `_acl-output/` have `status: Approved`.\n\n## 🛑 STRICT PROHIBITION: No Direct AI Status Manipulation & Manager-Only Approval\n- The AI agent is **STRICTLY PROHIBITED** from using tools (`replace_file_content`, `write_to_file`, `run_command`, etc.) to change `status: In Review` -> `status: Approved` at ANY cost.\n- ONLY THE MANAGER is authorized and permitted to change the status via Markdown Studio (`markdown.html`).\n- The AI agent is **STRICTLY PROHIBITED** from prompting the developer to self-approve or change review statuses.\n- The AI agent MUST ONLY instruct the developer to wait for the manager's review.\n\n\r\n# Sprint Planning Workflow\r\n\r\n**Goal:** Generate sprint status tracking from epics, detecting current story statuses and building a complete sprint-status.yaml file.\r\n\r\n**Your Role:** You are a Developer generating and maintaining sprint tracking. Parse epic files, detect story statuses, and produce a structured sprint-status.yaml.\r\n\r\n## Conventions\r\n\r\n- Bare paths (e.g. `checklist.md`) resolve from the skill root.\r\n- `{skill-root}` resolves to this skill's installed directory (where `customize.toml` lives).\r\n- `{project-root}`-prefixed paths resolve from the project working directory.\r\n- `{skill-name}` resolves to the skill directory's basename.\r\n\r\n## On Activation\r\n\r\n### Step 1: Resolve the Workflow Block\r\n\r\nRun: `python3 {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow`\r\n\r\n**If the script fails**, resolve the `workflow` block yourself by reading these three files in base → team → user order and applying the same structural merge rules as the resolver:\r\n\r\n1. `{skill-root}/customize.toml` — defaults\r\n2. `{project-root}/_acl/custom/{skill-name}.toml` — team overrides\r\n3. `{project-root}/_acl/custom/{skill-name}.user.toml` — personal overrides\r\n\r\nAny missing file is skipped. Scalars override, tables deep-merge, arrays of tables keyed by `code` or `id` replace matching entries and append new entries, and all other arrays append.\r\n\r\n### Step 2: Execute Prepend Steps\r\n\r\nExecute each entry in `{workflow.activation_steps_prepend}` in order before proceeding.\r\n\r\n### Step 3: Load Persistent Facts\r\n\r\nTreat every entry in `{workflow.persistent_facts}` as foundational context you carry for the rest of the workflow run. Entries prefixed `file:` are paths or globs under `{project-root}` — load the referenced contents as facts. All other entries are facts verbatim.\r\n\r\n### Step 4: Load Config\r\n\r\nLoad config from `{project-root}/_acl/acl/config.yaml` and resolve:\r\n\r\n- `project_name`, `user_name`\r\n- `communication_language`, `document_output_language`\r\n- `implementation_artifacts`\r\n- `planning_artifacts`\r\n- `date` as system-generated current datetime\r\n- `project_context` = `**/project-context.md` (load if exists)\r\n- YOU MUST ALWAYS SPEAK OUTPUT in your Agent communication style with the config `{communication_language}`\r\n- Generate all documents in `{document_output_language}`\r\n\r\n### Step 5: Greet the User\r\n\r\nGreet `{user_name}`, speaking in `{communication_language}`.\r\n\r\n### Step 6: Execute Append Steps\r\n\r\nExecute each entry in `{workflow.activation_steps_append}` in order.\r\n\r\nActivation is complete. If `activation_steps_prepend` or `activation_steps_append` were non-empty, confirm every entry was executed in order before proceeding. Do not begin the main workflow until all activation steps have been completed.\r\n\r\n## Paths\r\n\r\n- `tracking_system` = `file-system`\r\n- `project_key` = `NOKEY`\r\n- `story_location` = `{implementation_artifacts}`\r\n- `story_location_absolute` = `{implementation_artifacts}`\r\n- `epics_location` = `{planning_artifacts}`\r\n- `epics_pattern` = `*epic*.md`\r\n- `status_file` = `{implementation_artifacts}/sprint-status.yaml`\r\n\r\n## Input Files\r\n\r\n| Input | Path | Load Strategy |\r\n|-------|------|---------------|\r\n| Epics | `{planning_artifacts}/*epic*.md` (whole) or `{planning_artifacts}/*epic*/*.md` (sharded) | FULL_LOAD |\r\n\r\n## Execution\r\n\r\n### Document Discovery - Full Epic Loading\r\n\r\n**Strategy**: Sprint planning needs ALL epics and stories to build complete status tracking.\r\n\r\n**Epic Discovery Process:**\r\n\r\n1. **Search for whole document first** - Look for `epics.md`, `acl-epics.md`, or any `*epic*.md` file\r\n2. **Check for sharded version** - If whole document not found, look for `epics/index.md`\r\n3. **If sharded version found**:\r\n   - Read `index.md` to understand the document structure\r\n   - Read ALL epic section files listed in the index (e.g., `epic-1.md`, `epic-2.md`, etc.)\r\n   - Process all epics and their stories from the combined content\r\n   - This ensures complete sprint status coverage\r\n4. **Priority**: If both whole and sharded versions exist, use the whole document\r\n\r\n**Fuzzy matching**: Be flexible with document names - users may use variations like `epics.md`, `acl-epics.md`, `user-stories.md`, etc.\r\n\r\n<workflow>\r\n\r\n<step n=\"1\" goal=\"Parse epic files and extract all work items\">\r\n<action>Load {project_context} for project-wide patterns and conventions (if exists)</action>\r\n<action>Communicate in {communication_language} with {user_name}</action>\r\n<action>Look for all files matching `{epics_pattern}` in {epics_location}</action>\r\n<action>Could be a single `epics.md` file or multiple `epic-1.md`, `epic-2.md` files</action>\r\n\r\n<action>For each epic file found, extract:</action>\r\n\r\n- Epic numbers from headers like `## Epic 1:` or `## Epic 2:`\r\n- Story IDs and titles from patterns like `### Story 1.1: User Authentication`\r\n- Convert story format from `Epic.Story: Title` to kebab-case key: `epic-story-title`\r\n\r\n**Story ID Conversion Rules:**\r\n\r\n- Original: `### Story 1.1: User Authentication`\r\n- Replace period with dash: `1-1`\r\n- Convert title to kebab-case: `user-authentication`\r\n- Final key: `1-1-user-authentication`\r\n\r\n<action>Build complete inventory of all epics and stories from all epic files</action>\r\n</step>\r\n\r\n<step n=\"2\" goal=\"Build sprint status structure\">\r\n<action>For each epic found, create entries in this order:</action>\r\n\r\n1. **Epic entry** - Key: `epic-{num}`, Default status: `backlog`\r\n2. **Story entries** - Key: `{epic}-{story}-{title}`, Default status: `backlog`\r\n3. **Retrospective entry** - Key: `epic-{num}-retrospective`, Default status: `optional`\r\n\r\n**Example structure:**\r\n\r\n```yaml\r\ndevelopment_status:\r\n  epic-1: backlog\r\n  1-1-user-authentication: backlog\r\n  1-2-account-management: backlog\r\n  epic-1-retrospective: optional\r\n```\r\n\r\n</step>\r\n\r\n<step n=\"3\" goal=\"Apply intelligent status detection\">\r\n<action>For each story, detect current status by checking files:</action>\r\n\r\n**Story file detection:**\r\n\r\n- Check: `{story_location_absolute}/{story-key}.md` (e.g., `stories/1-1-user-authentication.md`)\r\n- If exists → upgrade status to at least `ready-for-dev`\r\n\r\n**Preservation rule:**\r\n\r\n- If existing `{status_file}` exists and has more advanced status, preserve it\r\n- Never downgrade status (e.g., don't change `done` to `ready-for-dev`)\r\n- If existing `{status_file}` has an `action_items` section, carry it over unchanged\r\n\r\n**Status Flow Reference:**\r\n\r\n- Epic: `backlog` → `in-progress` → `done`\r\n- Story: `backlog` → `ready-for-dev` → `in-progress` → `review` → `done`\r\n- Retrospective: `optional` ↔ `done`\r\n  </step>\r\n\r\n<step n=\"4\" goal=\"Generate sprint status file\">\r\n<action>Create or update {status_file} with:</action>\r\n\r\n**File Structure:**\r\n\r\n```yaml\r\n# generated: {date}\r\n# last_updated: {date}\r\n# project: {project_name}\r\n# project_key: {project_key}\r\n# tracking_system: {tracking_system}\r\n# story_location: {story_location}\r\n\r\n# STATUS DEFINITIONS:\r\n# ==================\r\n# Epic Status:\r\n#   - backlog: Epic not yet started\r\n#   - in-progress: Epic actively being worked on\r\n#   - done: All stories in epic completed\r\n#\r\n# Epic Status Transitions:\r\n#   - backlog → in-progress: Automatically when first story starts (via quick-dev's sprint sync)\r\n#   - in-progress → done: Manually when all stories reach 'done' status\r\n#\r\n# Story Status:\r\n#   - backlog: Story only exists in epic file\r\n#   - ready-for-dev: Story file created in stories folder\r\n#   - in-progress: Developer actively working on implementation\r\n#   - review: Ready for code review (via Dev's code-review workflow)\r\n#   - done: Story completed\r\n#\r\n# Retrospective Status:\r\n#   - optional: Can be completed but not required\r\n#   - done: Retrospective has been completed\r\n#\r\n# Action Item Status:\r\n#   - open: Committed during a retrospective, not yet addressed\r\n#   - in-progress: Actively being worked on\r\n#   - done: Completed\r\n#\r\n# WORKFLOW NOTES:\r\n# ===============\r\n# - Epic transitions to 'in-progress' automatically when first story starts (via quick-dev's sprint sync)\r\n# - Stories can be worked in parallel if team capacity allows\r\n# - Developer typically creates next story after previous one is 'done' to incorporate learnings\r\n# - Dev moves story to 'review', then runs code-review (fresh context, different LLM recommended)\r\n# - Retrospective appends its action items to action_items; sprint-status surfaces open ones\r\n\r\ngenerated: { date }\r\nlast_updated: { date }\r\nproject: { project_name }\r\nproject_key: { project_key }\r\ntracking_system: { tracking_system }\r\nstory_location: { story_location }\r\n\r\ndevelopment_status:\r\n  # All epics, stories, and retrospectives in order\r\n```\r\n\r\n<action>Write the complete sprint status YAML to {status_file}</action>\r\n<action>CRITICAL: Metadata appears TWICE - once as comments (#) for documentation, once as YAML key:value fields for parsing</action>\r\n<action>Ensure all items are ordered: epic, its stories, its retrospective, next epic...</action>\r\n<action>If the existing file had an action_items section, write it back unchanged after development_status</action>\r\n</step>\r\n\r\n<step n=\"5\" goal=\"Validate and report\">\r\n<action>Perform validation checks:</action>\r\n\r\n- [ ] Every epic in epic files appears in {status_file}\r\n- [ ] Every story in epic files appears in {status_file}\r\n- [ ] Every epic has a corresponding retrospective entry\r\n- [ ] No development_status items in {status_file} that don't exist in epic files\r\n- [ ] action_items section (if it existed) carried over unchanged\r\n- [ ] All status values are legal (match state machine definitions)\r\n- [ ] File is valid YAML syntax\r\n\r\n<action>Count totals:</action>\r\n\r\n- Total epics: {{epic_count}}\r\n- Total stories: {{story_count}}\r\n- Epics in-progress: {{in_progress_count}}\r\n- Stories done: {{done_count}}\r\n\r\n<action>Display completion summary to {user_name} in {communication_language}:</action>\r\n\r\n**Sprint Status Generated Successfully**\r\n\r\n- **File Location:** {status_file}\r\n- **Total Epics:** {{epic_count}}\r\n- **Total Stories:** {{story_count}}\r\n- **Epics In Progress:** {{in_progress_count}}\r\n- **Stories Completed:** {{done_count}}\r\n\r\n**Next Steps:**\r\n\r\n1. Review the generated {status_file}\r\n2. Use this file to track development progress\r\n3. Agents will update statuses as they work\r\n4. Re-run this workflow to refresh auto-detected statuses\r\n\r\n<action>Run: `python3 {project-root}/_acl/scripts/resolve_customization.py --skill {skill-root} --key workflow.on_complete` — if the resolved value is non-empty, follow it as the final terminal instruction before exiting.</action>\r\n</step>\r\n\r\n</workflow>\r\n\r\n## Additional Documentation\r\n\r\n### Status State Machine\r\n\r\n**Epic Status Flow:**\r\n\r\n```\r\nbacklog → in-progress → done\r\n```\r\n\r\n- **backlog**: Epic not yet started\r\n- **in-progress**: Epic actively being worked on (stories being created/implemented)\r\n- **done**: All stories in epic completed\r\n\r\n**Story Status Flow:**\r\n\r\n```\r\nbacklog → ready-for-dev → in-progress → review → done\r\n```\r\n\r\n- **backlog**: Story only exists in epic file\r\n- **ready-for-dev**: Story file created (e.g., `stories/1-3-plant-naming.md`)\r\n- **in-progress**: Developer actively working\r\n- **review**: Ready for code review (via Dev's code-review workflow)\r\n- **done**: Completed\r\n\r\n**Retrospective Status:**\r\n\r\n```\r\noptional ↔ done\r\n```\r\n\r\n- **optional**: Ready to be conducted but not required\r\n- **done**: Finished\r\n\r\n**Action Item Status:**\r\n\r\n```\r\nopen → in-progress → done\r\n```\r\n\r\n- **open**: Committed during a retrospective, not yet addressed\r\n- **in-progress**: Actively being worked on\r\n- **done**: Completed\r\n\r\n### Guidelines\r\n\r\n1. **Epic Activation**: Mark epic as `in-progress` when starting work on its first story\r\n2. **Sequential Default**: Stories are typically worked in order, but parallel work is supported\r\n3. **Parallel Work Supported**: Multiple stories can be `in-progress` if team capacity allows\r\n4.
