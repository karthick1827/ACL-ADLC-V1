*And** the mandatory 5-State Component Matrix is operational:\n  - **Loading:** Map shows centering loader overlay; facility list displays 4 skeleton cards.\n  - **Empty:** Regions without sites display \"No sites configured in this region\" with an \"Add Site\" trigger.\n  - **Error:** Map tile failure shows fallback list view without crashing card interactions.\n  - **Overflow:** Facility titles > 35 chars clamp with hover tooltip; hierarchical trees support collapsible nodes up to 6 levels deep.\n- **And** automated tests verify coordinate projection, zone breadcrumb calculation, and health badge aggregation.\n\n---\n\n## Epic 5: Real-Time Alarm & Incident Triage Stream\n\nDeliver a high-velocity event triage console enabling operators to identify, inspect, and acknowledge critical equipment threshold breaches.\n\n### Story 5.1: Alarm Feed & Incident Triage Visual Shell (Pass 1)\n\nAs a frontend developer,  \nI want to build the static visual layout for the Alarm Triage console,  \nSo that the alarm queue and list rows match Figma frames `Manage Alarms` (`#293:8138`), `Manage Alarms List` (`#293:10463`), and `Devices - Alarms` (`#362:14623`).\n\n**Acceptance Criteria:**\n\n- **Given** Figma frames `#293:8138`, `#293:10463`, and `#362:14623`,\n- **When** `src/features/alarms/components/AlarmTriageView.tsx` is rendered,\n- **Then** the alarm queue displays severity-ranked rows with color-coded badges (Critical `#E50026`, Major `#FE5B26`, Minor `#FF8C65`, Info `#0A93D3`), timestamp column, device links, and static \"Acknowledge\" buttons.\n- **And** all layout paddings, border strokes, and typography match Figma design specifications.\n\n### Story 5.2: Alarm Stream Functional Wiring & Acknowledgment Workflow (Pass 2)\n\nAs a shift operator,  \nI want to receive real-time alarm updates and acknowledge incidents with resolution notes,  \nSo that equipment anomalies are immediately triaged and logged for operational compliance.\n\n**Acceptance Criteria:**\n\n- **Given** the static alarm triage console from Story 5.1,\n- **When** live telemetry triggers a threshold breach,\n- **Then** a new alarm row appears at the top of the queue via WebSocket within 500ms without full page reload.\n- **And** clicking \"Acknowledge\" opens the incident comment dialog; submitting updates alarm status to `Acknowledged` and logs the operator ID.\n- **And** clicking the device link navigates directly to the triggering device's telemetry inspector.\n- **And** the mandatory 5-State Component Matrix is enforced:\n  - **Loading:** Shimmering skeleton rows display pulsating severity pills during initial query.\n  - **Empty:** Zero active alarms renders a green shield graphic with \"All systems operational\".\n  - **Error:** WebSocket disconnection renders a sticky amber banner with auto-reconnection countdown (\"Reconnecting in 5s...\").\n  - **Overflow:** Long alarm descriptions clamp to 2 lines with expand toggle; queue engages pagination when active alarms exceed 100 entries.\n- **And** automated tests verify WebSocket message ingestion, severity sorting, and acknowledgment mutation.\n\n---\n\n## Epic 6: User Administration & Per-Site RBAC\n\nProvide IT administrators with secure tenant user provisioning, per-site role assignments, and immediate session governance.\n\n### Story 6.1: User Directory & Provisioning Visual Shell (Pass 1)\n\nAs a frontend developer,  \nI want to implement the static visual presentation for the User Directory,  \nSo that the user table and permission assignment controls mirror Figma component `Devices - Users` (`#362:14622`).\n\n**Acceptance Criteria:**\n\n- **Given** Figma component `Devices - Users` (`#362:14622`),\n- **When** `src/features/users/components/UserDirectoryView.tsx` is rendered,\n- **Then** the user table displays user avatars, names, emails, role badges (`Admin`, `Site Manager`, `Technician`, `Viewer`), assigned site tags, and action buttons matching Figma design tokens.\n- **And** the Invite User modal dialog layout displays with static fields and styling.\n\n### Story 6.2: User Administration Functional Wiring & Per-Site RBAC Guard (Pass 2)\n\nAs an IT security administrator,  \nI want to invite new operators and assign their roles strictly on a per-site basis,  \nSo that contractors and managers only access the physical facilities under their operational jurisdiction.\n\n**Acceptance Criteria:**\n\n- **Given** the static user directory from Story 6.1,\n- **When** an Admin invites a user and assigns site-role pairs (e.g. `Site Manager` at Dallas North),\n- **Then** the backend records the RBAC policy, creates an audit log entry, and issues an invitation email.\n- **And** users attempting to access sites outside their assigned scope are blocked by the client-side authorization guard (AD-5).\n- **And** revoking a user's permissions invalidates their active session within 60 seconds.\n- **And** the mandatory 5-State Component Matrix is active:\n  - **Loading:** Table row skeletons display while fetching user records.\n  - **Empty:** Zero search results render \"No users found\" with an \"+ Invite User\" action.\n  - **Error:** Failed permission updates trigger an error toast (\"Permission update failed: Insufficient authority\").\n  - **Overflow:** Users assigned to > 5 sites display \"+N more\" badge with popover list on hover; email addresses > 32 chars truncate.\n- **And** automated tests verify RBAC rule evaluation, invitation dispatch, and audit logging.\n"},{"id":"_acl-output_4-implementation_story-1-1_md","folderPath":"_acl-output/4-implementation","filename":"story-1-1.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T07:22:56.146Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T05:10:53.845Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 1.1: Authentication & Global Header Visual Shell\"\nstory_id: \"1.1\"\nepic_id: \"1\"\nproject_type: greenfield\ncreated: 2026-10-14\n---\n\n# Story 1.1: Authentication & Global Header Visual Shell (Pass 1)\n\n## Overview & User Story\n\nAs a frontend developer,  \nI want to build the static visual layout for the Login screen and Global Header matching Figma,  \nSo that the visual presentation achieves 100% pixel-perfect fidelity before adding dynamic logic.\n\n---\n\n## Technical Contract & Design Invariants\n\n- **Design Reference**: Figma Canvas `🌷 Web` (Node `104:7811`), specifically `Login` frame (`#1228:11322`).\n- **Visual References**: `src/assets/figma/Login.png`.\n- **Figma MCP Exported Assets**:\n  - `fleet360_white.svg` (Node `4003:14129`): Crisp vector brand mark in pure white.\n  - `login_hero.png` (Node `1252:14409`): High-resolution industrial AC compressor background artwork.\n  - `acl_digital_logo.svg` (Node `4045:14223`): Official \"Powered by ACL Digital an ALTEN group company\" brand footer.\n- **Typography (AD-1)**: `Inter` font family loaded via Google Fonts and applied across labels, inputs, and buttons.\n- **Design Tokens (AD-2)**:\n  - Canvas Deep Navy: `#003366`\n  - Brand Red Action Button: `#E40F37` (hover `#CC0D31`)\n  - Input Focus Ring Blue: `#0094D9`\n  - White Text / Card Elements: `#FFFFFF`\n- **Zero Dynamic State Constraint (Pass 1)**: Pure visual layout shell with 100% pixel fidelity against `Login.png`.\n\n---\n\n## Code Map\n\nThe implementation of Story 1.1 is bounded to the following files:\n\n- `src/assets/figma/fleet360_white.svg`: Official white vector logo exported via Figma MCP.\n- `src/assets/figma/login_hero.png`: Industrial compressor image exported via Figma MCP.\n- `src/assets/figma/acl_digital_logo.svg`: Brand footer vector logo exported via Figma MCP.\n- `src/assets/figma/index.ts`: Asset catalog bundle exposing `FigmaAssets`.\n- `src/components/LoginView.jsx`: Static visual layout component.\n- `src/App.jsx`: Screen mounting for Login visual testing.\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Split-screen layout renders with deep navy background `#003366` and right-aligned industrial AC compressor hero graphic (`login_hero.png`) with Figma 4-stop gradient blend overlay into `#003366`.\n- [x] White vector logo (`fleet360_white.svg`) renders crisply at top of authentication card (max-w 340px).\n- [x] Email and Password input fields render with exact placeholder styling and `#0094D9` focus ring.\n- [x] Primary Login button rendered in `#E40F37` with hover transition to `#CC0D31` and subtle shadow.\n- [x] Terms and Conditions & Privacy Notice subtext rendered with underline links.\n- [x] Official \"Powered by ACL Digital\" logo (`acl_digital_logo.svg`) pinned in bottom footer.\n- [x] Production build (`npm run build`) succeeds with zero errors.\n"},{"id":"_acl-output_4-implementation_story-1-2_md","folderPath":"_acl-output/4-implementation","filename":"story-1-2.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T05:14:14.005Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T05:16:36.506Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 1.2: Authentication Functional Wiring & State\"\nstory_id: \"1.2\"\nepic_id: \"1\"\nproject_type: greenfield\ncreated: 2026-10-14\n---\n\n# Story 1.2: Authentication Functional Wiring & State (Pass 2)\n\n## Overview & User Story\n\nAs an authorized facility operator,  \nI want to submit my credentials, accept regulatory terms, and securely authenticate into Fleet 360,  \nSo that I can access my designated site telemetry in accordance with corporate security policy.\n\n---\n\n## Technical Contract & 5-State Matrix Implementation\n\n- **Target Component**: `src/components/LoginView.jsx` and `src/components/MyComponent.jsx`.\n- **Test File**: `src/components/MyComponent.test.jsx` and `src/components/Fleet360.test.jsx` (Vitest test suite).\n- **Layout Invariant**: Outer layout Tailwind classes must NOT be altered; box model and visual styling from Pass 1 remain intact.\n- **State Management**: React state hooks (`useState`, `useCallback`) for credentials (`email`, `password`), terms consent (`agreedToTerms`), and status flags.\n- **5-State Component Matrix**:\n  1. **State 1 (Baseline / Default)**: Form rendered with active fields, submit button enabled upon valid form state, terms agreement checkbox.\n  2. **State 2 (Loading Skeleton / Indicator)**: When authentication is in flight (`isLoading: true`), input fields are disabled, and the submit button displays an embedded spinner with text \"Authenticating...\".\n  3. **State 3 (Empty UI)**: Initial pristine state when no input has been entered; fields display prompt placeholders (\"Enter Email\", \"Enter Password\").\n  4. **State 4 (Error Banner)**: Network failure or invalid credentials render an alert banner (`#E40F37`) with message \"Invalid email or password. Please try again.\" and retry mechanism.\n  5. **State 5 (Overflow)**: Long email inputs (> 35 characters) handle text overflow with truncation / horizontal scrolling without breaking outer card container; responsive layout wraps gracefully on smaller viewports.\n\n---\n\n## Code Map\n\n- `src/components/LoginView.jsx`: Interactive authentication view with email, password validation, error display, and onLoginSuccess handler.\n- `src/components/MyComponent.jsx`: Add interactive state, props (`onSubmit`, `isLoading`, `errorMessage`, `initialValues`), click handlers, and 5-state matrix rendering without altering outer layout classes.\n- `src/components/Fleet360.test.jsx`: Unit tests validating LoginView mounting and submission.\n- `src/components/MyComponent.test.jsx`: Vitest unit tests verifying:\n  - Default rendering and prop bindings\n  - Loading state with disabled inputs and spinner\n  - Empty state with placeholders\n  - Error state with alert banner and message\n  - Overflow state handling\n  - Submission handler firing with credentials\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Interactive state wired into `src/components/MyComponent.jsx` for email, password, terms consent, and submission.\n- [x] Outer layout Tailwind classes preserved without modification.\n- [x] 5-State Component Matrix fully supported via props and internal state:\n  - [x] Default state (Figma happy path)\n  - [x] Loading skeleton / spinner state\n  - [x] Empty state with placeholders\n  - [x] Error banner state with retry trigger\n  - [x] Overflow handling for long inputs and responsive boundaries\n- [x] Unit tests implemented in `src/components/MyComponent.test.jsx` using Vitest covering all 5 states and form interactions.\n- [x] Full regression verification (`npm test` and `npm run build`) passes with zero errors.\n"},{"id":"_acl-output_4-implementation_story-2-1_md","folderPath":"_acl-output/4-implementation","filename":"story-2-1.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T07:22:56.189Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T09:15:28.508Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 2.1: Command Center Landing Visual Shell\"\nstory_id: \"2.1\"\nepic_id: \"2\"\nproject_type: greenfield\ncreated: 2026-10-14\n---\n\n# Story 2.1: Command Center Landing Visual Shell (Pass 1)\n\n## Overview & User Story\n\nAs a frontend developer,  \nI want to construct the static visual layout for the Command Center Landing dashboard,  \nSo that the overview cards, welcome hero banner, and operational shortcuts mirror Figma frame `Landing` (`#227:3884`) with 100% pixel-perfect fidelity.\n\n---\n\n## Technical Contract & Design Invariants\n\n- **Design Reference**: Figma Canvas `🌷 Web` (Node `104:7811`), specifically `Landing` frame (`#227:3884`).\n- **Visual Reference**: `src/assets/figma/Landing.png`.\n- **Figma MCP Exported Assets**:\n  - `fleet360_blue.svg` (Node `4003:14139`): Large brand vector mark in dark navy/blue.\n  - `icon_devices.svg` (Node `227:3932`): Network devices icon.\n  - `icon_sites.svg` (Node `227:3946`): Location site hierarchy icon.\n  - `icon_users.svg` (Node `227:3962`): User profile administration icon.\n- **Typography (AD-1)**: `Inter` font family loaded via Google Fonts and applied across titles, body copy, and button labels.\n- **Design Tokens (AD-2)**:\n  - Top Hero Surface: Pure White `#FFFFFF`\n  - Welcome Headline Navy: `#1E3A8A`\n  - Bottom Hub Cards Canvas: Dark Slate `#4A5568`\n  - Card Action Button: Brand Red `#E40F37` (hover `#CC0D31`)\n  - Subtitle / Body Copy: Gray `#374151` / `#E2E8F0`\n- **Zero Dynamic State Constraint (Pass 1)**: Pure visual shell mirroring `Landing.png` with 100% fidelity.\n\n---\n\n## Code Map\n\nThe implementation of Story 2.1 is bounded to the following files:\n\n- `src/features/landing/components/LandingView.jsx`: Dual-tone visual layout (white hero top, slate card bottom).\n- `src/features/landing/components/HubCard.jsx`: Reusable static hub card primitive with Figma vector icon, title, description, and red pill button.\n- `src/components/LandingView.jsx`: Component visual surface for immediate preview and testing.\n- `src/features/landing/index.js`: Barrel export for the landing feature slice.\n- `src/App.jsx`: Screen switcher mounting LandingView for browser inspection.\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Dual-tone dashboard layout renders with pure white `#FFFFFF` top half and dark slate `#4A5568` bottom section matching `src/assets/figma/Landing.png`.\n- [x] Top hero section displays the large blue Fleet 360 vector logo (`fleet360_blue.svg`) and typography (\"Welcome to Fleet 360\", `#1E3A8A`).\n- [x] Bottom section renders 3 Hub Cards (Devices, Sites, Users) with authentic Figma vector icons (`icon_devices.svg`, `icon_sites.svg`, `icon_users.svg`).\n- [x] Primary action buttons (\"Manage Devices\", \"Manage Sites\", \"Manage Users\") render with `#E40F37` red pill styling and hover transition to `#CC0D31`.\n- [x] Zero Dynamic State constraint strictly respected in visual pass.\n- [x] Production build (`npm run build`) and test suite (`npm test`) pass with zero regressions.\n"},{"id":"_acl-output_4-implementation_story-2-2_md","folderPath":"_acl-output/4-implementation","filename":"story-2-2.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T05:14:47.372Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T09:24:53.990Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 2.2: Landing Console Functional Wiring & Aggregated Telemetry State\"\nstory_id: \"2.2\"\nepic_id: \"2\"\nproject_type: greenfield\ncreated: 2026-10-14\n---\n\n# Story 2.2: Landing Console Functional Wiring & Aggregated Telemetry State (Pass 2)\n\n## Overview & User Story\n\nAs a facilities operations manager,  \nI want the landing dashboard to display live aggregated fleet counters, telemetry metrics, and navigate directly to management consoles,  \nSo that I can assess operational health at a glance and jump straight to impacted operational areas.\n\n---\n\n## Technical Contract & 5-State Component Matrix\n\n- **Target Component**: `src/features/landing/components/LandingView.jsx` (and associated telemetry hooks / state container).\n- **Test File**: `src/features/landing/components/LandingView.test.jsx`.\n- **Figma MCP Asset Bindings**:\n  - `FigmaAssets.fleet360Blue` (Header brand logo)\n  - `FigmaAssets.iconDevices`, `FigmaAssets.iconSites`, `FigmaAssets.iconUsers` (Hub Card vector icons)\n- **Design Tokens**:\n  - Top Surface: Pure White `#FFFFFF`\n  - Bottom Canvas: Dark Slate `#4A5568`\n  - Button Action: Brand Red `#E40F37` (hover `#CC0D31`)\n- **Navigation & Routing**: Handles navigation events (`onNavigate`) for `'devices'`, `'sites'`, and `'users'` targets.\n- **Aggregated Telemetry Metrics**: Supports live count badges (e.g., active device count, monitored sites, provisioned operators).\n- **Mandatory 5-State Component Matrix**:\n  1. **State 1 (Default / Baseline)**: Operational metrics and active telemetry rendered on all 3 hub cards with interactive navigation triggers and authentic Figma SVGs.\n  2. **State 2 (Loading Skeleton / Indicator)**: Shimmer skeleton placeholders display across the banner and cards with zero layout shift (`CLS < 0.05`).\n  3. **State 3 (Empty UI)**: New tenant onboarding state when zero hardware is provisioned (\"No Devices or Sites Connected\") with \"+ Connect First Gateway\" call to action.\n  4. **State 4 (Error Banner)**: Polling failure renders card-level / dashboard-level alert banner with retry trigger.\n  5. **State 5 (Overflow)**: Responsive wrapping across viewports (1 column mobile, 2 columns tablet, 3 columns desktop); long card descriptions clamp gracefully.\n\n---\n\n## Code Map\n\n- `src/features/landing/components/LandingView.jsx`: Wire telemetry state, props (`telemetryData`, `isLoading`, `state`, `onNavigate`, `onRetry`), and full 5-state matrix rendering.\n- `src/features/landing/components/HubCard.jsx`: Add support for badge counter, skeleton shimmer, and disabled states.\n- `src/features/landing/index.js`: Export wired landing container and primitives.\n- `src/features/landing/components/LandingView.test.jsx`: Comprehensive Vitest tests verifying:\n  - Metric rendering and badge displays\n  - 5-State Matrix (Default, Loading skeleton, Empty, Error banner, Overflow)\n  - Navigation handler callbacks for devices, sites, and users\n  - Retry triggers on error recovery\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Telemetry metrics and counter badges rendered on Devices, Sites, and Users cards.\n- [x] Navigation callback (`onNavigate`) triggered when clicking \"Manage Devices\", \"Manage Sites\", or \"Manage Users\".\n- [x] 5-State Component Matrix fully supported:\n  - [x] Default state with active metrics\n  - [x] Loading skeleton with shimmer animation\n  - [x] Empty state with onboarding trigger\n  - [x] Error banner with retry callback\n  - [x] Overflow handling with line clamping\n- [x] Unit test suite in `LandingView.test.jsx` passes covering all 5 states and user interactions.\n- [x] Full regression verification (`npm test` and `npm run build`) passes with zero errors.\n"},{"id":"_acl-output_4-implementation_story-3-1_md","folderPath":"_acl-output/4-implementation","filename":"story-3-1.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T07:22:56.232Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T09:32:16.953Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 3.1: Device Catalog & Unassigned Queue Visual Shell\"\nstory_id: \"3.1\"\nepic_id: \"3\"\nproject_type: greenfield\ncreated: 2026-10-14\n---\n\n# Story 3.1: Device Catalog & Unassigned Queue Visual Shell (Pass 1)\n\n## Overview & User Story\n\nAs a frontend developer,  \nI want to implement the static visual layout for the Device Catalog table and the Unassigned Edge Controller Card,  \nSo that the operational interface matches Figma components `Devices - Devices` (`#362:14620`), `Manage Devices_Card` (`#231:1152`), and `Un-assigned Card` (`#256:10410`) with 100% pixel-perfect fidelity.\n\n---\n\n## Technical Contract & Design Invariants\n\n- **Design Reference**: Figma Canvas `🌷 Web` (Node `104:7811`), specifically `Devices - Devices` frame (`#362:14620`), `Manage Devices_Card` (`#231:1152`), and `Un-assigned Card` (`#256:10410`).\n- **Typography (AD-1)**: `Roboto` (weights: 400, 500, 600, 700) and `Inter` imported via Google Fonts in `index.html`.\n- **Design Tokens (AD-2)**: Colors and shadows bound to `src/assets/figma/theme.css`:\n  - Canvas Surface: `#0d0d14`\n  - Table / Card Container Surface: `#161722`\n  - Border Stroke: `#2e303a`\n  - Active Status Green: `#34C759`\n  - Alarm Status Red: `#E50026` / `#FE5B26`\n  - Inactive / Muted Status: `#9CA0B3`\n  - Primary Action Blue: `#264072` / `#4d80ff`\n- **Architecture (AD-3)**: Vertical slice organized under `src/features/devices/` with dedicated components and barrel export `index.js`.\n- **Two-Pass Decomposition**: Pass 1 is strictly the visual shell with static mock data, zero dynamic API requests, and zero React state hooks.\n\n---\n\n## Code Map\n\nThe implementation of Story 3.1 is strictly bounded to the following files:\n\n- `src/features/devices/components/DeviceCatalogView.jsx`: Main catalog surface with search bar placeholder, status filter dropdowns, and unassigned device queue.\n- `src/features/devices/components/DeviceCard.jsx`: Visual representation of active/assigned edge controllers matching Figma `#231:1152`.\n- `src/features/devices/components/UnassignedCard.jsx`: Visual card for unprovisioned hardware awaiting commissioning matching Figma `#256:10410`.\n- `src/features/devices/index.js`: Feature barrel export.\n- `src/features/devices/components/DeviceCatalogView.test.jsx`: Visual shell regression tests.\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Device Catalog surface renders with title \"Device Inventory\", search input placeholder, and status filter trigger (\"All Statuses\").\n- [x] Device listing table/grid renders mock hardware items with serial number, MAC address, device model, and color-coded status pills (`Active`, `Inactive`, `Alarm`).\n- [x] Unassigned Device Queue (`#256:10410`) renders highlighted unprovisioned controllers with \"+ Assign to Site\" button.\n- [x] Strict Zero Dynamic State constraint maintained (pure static visual layout).\n- [x] Production build (`npm run build`) and test suite (`npm test`) pass with zero regressions.\n"},{"id":"_acl-output_4-implementation_story-3-2_md","folderPath":"_acl-output/4-implementation","filename":"story-3-2.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-14T09:55:56.092Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T09:42:53.151Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 3.2: Device Catalog Functional Wiring & State\"\nstory_id: \"3.2\"\nepic_id: \"3\"\nproject_type: greenfield\ncreated: 2026-10-14\n---\n\n# Story 3.2: Device Catalog Functional Wiring & State (Pass 2)\n\n## Overview & User Story\n\nAs a field service technician,  \nI want to filter devices by status, search by serial/MAC, and provision unassigned edge controllers into physical facility zones,  \nSo that I can inspect device health, troubleshoot alarms, and commission hardware in accordance with facility policies.\n\n---\n\n## Technical Contract & 5-State Component Matrix\n\n- **Target Component**: `src/features/devices/components/DeviceCatalogView.jsx`.\n- **Assignment Modal**: Modal dialog for assigning unassigned controllers to a selected Site and Zone.\n- **Search & Filter Wiring**:\n  - Search query filtering by Serial Number, MAC address, and Model.\n  - Status filter toggle (`All`, `Active`, `Alarm`, `Inactive`).\n- **Mandatory 5-State Component Matrix**:\n  1. **State 1 (Default / Baseline)**: Full catalog with interactive search, filter tabs, device cards, and unassigned queue.\n  2. **State 2 (Loading Skeleton / Indicator)**: Shimmer skeleton cards (`animate-pulse`) across unassigned queue and catalog grid.\n  3. **State 3 (Empty UI)**: When zero search/filter results match, renders \"No devices found matching your criteria\" with a \"Clear Filters\" action.\n  4. **State 4 (Error Banner)**: Telemetry failure renders alert banner with \"Retry\" action while maintaining cached offline hardware.\n  5. **State 5 (Overflow)**: Long serial numbers / MAC addresses truncate cleanly; responsive grid adapts across screen widths.\n\n---\n\n## Code Map\n\n- `src/features/devices/components/DeviceCatalogView.jsx`: Add interactive search, status filtering, assignment modal state, and 5-state matrix rendering.\n- `src/features/devices/components/AssignDeviceModal.jsx`: Modal for selecting site and zone for an unassigned controller.\n- `src/features/devices/index.js`: Barrel export updates.\n- `src/features/devices/components/DeviceCatalogView.test.jsx`: Vitest tests covering:\n  - Client-side search and status filter matching\n  - 5-State Component Matrix\n  - Assignment modal opening, form fields, and submit handler\n  - Error banner and retry trigger\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Client-side search filters devices dynamically by serial number, MAC address, or model.\n- [x] Status filter buttons (`All`, `Active`, `Alarm`, `Inactive`) filter devices with count badges.\n- [x] Clicking \"+ Assign to Site\" on an unassigned card opens the assignment modal allowing site/zone selection.\n- [x] 5-State Component Matrix fully supported:\n  - [x] Default state with active search and filtered results\n  - [x] Loading skeleton with shimmer cards\n  - [x] Empty state with \"Clear Filters\" action\n  - [x] Error banner with retry trigger\n  - [x] Overflow handling with responsive wrapping\n- [x] Automated Vitest suite passes covering filtering, 5-state matrix, and assignment workflow.\n- [x] Full regression verification (`npm test` and `npm run build`) passes with zero errors.\n"},{"id":"_acl-output_4-implementation_story-4-1_md","folderPath":"_acl-output/4-implementation","filename":"story-4-1.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T07:22:56.264Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T09:56:55.642Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 4.1: Site Navigation & Point On Map Visual Shell\"\nstory_id: \"4.1\"\nepic_id: \"4\"\nproject_type: greenfield\ncreated: 2026-10-14\n---\n\n# Story 4.1: Site Navigation & Point On Map Visual Shell (Pass 1)\n\n## Overview & User Story\n\nAs a frontend developer,  \nI want to construct the static visual layout for the Site Navigation console and Geographic Map visualizer,  \nSo that the layout mirrors Figma components `Devices - Sites` (`#362:14621`) and `Point On Map` (`#290:5447`) with 100% pixel-perfect fidelity.\n\n---\n\n## Technical Contract & Design Invariants\n\n- **Design Reference**: Figma Canvas `🌷 Web` (Node `104:7811`), specifically `Devices - Sites` (`#362:14621`) and `Point On Map` (`#290:5447`).\n- **Typography (AD-1)**: `Roboto` (weights: 400, 500, 600, 700) and `Inter` imported via Google Fonts in `index.html`.\n- **Design Tokens (AD-2)**: Colors and shadows bound to `src/assets/figma/theme.css`:\n  - Canvas Surface: `#0d0d14`\n  - Split-pane Card Surface: `#161722`\n  - Map Viewport Container: `#12131c`\n  - Border Stroke: `#2e303a`\n  - Healthy Status Green: `#34C759`\n  - Warning Status Orange: `#FE5B26`\n  - Critical Status Red: `#E50026`\n  - Interactive Action Blue: `#4d80ff`\n- **Architecture (AD-3)**: Feature vertical slice organized under `src/features/sites/` with components and barrel export.\n- **Two-Pass Decomposition**: Pass 1 is strictly the visual shell with static mock facilities, static map pin markers, zero external map tiles API dependencies, and zero React state hooks.\n\n---\n\n## Code Map\n\nThe implementation of Story 4.1 is strictly bounded to the following files:\n\n- `src/features/sites/components/SiteNavigationView.jsx`: Split-pane layout with map container on left and facility list on right.\n- `src/features/sites/components/FacilityCard.jsx`: Visual representation of a facility site with health badge, address, zone count, and coordinates.\n- `src/features/sites/components/PointOnMapView.jsx`: Static map container with SVG geographic grid and facility pin markers matching Figma `#290:5447`.\n- `src/features/sites/index.js`: Feature barrel export.\n- `src/features/sites/components/SiteNavigationView.test.jsx`: Unit test suite verifying visual shell rendering.\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Split-pane layout renders with interactive map container on the left and facility catalog cards on the right.\n- [x] Point On Map component (`#290:5447`) displays SVG geographic map canvas with styled location pins matching Figma tokens.\n- [x] Facility cards render with site name, physical city/state address, active device count, zone count, and health badge (`Healthy`, `Warning`, `Critical`).\n- [x] Visual shell complies with strict Zero Dynamic State constraint (static presentation with mock facility data).\n- [x] Production build (`npm run build`) and test suite (`npm test`) pass with zero regressions.\n"},{"id":"_acl-output_4-implementation_story-4-2_md","folderPath":"_acl-output/4-implementation","filename":"story-4-2.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-14T10:21:42.835Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T10:12:54.772Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 4.2: Site Hierarchy Functional Wiring & Geographic Filtering\"\nstory_id: \"4.2\"\nepic_id: \"4\"\nproject_type: greenfield\ncreated: 2026-10-14\n---\n\n# Story 4.2: Site Hierarchy Functional Wiring & Geographic Filtering (Pass 2)\n\n## Overview & User Story\n\nAs a facilities director,  \nI want to interact with geographic site map pins, filter facilities by region, and drill down through hierarchical facility zones (Building > Floor > Zone),  \nSo that I can locate hardware physically and inspect site-level operational health.\n\n---\n\n## Technical Contract & 5-State Component Matrix\n\n- **Target Components**: `src/features/sites/components/SiteNavigationView.jsx`, `PointOnMapView.jsx`, `FacilityCard.jsx`, and `ZoneDrilldownDrawer.jsx`.\n- **Interactive State**: Selected facility selection synchronization between map pins and cards, regional search filter, and zone hierarchy navigation.\n- **Hierarchical Drill-Down**: Building > Floor > Zone breadcrumb and telemetry inspector.\n- **Mandatory 5-State Component Matrix**:\n  1. **State 1 (Default / Baseline)**: Interactive map with clickable pins synchronized with facility catalog and drill-down zone panel.\n  2. **State 2 (Loading Skeleton / Overlay)**: Shimmer skeleton cards for facility directory and pulsating centering radar on map.\n  3. **State 3 (Empty UI)**: When a filtered region contains zero sites, renders \"No sites configured in this region\" with an \"+ Add Site\" trigger.\n  4. **State 4 (Error Banner)**: Map telemetry failure shows an inline alert banner with a \"Retry Connection\" action while maintaining cached offline facility list.\n  5. **State 5 (Overflow)**: Long facility titles clamp cleanly; zone tree supports deep hierarchy without horizontal viewport overflow.\n\n---\n\n## Code Map\n\n- `src/features/sites/components/SiteNavigationView.jsx`: Wire interactive selection state, search filtering, zone drilldown, and 5-state matrix rendering.\n- `src/features/sites/components/ZoneDrilldownDrawer.jsx`: Collapsible zone hierarchy drawer (Building > Floor > Room/Zone).\n- `src/features/sites/index.js`: Barrel export updates.\n- `src/features/sites/components/SiteNavigationView.test.jsx`: Unit test suite verifying:\n  - Pin-to-card selection synchronization\n  - Regional keyword search\n  - 5-State Component Matrix\n  - Zone drill-down hierarchy expansion\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Clicking a map pin synchronizes and highlights the corresponding facility card (and vice-versa).\n- [x] Regional search filter dynamically filters facilities in < 50ms.\n- [x] Zone drilldown drawer displays hierarchical zones (Building > Floor > Zone) for the active facility.\n- [x] 5-State Component Matrix fully supported:\n  - [x] Default state with synchronized map and list\n  - [x] Loading skeleton with shimmer cards\n  - [x] Empty state with \"Add Site\" trigger\n  - [x] Error banner with retry trigger\n  - [x] Overflow handling with responsive layout\n- [x] Automated Vitest suite passes covering pin selection, zone hierarchy, and 5-state matrix.\n- [x] Full regression verification (`npm test` and `npm run build`) passes with zero errors.\n"},{"id":"_acl-output_4-implementation_story-5-1_md","folderPath":"_acl-output/4-implementation","filename":"story-5-1.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T07:22:56.312Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-14T10:22:20.299Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 5.1: Alarm Feed & Incident Triage Visual Shell\"\nstory_id: \"5.1\"\nepic_id: \"5\"\nproject_type: greenfield\ncreated: 2026-10-14\n---\n\n# Story 5.1: Alarm Feed & Incident Triage Visual Shell (Pass 1)\n\n## Overview & User Story\n\nAs a frontend developer,  \nI want to build the static visual layout for the Alarm Triage console and incident queue,  \nSo that the alarm feed and list rows match Figma frames `Manage Alarms` (`#293:8138`), `Manage Alarms List` (`#293:10463`), and `Devices - Alarms` (`#362:14623`) with 100% pixel-perfect fidelity.\n\n---\n\n## Technical Contract & Design Invariants\n\n- **Design Reference**: Figma Canvas `🌷 Web` (Node `104:7811`), specifically `Manage Alarms` (`#293:8138`), `Manage Alarms List` (`#293:10463`), and `Devices - Alarms` (`#362:14623`).\n- **Typography (AD-1)**: `Roboto` (weights: 400, 500, 600, 700) and `Inter` imported via Google Fonts in `index.html`.\n- **Design Tokens (AD-2)**: Colors and shadows bound to `src/assets/figma/theme.css`:\n  - Canvas Surface: `#0d0d14`\n  - Alarm Row Surface: `#161722`\n  - Border Stroke: `#2e303a`\n  - Critical Severity Red: `#E50026`\n  - Major Severity Orange: `#FE5B26`\n  - Minor Severity Coral: `#FF8C65`\n  - Info Severity Blue: `#0A93D3`\n  - Acknowledge Action: `#264072` / `#4d80ff`\n- **Architecture (AD-3)**: Feature vertical slice organized under `src/features/alarms/` with components and barrel export.\n- **Two-Pass Decomposition**: Pass 1 is strictly the visual shell with static mock alarm incidents, zero live WebSocket connections, and zero React state hooks.\n\n---\n\n## Code Map\n\nThe implementation of Story 5.1 is strictly bounded to the following files:\n\n- `src/features/alarms/components/AlarmTriageView.jsx`: Alarm queue console with severity summary counters, filter tabs, and alarm incident table.\n- `src/features/alarms/components/AlarmRow.jsx`: Individual incident row displaying severity pill, timestamp, device identifier, location breadcrumb, error message, and static \"Acknowledge\" button.\n- `src/features/alarms/index.js`: Feature barrel export.\n- `src/features/alarms/components/AlarmTriageView.test.jsx`: Unit test suite verifying visual shell rendering.\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Alarm Triage surface renders with heading \"Alarm & Incident Triage Stream\" and severity summary cards (Critical, Major, Minor, Info).\n- [x] Alarm table renders severity-ranked rows with color-coded badges:\n  - Critical (`#E50026`)\n  - Major (`#FE5B26`)\n  - Minor (`#FF8C65`)\n  - Info (`#0A93D3`)\n- [x] Each alarm row displays timestamp, device model, serial number link, site/zone location, incident message, and static \"Acknowledge\" action button.\n- [x] Visual shell complies with strict Zero Dynamic State constraint (static mock incidents with zero active sockets).\n- [x] Production build (`npm run build`) and test suite (`npm test`) pass with zero regressions.\n"},{"id":"_acl-output_4-implementation_story-5-2_md","folderPath":"_acl-output/4-implementation","filename":"story-5-2.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T04:25:28.925Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-15T04:23:19.812Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 5.2: Alarm Stream Functional Wiring & Acknowledgment Workflow\"\nstory_id: \"5.2\"\nepic_id: \"5\"\nproject_type: greenfield\ncreated: 2026-10-15\n---\n\n# Story 5.2: Alarm Stream Functional Wiring & Acknowledgment Workflow (Pass 2)\n\n## Overview & User Story\n\nAs a shift operator,  \nI want to receive real-time alarm updates, acknowledge active incidents with resolution notes, and filter by severity,  \nSo that equipment anomalies are immediately triaged, assigned, and logged for operational compliance.\n\n---\n\n## Technical Contract & 5-State Component Matrix\n\n- **Target Component**: `src/features/alarms/components/AlarmTriageView.jsx`, `AlarmRow.jsx`, and `AcknowledgeModal.jsx`.\n- **Acknowledgment Workflow**: Clicking \"Acknowledge\" opens an incident comment modal capturing operator resolution notes, transition to `Acknowledged` state, and audit timestamping.\n- **Severity Filtering & Device Navigation**: Filter queue by severity tabs (`All`, `Critical`, `Major`, `Minor`, `Info`); device link triggers navigation callback.\n- **Mandatory 5-State Component Matrix**:\n  1. **State 1 (Default / Baseline)**: Live incident feed with severity summary counters, filter tabs, interactive acknowledgment, and device links.\n  2. **State 2 (Loading Skeleton / Indicator)**: Shimmer skeleton rows with pulsating severity placeholders during event stream sync.\n  3. **State 3 (Empty UI)**: Zero active alarms renders green operational shield (\"All systems operational • Zero active threshold breaches\").\n  4. **State 4 (Error Banner)**: Event stream disconnection renders a sticky banner with auto-reconnection trigger (\"Telemetry event stream disconnected. Reconnecting...\").\n  5. **State 5 (Overflow)**: Long incident descriptions clamp to 2 lines with expand toggle; queue handles responsive scrolling.\n\n---\n\n## Code Map\n\n- `src/features/alarms/components/AlarmTriageView.jsx`: Wire interactive state, severity filtering, modal orchestration, and 5-state matrix rendering.\n- `src/features/alarms/components/AcknowledgeModal.jsx`: Modal dialog for operator notes and incident acknowledgment.\n- `src/features/alarms/index.js`: Barrel export updates.\n- `src/features/alarms/components/AlarmTriageView.test.jsx`: Vitest unit tests verifying:\n  - Severity filtering and active counters\n  - Acknowledgment workflow and status mutation\n  - 5-State Component Matrix (Default, Loading skeleton, Empty state, Error banner, Overflow)\n  - Device navigation callback\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Severity filter tabs (`All`, `Critical`, `Major`, `Minor`, `Info`) dynamically filter the active alarm queue.\n- [x] Clicking \"Acknowledge\" opens `AcknowledgeModal` allowing resolution notes entry; confirming mutates status to `Acknowledged` with operator attribution.\n- [x] Clicking a device serial number triggers navigation callback (`onInspectDevice`).\n- [x] 5-State Component Matrix fully supported:\n  - [x] Default state with active incident queue and severity counters\n  - [x] Loading skeleton with shimmer rows\n  - [x] Empty state with \"All systems operational\" shield graphic\n  - [x] Error banner with reconnection trigger\n  - [x] Overflow handling with line clamping\n- [x] Automated Vitest suite passes covering filtering, acknowledgment, and 5-state matrix.\n- [x] Full regression verification (`npm test` and `npm run build`) passes with zero errors.\n"},{"id":"_acl-output_4-implementation_story-6-1_md","folderPath":"_acl-output/4-implementation","filename":"story-6-1.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-16T08:50:45.307Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-15T04:26:03.132Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 6.1: User Directory & Provisioning Visual Shell\"\nstory_id: \"6.1\"\nepic_id: \"6\"\nproject_type: greenfield\ncreated: 2026-10-15\n---\n\n# Story 6.1: User Directory & Provisioning Visual Shell (Pass 1)\n\n## Overview & User Story\n\nAs a frontend developer,  \nI want to implement the static visual presentation for the User Directory console,  \nSo that the user table, role badges, site association tags, and invite dialog mirror Figma component `Devices - Users` (`#362:14622`) with 100% pixel-perfect fidelity.\n\n---\n\n## Technical Contract & Design Invariants\n\n- **Design Reference**: Figma Canvas `🌷 Web` (Node `104:7811`), specifically `Devices - Users` (`#362:14622`).\n- **Typography (AD-1)**: `Roboto` (weights: 400, 500, 600, 700) and `Inter` imported via Google Fonts in `index.html`.\n- **Design Tokens (AD-2)**: Colors and shadows bound to `src/assets/figma/theme.css`:\n  - Canvas Surface: `#0d0d14`\n  - Table / Card Container Surface: `#161722`\n  - Border Stroke: `#2e303a`\n  - Admin Role Purple: `#aa3bff`\n  - Site Manager Role Blue: `#4d80ff`\n  - Technician Role Orange: `#fe5b26`\n  - Viewer Role Gray: `#9ca0b3`\n- **Architecture (AD-3)**: Vertical slice organized under `src/features/users/` with dedicated components and barrel export.\n- **Two-Pass Decomposition**: Pass 1 is strictly the visual shell with static mock operator profiles, zero live network requests, and zero React state hooks.\n\n---\n\n## Code Map\n\nThe implementation of Story 6.1 is strictly bounded to the following files:\n\n- `src/features/users/components/UserDirectoryView.jsx`: User management console with search bar placeholder, role filter pills, user count badge, and \"+ Invite User\" action trigger.\n- `src/features/users/components/UserRow.jsx`: Individual operator row with avatar initials, name, email, role badge, assigned facility tags, status pill, and action buttons.\n- `src/features/users/components/InviteUserModal.jsx`: Static visual modal for inviting new team members and setting initial site roles.\n- `src/features/users/index.js`: Feature barrel export.\n- `src/features/users/components/UserDirectoryView.test.jsx`: Unit test suite verifying visual shell rendering.\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] User Directory surface renders with title \"Team & Access Governance\", search input placeholder, and role filter tabs.\n- [x] User table renders mock operators with initials avatars, names, organizational emails, color-coded role badges (`Admin`, `Site Manager`, `Technician`, `Viewer`), and assigned facility tags.\n- [x] Invite User modal layout displays with input fields (Full Name, Organizational Email, Role, Target Site).\n- [x] Visual shell complies with strict Zero Dynamic State constraint (static visual layout).\n- [x] Production build (`npm run build`) and test suite (`npm test`) pass with zero regressions.\n"},{"id":"_acl-output_4-implementation_story-6-2_md","folderPath":"_acl-output/4-implementation","filename":"story-6-2.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-10-15T04:32:18.582Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-10-15T04:30:40.966Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 6.2: User Administration Functional Wiring & Per-Site RBAC Guard\"\nstory_id: \"6.2\"\nepic_id: \"6\"\nproject_type: greenfield\ncreated: 2026-10-15\n---\n\n# Story 6.2: User Administration Functional Wiring & Per-Site RBAC Guard (Pass 2)\n\n## Overview & User Story\n\nAs an IT security administrator,  \nI want to invite new operators, assign site-role permissions, filter directory records, and revoke active sessions,  \nSo that facilities and industrial devices are governed strictly under per-site role-based authorization policies (AD-5).\n\n---\n\n## Technical Contract & 5-State Component Matrix\n\n- **Target Components**: `src/features/users/components/UserDirectoryView.jsx`, `UserRow.jsx`, and `InviteUserModal.jsx`.\n- **RBAC Policy Guard**: Enforces per-site role assignments (`Admin`, `Site Manager`, `Technician`, `Viewer`).\n- **Directory Search & Role Filtering**: Client-side query search by name, email, or assigned site; role filtering tabs.\n- **Invitation & Revocation Workflow**:\n  - Submitting `InviteUserModal` dynamically provisions an invited operator and adds an audit log toast.\n  - Clicking \"Revoke\" invalidates the operator's active session.\n- **Mandatory 5-State Component Matrix**:\n  1. **State 1 (Default / Baseline)**: Interactive operator directory with dynamic role filters, search matching, and permission actions.\n  2. **State 2 (Loading Skeleton / Indicator)**: Shimmer skeleton user rows during directory directory synchronization.\n  3. **State 3 (Empty UI)**: When search or filter returns zero matches, renders \"No operators found\" with an \"+ Invite Operator\" action.\n  4. **State 4 (Error Banner)**: Access governance failure renders an inline alert banner with a \"Retry Directory Sync\" action.\n  5. **State 5 (Overflow)**: Operators assigned to multiple sites display concise tags without row clipping; long emails truncate cleanly.\n\n---\n\n## Code Map\n\n- `src/features/users/components/UserDirectoryView.jsx`: Wire interactive search, role filter tabs, invite modal state, access revocation, and 5-state matrix rendering.\n- `src/features/users/components/InviteUserModal.jsx`: Wire validation and invitation payload submission handler.\n- `src/features/users/index.js`: Feature barrel export updates.\n- `src/features/users/components/UserDirectoryView.test.jsx`: Vitest unit tests verifying:\n  - Role-based filtering and search query matching\n  - User invitation dispatch and directory append\n  - Access revocation and status invalidation\n  - 5-State Component Matrix (Default, Loading skeleton, Empty state, Error banner, Overflow)\n\n---\n\n## Acceptance Criteria Checklist\n\n- [x] Search query dynamically filters directory records by name, email, or assigned facility in < 50ms.\n- [x] Role filter tabs (`All`, `Admin`, `Site Manager`, `Technician`, `Viewer`) filter the operator list.\n- [x] Submitting `InviteUserModal` creates an invited operator with assigned site scopes and displays success toast.\n- [x] Revoke button removes operator permissions and invalidates active session.\n- [x] 5-State Component Matrix fully supported:\n  - [x] Default state with active operator records\n  - [x] Loading skeleton with shimmer rows\n  - [x] Empty state with \"No operators found\" and invite trigger\n  - [x] Error banner with retry trigger\n  - [x] Overflow handling for multi-site scopes\n- [x] Automated Vitest suite passes covering search, invitation, revocation, and 5-state matrix.\n- [x] Full regression verification (`npm test` and `npm run build`) passes with zero errors.\n"}];

* `random -n 5 --spread`, excluding everything already offered.\r\n\r\n## The Menu\r\n\r\n```\r\n**Advanced Elicitation Options**\r\nChoose a number (1-5), [r] to Reshuffle, [a] List All, or [x] to Proceed:\r\n\r\n1. [Method Name]\r\n2. [Method Name]\r\n3. [Method Name]\r\n4. [Method Name]\r\n5. [Method Name]\r\nr. Reshuffle the list with 5 new options\r\na. List all methods with descriptions\r\nx. Proceed / No Further Actions\r\n```\r\n\r\nThis menu is the interface other skills and their users rely on — keep its options and behavior stable. When party mode is active in the session, add `_Party mode is active — agents will join in._` under the heading. Handle the response:\r\n\r\n- **1–5** — run that method (several numbers: in sequence), then re-present the menu.\r\n- **r** — reshuffle as above and re-present.\r\n- **a** — show the full catalog (`list --all`) as a compact table; a pick by name or number runs like a numbered choice.\r\n- **x** — done. The current enhanced version is final for this content: hand it back to the invoking skill as the replacement for what it had, and signal completion so it continues. If anything shown was never accepted, confirm what should carry over before returning.\r\n- **Anything else** — treat as direction: apply it to the target and re-present the menu.\r\n\r\n## Running a Method\r\n\r\nUse the method's description as its intent and its output_pattern as a flexible flow guide; scale depth to the target — a paragraph gets a light pass, an architecture decision gets the full treatment. Each application works on the current enhanced version, so refinements compound. Show what the method revealed and the changes it proposes, then ask whether to apply them (y/n/other) and wait — never change the work without a yes; on no, drop the proposal entirely; any other reply is instruction to follow.\r\n\r\nWhen a method casts personas (round tables, panels, debates), reuse party members already in the session if party mode is active; otherwi by reading these three files in base → team → user order and applying the same structural merge rules as the resolver:\r\n\r\n1. `{skill-root}/customize.toml` — defaults\r\n2. `{project-root}/_acl/custom/{skill-name}.toml` — team overrides\r\n3. `{project-root}/_acl/custom/{skill-name}.user.toml` — personal overrides\r\n\r\nAny missing file is skipped. Scalars override, tables deep-merge, arrays of tables keyed by `code` or `id` replace matching entries and append new entries, and all other arrays append.\r\n\r\n### Step 2: Execute Prepend Steps\r\n\r\nExecute each entry in `{agent.activation_steps_prepend}` in order before proceeding.\r\n\r\n### Step 3: Adopt Persona\r\n\r\nAdopt the Paige / Technical Writer identity established in the Overview. Layer the customized persona on top: fill the additional role of `{agent.role}`, embody `{agent.identity}`, speak in the style of `{agent.communication_style}`, and follow `{agent.principles}`.\r\n\r\nFully embody this persona so the user gets the best experience. Do not break character until the user dismisses the persona. When the user calls a skill, this persona carries through and remains active.\r\n\r\n### Step 4: Load Persistent Facts\r\n\r\nTreat every entry in `{agent.persistent_facts}` as foundational context you carry for the rest of the session. Entries prefixed `file:` are paths or globs under `{project-root}` — load the referenced contents as facts. All other entries are facts verbatim.\r\n\r\n### Step 5: Load Config\r\n\r\nLoad config from `{project-root}/_acl/acl/config.yaml` and resolve:\r\n- Use `{user_name}` for greeting\r\n- Use `{communication_language}` for all communications\r\n- Use `{document_output_language}` for output documents\r\n- Use `{planning_artifacts}` for output location and artifact scanning\r\n- Use `{project_knowledge}` for additional context scanning\r\n\r\n### Step 6: Greet the User\r\n\r\nGreet `{user_name}` warmly by name as Paige, speaking in `{communication_language}`. Lead the greeting with `{agent.icon}` so the user can see at a glance which agent is speaking. Remind the user they can invoke the `acl-help` skill at any time for advice.\r\n\r\nContinue to prefix your messages with `{agent.icon}` throughout the session so the active persona stays visually identifiable.\r\n\r\n### Step 7: Execute Append Steps\r\n\r\nExecute each entry in `{agent.activation_steps_append}` in order.\r\n\r\nActivation is complete. If `activation_steps_prepend` or `activation_steps_append` were non-empty, confirm every entry was executed in order before proceeding. Do not begin the main workflow until all activation steps have been completed.\r\n\r\n### Step 8: Dispatch or Present the Menu\r\n\r\nIf the user's initial message already names an intent that clearly maps to a menu item (e.g. \"hey Paige, let's document this codebase\"), skip the menu and dispatch that item directly after greeting.\r\n\r\nOtherwise render `{agent.menu}` as a numbered table: `Code`, `Description`, `Action` (the item's `skill` name, or a short label derived from its `prompt` text). **Stop and wait for input.** Accept a number, menu `code`, or fuzzy description match.\r\n\r\nDispatch on a clear match by invoking the item's `skill` or executing its `prompt`. Only pause to clarify when two or more items are genuinely close — one short question, not a confirmation ritual. When nothing on the menu fits, just continue the conversation; chat, clarifying questions, and `acl-help` are always fair game.\r\n\r\nFrom here, Paige stays active — persona, persistent facts, `{agent.icon}` prefix, and `{communication_language}` carry into every turn until the user dismisses her.\r\n"},"commands":{"claude":"/acl-agent-tech-writer","cursor":"@acl-agent-tech-writer","windsurf":"/acl-agent-tech-writer","copilot":"@github /acl-agent-tech-writer","antigravity":"/acl-agent-tech-writer","universal":"Act as the ACL-ADLC acl-agent-tech-writer (acl-agent-tech-writer). Adhere to the Phase-Gate Governance in Markdow
