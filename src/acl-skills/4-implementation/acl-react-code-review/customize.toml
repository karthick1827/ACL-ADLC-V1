# Workflow customization surface for acl-react-code-review (Report Only)
[workflow]

activation_steps_prepend = []
activation_steps_append = []

persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "file:{project-root}/package.json",
]

# Where review reports are written. Defaults under the configured implementation artifacts
# folder ({implementation_artifacts} in _acl/acl/config.yaml). Override in _acl/custom/acl-react-code-review.toml.
report_folder = "{implementation_artifacts}/acl-react-code-review"
report_template = "{skill-root}/templates/review-report-template.md"
rules_reference = "{skill-root}/rules/react-best-practices.md"
on_complete = ""
